extends: default
ignore: |
  apps/**/templates/**
  argocd/**/templates/**
  apps/volsync/crds/crds.yaml
  clusters/production/Chart.yaml
  clusters/production/values.yaml
  clusters/production/templates/**
  clusters/production/charts/**
  clusters/production/values/**
  clusters/production/nodes/**
  clusters/development/Chart.yaml
  clusters/development/values.yaml
  clusters/development/templates/**
  clusters/development/charts/**
  clusters/development/nodes/**
rules:
  truthy: disable
  document-start: disable
  line-length:
    max: 251
    level: warning
  braces:
    forbid: false
    max-spaces-inside: 1
