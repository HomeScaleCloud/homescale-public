extends: default
ignore: |
  infra/topf/**/*.yaml.tpl
  apps/**/templates/**
  argocd/**/templates/**
  apps/volsync/crds/crds.yaml
  clusters/*/output/**
rules:
  truthy: disable
  document-start: disable
  line-length:
    max: 251
    level: warning
  braces:
    forbid: false
    max-spaces-inside: 1
