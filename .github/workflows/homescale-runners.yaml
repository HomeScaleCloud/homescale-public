name: "HomeScale Runners"

permissions:
  actions: read
  id-token: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: false
    outputs:
      self_hosted:
        description: "true if the homescale-runners self-hosted runner pool is online"
        value: ${{ jobs.availability.outputs.self_hosted }}

jobs:
  availability:
    name: "Resolve availability"
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.check.outputs.self_hosted }}
    steps:
      # The default GITHUB_TOKEN cannot list self-hosted runners at all -- confirmed
      # empirically (403 "Resource not accessible by integration") even with
      # `actions: read` correctly granted and propagated through the whole call chain.
      # This is a hard GitHub restriction on the ephemeral Actions token for runner-
      # management endpoints, not a permissions misconfiguration on our side, and it
      # applies at both repo and org scope. There's no way around it other than
      # authenticating as something else, so mint a short-lived, org-scoped
      # installation token from the same GitHub App already used for runner
      # registration (it already has the organization_self_hosted_runners:read
      # permission needed). The runner pool itself is org-scoped (githubConfigUrl in
      # apps/github-runner/app.yaml) so any repo in the org can use it -- since this
      # check already has to authenticate as the App regardless of scope, there's no
      # simplicity win left in keeping the pool repo-scoped. Every step here is
      # defensive: any failure (Infisical unreachable, App auth failure, API error)
      # must degrade to "unavailable" rather than fail this job -- every downstream
      # job needs this one, so a hard failure here would skip all of CI instead of
      # just falling back to cloud runners.
      - name: Import GitHub App credentials
        id: infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/k8s/github-runner"
          export-type: env

      - name: Mint org-scoped installation token
        id: app_token
        if: steps.infisical.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ env.github_app_id }}
          private-key: ${{ env.github_app_private_key }}
          owner: HomeScaleCloud

      - name: Check homescale-runners runner pool
        id: check
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        run: |
          set -uo pipefail
          # ARC-managed runners don't populate the classic .labels[] field on this
          # API at all (confirmed empirically -- every runner reports labels: []
          # regardless of scale set), so matching has to be by runner name instead.
          # ARC always names them <runnerScaleSetName>-<suffix>-runner-<suffix>.
          online=$(gh api "/orgs/HomeScaleCloud/actions/runners" --paginate \
            --jq '[.runners[]? | select(.status == "online") | select(.name | startswith("homescale-runners-"))] | length' \
            2>&1) || online=0
          online="${online:-0}"
          if ! [[ "$online" =~ ^[0-9]+$ ]]; then
            echo "Runner check produced non-numeric output, treating as unavailable: $online"
            online=0
          fi
          if [ "$online" -gt 0 ]; then
            echo "homescale-runners pool is online ($online runner(s))"
            echo "self_hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "homescale-runners pool is unavailable, falling back to cloud runners"
            echo "self_hosted=false" >> "$GITHUB_OUTPUT"
          fi
