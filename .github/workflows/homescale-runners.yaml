name: "HomeScale Runners"

permissions:
  id-token: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: false
    outputs:
      self_hosted:
        description: "true if the homescale-runners self-hosted runner pool is online"
        value: ${{ jobs.availability.outputs.self_hosted }}

jobs:
  availability:
    name: "Resolve availability"
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.check.outputs.self_hosted }}
    steps:
      # The default GITHUB_TOKEN cannot list self-hosted runners at all -- confirmed
      # empirically (403 "Resource not accessible by integration") even with
      # `actions: read` granted, at both repo and org scope. This needs a real user
      # token instead: a fine-grained PAT (org owner, "Self-hosted runners: Read-only"
      # organization permission), stored in Infisical at /github-actions like every
      # other CI-only secret, not a raw GitHub Actions secret. Both steps here are
      # defensive: if Infisical is unreachable or the token is missing/invalid, this
      # degrades to "unavailable" rather than failing the job -- every downstream job
      # needs this one, so a hard failure here would skip all of CI instead of just
      # falling back to cloud runners.
      - name: Import RUNNER_CHECK_TOKEN
        id: infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/github-actions"
          export-type: env

      - name: Check homescale-runners runner pool
        id: check
        env:
          GH_TOKEN: ${{ env.RUNNER_CHECK_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RUNNER_CHECK_TOKEN unavailable, falling back to cloud runners"
            echo "self_hosted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ARC-managed runners don't populate the classic .labels[] field on this
          # API at all (confirmed empirically -- every runner reports labels: []
          # regardless of scale set), so matching has to be by runner name instead.
          # ARC always names them <runnerScaleSetName>-<suffix>-runner-<suffix>.
          online=$(gh api "/orgs/HomeScaleCloud/actions/runners" --paginate \
            --jq '[.runners[]? | select(.status == "online") | select(.busy == false) | select(.name | startswith("homescale-runners-"))] | length' \
            2>&1) || online=0
          online="${online:-0}"
          if ! [[ "$online" =~ ^[0-9]+$ ]]; then
            echo "Runner check produced non-numeric output, treating as unavailable: $online"
            online=0
          fi
          if [ "$online" -gt 0 ]; then
            echo "homescale-runners pool is online ($online runner(s))"
            echo "self_hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "homescale-runners pool is unavailable, falling back to cloud runners"
            echo "self_hosted=false" >> "$GITHUB_OUTPUT"
          fi
