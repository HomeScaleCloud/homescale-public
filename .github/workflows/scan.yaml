name: "Scan"
permissions:
  actions: read
  packages: read
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      pr_title:
        type: string
        default: ''
  workflow_dispatch:

jobs:
  prlint:
    name: "PR Lint"
    if: inputs.pr_title != ''
    runs-on: ubuntu-latest
    steps:
      - name: "Validate PR title"
        env:
          TITLE: ${{ inputs.pr_title }}
        run: |
          pattern='^(feat|fix|chore|refactor|docs|style|test|perf|ci|build|revert)(\([a-z0-9/_-]+\))?(!)?: .+$'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "PR title must follow Conventional Commits format: type(scope): description"
            echo "Types: feat fix chore refactor docs style test perf ci build revert"
            echo "Got: $TITLE"
            exit 1
          fi

  pre-commit:
    name: "pre-commit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43  # v1.1.0
        if: always()


  manifests:
    name: "Manifests"
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.7.0"
      KUBERNETES_VERSION: "1.34.0"
      YQ_VERSION: "4.47.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install helm and yq
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Cache chart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            apps/*/charts
            apps/*/Chart.lock
          key: helm-deps-${{ hashFiles('apps/*/Chart.yaml') }}
          restore-keys: |
            helm-deps-
      - name: Render and validate manifests
        run: .github/scripts/validate-manifests.sh

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          skip-version-check: true
          cache: false
