name: "Scan"
permissions:
  actions: read
  packages: read
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      pr_title:
        type: string
        default: ''
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: false
  workflow_dispatch:

jobs:
  homescale-runners:
    name: "HomeScale Runners"
    uses: ./.github/workflows/homescale-runners.yaml

  prlint:
    name: "PR Lint"
    needs: [homescale-runners]
    if: inputs.pr_title != ''
    runs-on: ${{ needs.homescale-runners.outputs.self_hosted == 'true' && 'homescale-runners' || 'ubuntu-latest' }}
    steps:
      - name: "Validate PR title"
        env:
          TITLE: ${{ inputs.pr_title }}
        run: |
          pattern='^(feat|fix|chore|refactor|docs|style|test|perf|ci|build|revert)(\([a-z0-9/_-]+\))?(!)?: .+$'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "PR title must follow Conventional Commits format: type(scope): description"
            echo "Types: feat fix chore refactor docs style test perf ci build revert"
            echo "Got: $TITLE"
            exit 1
          fi

  pre-commit:
    name: "pre-commit"
    needs: [homescale-runners]
    runs-on: ${{ needs.homescale-runners.outputs.self_hosted == 'true' && 'homescale-runners' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        if: needs.homescale-runners.outputs.self_hosted != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Setup Terraform
        if: needs.homescale-runners.outputs.self_hosted != 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
      - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43  # v1.1.0
        if: always()


  trivy:
    name: Trivy
    needs: [homescale-runners]
    runs-on: ${{ needs.homescale-runners.outputs.self_hosted == 'true' && 'homescale-runners' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          skip-version-check: true
