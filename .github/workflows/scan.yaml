name: "Scan"
permissions:
  actions: read
  packages: read
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      pr_title:
        type: string
        default: ''
  workflow_dispatch:

jobs:
  prlint:
    name: "PR Lint"
    if: inputs.pr_title != ''
    runs-on: ubuntu-latest
    steps:
      - name: "Validate PR title"
        env:
          TITLE: ${{ inputs.pr_title }}
        run: |
          pattern='^(feat|fix|chore|refactor|docs|style|test|perf|ci|build|revert)(\([a-z0-9/_-]+\))?(!)?: .+$'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "PR title must follow Conventional Commits format: type(scope): description"
            echo "Types: feat fix chore refactor docs style test perf ci build revert"
            echo "Got: $TITLE"
            exit 1
          fi

  pre-commit:
    name: "pre-commit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          SKIP: runbook-coverage
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc  # v1.2.0
        if: always()

  trivy:
    name: Trivy
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          skip-version-check: true
          cache: false
