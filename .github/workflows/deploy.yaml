name: "Deploy"
permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: true
      INFISICAL_ORG_ID:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      job:
        description: "'terraform', 'update-cluster', 'bootstrap-cluster', or any other ansible playbook filename under infra/ansible/playbooks/ (without .yml)"
        type: string
        required: true
      cluster:
        description: "Cluster to target (leave empty for all clusters)"
        type: string
        required: false
      dry_run:
        description: "Preview only — terraform and update-cluster; bootstrap playbooks ignore this"
        type: boolean
        required: false
        default: false
      extra_args:
        description: "Extra ansible -e key=value pairs, space-separated (any ansible playbook other than bootstrap-cluster/update-cluster)"
        type: string
        required: false

concurrency:
  group: deploy

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'terraform'
    environment: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') && 'terraform' || null }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_infisical_github_actions: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
      TF_VAR_infisical_org_id: ${{ secrets.INFISICAL_ORG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Import Secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
      - name: Install yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v(?<version>.*)$
          YQ_VERSION: "4.47.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Request OIDC Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_AUTH_JWT=$TOKEN" >> "$GITHUB_ENV"

      - name: Plan
        id: plan
        continue-on-error: true
        env:
          DRY_RUN: "true"
          CLUSTER: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster || '' }}
        run: ./infra/terraform/plan-apply.sh > /tmp/tf-plan.txt 2>&1
      - name: Extract rendered Tailnet ACL
        id: tailnet_acl
        if: steps.plan.outcome == 'success'
        run: |
          terraform -chdir=infra/terraform show -json /tmp/tfplan > /tmp/tfplan.json
          RAW=$(jq -r '.resource_changes[]? | select(.address == "module.tailscale.tailscale_acl.this") | .change.after.acl // empty' /tmp/tfplan.json)
          if [ -n "$RAW" ]; then
            echo "$RAW" | jq '.' > /tmp/tailnet-acl.json
            echo "ACL_RENDERED=true" >> "$GITHUB_ENV"
          else
            echo "ACL_RENDERED=false" >> "$GITHUB_ENV"
          fi
      - name: Upload rendered Tailnet ACL artifact
        id: upload_acl
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tailnet-acl
          path: /tmp/tailnet-acl.json
          retention-days: 30
      - name: Write plan to job summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          icon=$([[ "${{ steps.plan.outcome }}" == "success" ]] && echo "✅" || echo "❌")
          {
            echo "## ${icon} Terraform Plan"
            echo ""
            echo '```'
            cat /tmp/tf-plan.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "> commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post plan results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          ACL_ARTIFACT: ${{ steps.upload_acl.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const output = fs.existsSync('/tmp/tf-plan.txt') ? fs.readFileSync('/tmp/tf-plan.txt', 'utf8') : '(no output)';
            let body = `${marker}\n## Terraform plan: ${process.env.PLAN_OUTCOME}\n\n\`\`\`\n${output.slice(0, 55000)}\n\`\`\``;
            if (process.env.ACL_ARTIFACT) body += `\n\n[Rendered Tailscale ACL](${process.env.ACL_ARTIFACT})`;
            const target = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: comments} = await github.rest.issues.listComments({...target, issue_number: context.issue.number, per_page: 100});
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({...target, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...target, issue_number: context.issue.number, body});
            }
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed. See job summary for details."
          exit 1
      - name: Apply
        if: (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.job == 'terraform' && inputs.dry_run != true)
        env:
          CLUSTER: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster || '' }}
        run: ./infra/terraform/plan-apply.sh

  # Preview affected inventories/code on PRs; reconcile every cluster on main.
  cluster-detect:
    name: "Clusters: detect"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.job != 'terraform'
    outputs:
      clusters: ${{ steps.detect.outputs.clusters }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected clusters
        id: detect
        env:
          INPUT_CLUSTER: ${{ inputs.cluster }}
        run: |
          set -euo pipefail
          all_clusters=$(
            find clusters -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/topf.yaml' ';' -print \
              | sed 's#.*/##' \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))'
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_CLUSTER" ]; then
              jq -e --arg c "$INPUT_CLUSTER" 'index($c) != null' <<<"$all_clusters" > /dev/null
              clusters=$(jq -nc --arg c "$INPUT_CLUSTER" '[$c]')
            else
              clusters="$all_clusters"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...${{ github.sha }}"
            changed_files=$(git diff --name-only "$range")

            # Only TOPF inventories affect Talos; Kubernetes manifests sync through ArgoCD.
            changed_cluster_dirs=$(
              echo "$changed_files" \
                | { grep -E '^clusters/[^/]+/topf\.yaml$' || true; } \
                | sed -E 's#^clusters/([^/]+)/.*#\1#'
            )
            base_patches_changed=$(
              echo "$changed_files" \
                | { grep -E '^(infra/topf/|infra/ansible/(playbooks/update-cluster.yml|tasks/cluster-(credentials|state).yml)|hsctl(\.d/|$)|\.github/(actions/setup-talos/|workflows/deploy.yaml))' || true; } \
                | wc -l
            )
            if [ "$base_patches_changed" -gt 0 ]; then
              clusters="$all_clusters"
            else
              clusters=$(
                printf '%s\n' "$changed_cluster_dirs" \
                  | sort -u \
                  | jq -Rsc 'split("\n") | map(select(length > 0))'
              )
            fi
          else
            clusters="$all_clusters"
          fi
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"
          echo "Clusters detected: ${clusters}"

  ansible:
    name: "Ansible"
    needs: [terraform, cluster-detect]
    if: >-
      !cancelled() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.cluster-detect.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || join(fromJson(needs.cluster-detect.outputs.clusters || '[]'), '') != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Import Secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Install hsctl
        run: |
          chmod +x hsctl
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install Talos tools
        uses: ./.github/actions/setup-talos

      - name: Install Helm
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'update-cluster'
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Ansible
        run: pip install ansible kubernetes infisicalsdk==1.1.0

      - name: Install Ansible collections
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Request OIDC Token
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'update-cluster'
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_AUTH_JWT=$TOKEN" >> "$GITHUB_ENV"

      - name: Run update-cluster
        if: github.event_name != 'workflow_dispatch' || inputs.job == 'update-cluster'
        id: update
        continue-on-error: true
        working-directory: infra/ansible
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          CLUSTERS: ${{ needs.cluster-detect.outputs.clusters }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
          HSCTL_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          limit=$(jq -r 'join(":")' <<<"$CLUSTERS")
          ansible-playbook playbooks/update-cluster.yml --limit "$limit" -e "dry_run=$DRY_RUN" \
            2>&1 | tee "$RUNNER_TEMP/update-cluster.txt"

      - name: Post upgrade preview as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- update-cluster-plan -->';
            const outputPath = `${process.env.RUNNER_TEMP}/update-cluster.txt`;
            const output = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8').trim() : '(setup failed before preview)';
            const body = [marker, '## Cluster upgrade and configuration preview',
              `Result: ${process.env.UPDATE_OUTCOME}`, '', '```', output.slice(-55000), '```'].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }

      - name: Fail if reconciliation failed
        if: steps.update.outcome == 'failure'
        run: exit 1

      - name: Run bootstrap-cluster
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'bootstrap-cluster'
        working-directory: infra/ansible
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          CLUSTER: ${{ inputs.cluster }}
        run: |
          if [ -n "$CLUSTER" ]; then
            ansible-playbook playbooks/bootstrap-cluster.yml -e target="$CLUSTER"
          else
            ansible-playbook playbooks/bootstrap-cluster.yml
          fi

      # Other playbooks use the generic dispatcher.
      - name: Run playbook
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'bootstrap-cluster' && inputs.job != 'update-cluster'
        working-directory: infra/ansible
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          PLAYBOOK: ${{ inputs.job }}
          CLUSTER: ${{ inputs.cluster }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          extra_e_args=()
          if [ -n "$EXTRA_ARGS" ]; then
            read -r -a _kvs <<< "$EXTRA_ARGS"
            for kv in "${_kvs[@]}"; do
              extra_e_args+=(-e "$kv")
            done
          fi
          if [ -n "$CLUSTER" ]; then
            ansible-playbook "playbooks/$PLAYBOOK.yml" -e target="$CLUSTER" "${extra_e_args[@]}"
          else
            ansible-playbook "playbooks/$PLAYBOOK.yml" "${extra_e_args[@]}"
          fi
