name: "Deploy"
permissions:
  actions: read
  contents: read
  id-token: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: true
      INFISICAL_ORG_ID:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      job:
        description: "'update-cluster', 'bootstrap-cluster', or any other ansible playbook filename under infra/ansible/playbooks/ (without .yml)"
        type: string
        required: true
      cluster:
        description: "Cluster to target (leave empty for all clusters)"
        type: string
        required: false
      dry_run:
        description: "Preview only — update-cluster; bootstrap playbooks ignore this"
        type: boolean
        required: false
        default: false
      extra_args:
        description: "Extra ansible -e key=value pairs, space-separated (any ansible playbook other than bootstrap-cluster/update-cluster)"
        type: string
        required: false

concurrency:
  group: deploy

jobs:
  ansible:
    name: "Ansible"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      HSCTL_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Import Secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c  # v4.4.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Install Talos tools
        uses: ./.github/actions/setup-talos

      - name: Install Helm
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'update-cluster'
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Ansible and collections
        working-directory: infra/ansible
        run: |
          pip install ansible-core kubernetes jsonpatch infisicalsdk==1.2.0
          ansible-galaxy collection install -r requirements.yml

      - name: Run update-cluster
        if: github.event_name != 'workflow_dispatch' || inputs.job == 'update-cluster'
        id: update
        working-directory: infra/ansible
        env:
          CLUSTER: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster || '' }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
        run: ansible-playbook playbooks/update-cluster.yml -e "target=${CLUSTER:-clusters}" -e "dry_run=$DRY_RUN"

      - name: Run playbook
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'update-cluster'
        working-directory: infra/ansible
        env:
          PLAYBOOK: ${{ inputs.job }}
          CLUSTER: ${{ inputs.cluster }}
          EXTRA_ARGS: ${{ inputs.job != 'bootstrap-cluster' && inputs.extra_args || '' }}
        run: |
          extra_e_args=()
          if [ -n "$EXTRA_ARGS" ]; then
            read -r -a _kvs <<< "$EXTRA_ARGS"
            for kv in "${_kvs[@]}"; do
              extra_e_args+=(-e "$kv")
            done
          fi
          ansible-playbook "playbooks/$PLAYBOOK.yml" -e "target=${CLUSTER:-clusters}" "${extra_e_args[@]}"
