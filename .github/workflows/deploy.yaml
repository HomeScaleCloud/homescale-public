name: "Deploy"
permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: true
      INFISICAL_ORG_ID:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      job:
        description: "'terraform', 'omni-sync', 'bootstrap-core', 'bootstrap-cluster', or any other ansible playbook filename under infra/ansible/playbooks/ (without .yml)"
        type: string
        required: true
      cluster:
        description: "Cluster to target — bootstrap-cluster's -e target=<cluster>, or a single cluster to sync for omni-sync (leave empty for all clusters)"
        type: string
        required: false
      machineclasses:
        description: "Comma-separated machine class names to sync (omni-sync only; leave empty for all)"
        type: string
        required: false
      dry_run:
        description: "Plan/--dry-run only — terraform and omni-sync only, ignored by ansible playbooks"
        type: boolean
        required: false
        default: false
      extra_args:
        description: "Extra ansible -e key=value pairs, space-separated (any ansible playbook other than bootstrap-core/bootstrap-cluster)"
        type: string
        required: false

concurrency:
  group: deploy

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'terraform'
    environment: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') && 'terraform' || null }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_infisical_github_actions: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
      TF_VAR_infisical_org_id: ${{ secrets.INFISICAL_ORG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Import Secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
      - name: Install yq
        env:
          YQ_VERSION: "4.47.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Request OIDC Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_AUTH_JWT=$TOKEN" >> "$GITHUB_ENV"

      - name: Plan
        id: plan
        continue-on-error: true
        env:
          DRY_RUN: "true"
          CLUSTER: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster || '' }}
        run: |
          if ./infra/terraform/plan-apply.sh > /tmp/tf-plan.txt 2>&1; then
            echo "PLAN_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PLAN_STATUS=failed" >> "$GITHUB_ENV"
            exit 1
          fi
      - name: Extract rendered Tailnet ACL
        id: tailnet_acl
        if: steps.plan.outcome == 'success'
        run: |
          terraform -chdir=infra/terraform show -json /tmp/tfplan > /tmp/tfplan.json
          RAW=$(jq -r '.resource_changes[]? | select(.address == "module.tailscale.tailscale_acl.this") | .change.after.acl // empty' /tmp/tfplan.json)
          if [ -n "$RAW" ]; then
            echo "$RAW" | jq '.' > /tmp/tailnet-acl.json
            echo "ACL_RENDERED=true" >> "$GITHUB_ENV"
            echo "ACL_SUMMARY=$(jq -r '"\(.tagOwners | length) tags, \(.grants | length) grants"' /tmp/tailnet-acl.json)" >> "$GITHUB_ENV"
          else
            echo "ACL_RENDERED=false" >> "$GITHUB_ENV"
          fi
      - name: Upload rendered Tailnet ACL artifact
        id: upload_acl
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tailnet-acl
          path: /tmp/tailnet-acl.json
          retention-days: 30
      - name: Install uv
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Generate Tailnet ACL map
        id: tailnet_acl_map
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        continue-on-error: true
        run: |
          uvx tailscale-network-topology-mapper \
            --policy-file /tmp/tailnet-acl.json \
            --output /tmp/tailnet-acl-map.html
          echo "ACL_MAP_RENDERED=true" >> "$GITHUB_ENV"
      - name: Upload Tailnet ACL map artifact
        id: upload_acl_map
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true' && steps.tailnet_acl_map.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tailnet-acl-map
          path: /tmp/tailnet-acl-map.html
          retention-days: 30
      - name: Write plan to job summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          icon=$([[ "${PLAN_STATUS:-}" == "success" ]] && echo "✅" || echo "❌")
          {
            echo "## ${icon} Terraform Plan"
            echo ""
            echo '```'
            cat /tmp/tf-plan.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "> commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post plan results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');

            async function upsertComment(marker, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

            const ok = process.env.PLAN_STATUS === 'success';
            const output = fs.existsSync('/tmp/tf-plan.txt')
              ? fs.readFileSync('/tmp/tf-plan.txt', 'utf8').trim()
              : '(no output)';
            const icon = ok ? '✅' : '❌';
            const marker = '<!-- terraform-plan -->';
            const body = [
              marker,
              `## ${icon} Terraform Plan`,
              '',
              '```',
              output || '(no output)',
              '```',
              '',
            ];
            if (process.env.ACL_RENDERED === 'true') {
              const aclUrl = `${{ steps.upload_acl.outputs.artifact-url }}`;
              const aclMapUrl = `${{ steps.upload_acl_map.outputs.artifact-url }}`;
              const links = [];
              links.push(aclUrl ? `[JSON](${aclUrl})` : '_JSON (upload failed)_');
              if (process.env.ACL_MAP_RENDERED === 'true') {
                links.push(aclMapUrl ? `[Map](${aclMapUrl})` : '_Map (upload failed)_');
              }
              body.push(
                '### <img src="https://github.com/tailscale.png" width="20" height="20" valign="middle" /> Tailnet ACL',
                '',
                `${process.env.ACL_SUMMARY || ''}`,
                '',
                links.join(' · '),
                '',
              );
            }
            body.push(`> commit \`${{ github.sha }}\``);
            await upsertComment(marker, body.join('\n'));
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed. See job summary for details."
          exit 1
      - name: Apply
        if: (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.job == 'terraform' && inputs.dry_run != true)
        env:
          CLUSTER: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster || '' }}
        run: ./infra/terraform/plan-apply.sh

  omni:
    name: "Omni"
    runs-on: ubuntu-latest
    needs: [terraform]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.job == 'omni-sync')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed clusters
        id: detect
        shell: bash
        env:
          INPUT_CLUSTER: ${{ inputs.cluster }}
          INPUT_MACHINECLASSES: ${{ inputs.machineclasses }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Empty input means "all" here (per the job input's own description) — same
            # full-discovery fallback the plain-push branch below uses, not "none".
            if [ -n "$INPUT_CLUSTER" ]; then
              clusters=$(jq -nc --arg c "$INPUT_CLUSTER" '[$c]')
            else
              clusters=$(
                find clusters -mindepth 2 -maxdepth 2 -name 'cluster.yaml' \
                  | cut -d/ -f2 \
                  | sort -u \
                  | jq -Rsc 'split("\n") | map(select(length > 0))'
              )
            fi
            if [ -n "$INPUT_MACHINECLASSES" ]; then
              machineclasses=$(jq -nc --arg m "$INPUT_MACHINECLASSES" '$m | split(",")')
            else
              machineclasses=$(
                { if [ -d infra/omni/machineclasses ]; then find infra/omni/machineclasses -maxdepth 1 -name '*.yaml'; fi; } \
                  | sed 's|.*/||; s|\.yaml$||' \
                  | sort -u \
                  | jq -Rsc 'split("\n") | map(select(length > 0))'
              )
            fi
            deleted_clusters='[]'
            deleted_machineclasses='[]'
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # No --depth: a shallow fetch would sever the merge-base the triple-dot diff below needs.
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...${{ github.sha }}"
            clusters=$(
              git diff --name-only --diff-filter=d "$range" \
                | { grep -E '^clusters/[^/]+/cluster\.yaml$' || true; } \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            machineclasses=$(
              git diff --name-only --diff-filter=d "$range" \
                | { grep -E '^infra/omni/machineclasses/[^/]+\.yaml$' || true; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_clusters=$(
              git diff --name-only --diff-filter=D "$range" \
                | { grep -E '^clusters/[^/]+/cluster\.yaml$' || true; } \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_machineclasses=$(
              git diff --name-only --diff-filter=D "$range" \
                | { grep -E '^infra/omni/machineclasses/[^/]+\.yaml$' || true; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          else
            clusters=$(
              find clusters -mindepth 2 -maxdepth 2 -name 'cluster.yaml' \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            machineclasses=$(
              { if [ -d infra/omni/machineclasses ]; then find infra/omni/machineclasses -maxdepth 1 -name '*.yaml'; fi; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_clusters='[]'
            deleted_machineclasses='[]'
          fi
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"
          echo "CLUSTERS=${clusters}" >> "$GITHUB_ENV"
          echo "Clusters detected: ${clusters}"
          echo "machineclasses=${machineclasses}" >> "$GITHUB_OUTPUT"
          echo "MACHINECLASSES=${machineclasses}" >> "$GITHUB_ENV"
          echo "Machine classes detected: ${machineclasses}"
          echo "deleted_clusters=${deleted_clusters}" >> "$GITHUB_OUTPUT"
          echo "Deleted clusters detected: ${deleted_clusters}"
          echo "deleted_machineclasses=${deleted_machineclasses}" >> "$GITHUB_OUTPUT"
          echo "Deleted machine classes detected: ${deleted_machineclasses}"

      - name: Import Secrets
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env

      - name: Connect to Tailscale
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Check Omni reachability
        id: omni_check
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        run: |
          if curl -sf --max-time 10 https://REDACTED/healthz > /dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Omni unreachable — skipping sync"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install omnictl
        if: (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]') && steps.omni_check.outputs.reachable != 'false'
        run: |
          sudo curl -fsSL -o /usr/local/bin/omnictl \
            https://REDACTED/api/omnictl/omnictl-linux-amd64
          sudo chmod +x /usr/local/bin/omnictl

      - name: Plan
        if: (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]') && steps.omni_check.outputs.reachable != 'false' && github.event_name == 'pull_request'
        id: plan
        continue-on-error: true
        env:
          OMNI_SERVICE_ACCOUNT_KEY: ${{ env.OMNI_SERVICE_ACCOUNT_KEY }}
          DRY_RUN: "true"
        run: |
          set -o pipefail
          CLUSTERS="$(echo "$CLUSTERS" | jq -r 'join(",")')" \
          MACHINECLASSES="$(echo "$MACHINECLASSES" | jq -r 'join(",")')" \
            ./infra/omni/sync.sh | tee /tmp/omni-plan-output.txt

      - name: Sync
        if: (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]') && steps.omni_check.outputs.reachable != 'false' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.job == 'omni-sync'))
        env:
          OMNI_SERVICE_ACCOUNT_KEY: ${{ env.OMNI_SERVICE_ACCOUNT_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || false }}
        run: |
          CLUSTERS="$(echo "$CLUSTERS" | jq -r 'join(",")')" \
          MACHINECLASSES="$(echo "$MACHINECLASSES" | jq -r 'join(",")')" \
            ./infra/omni/sync.sh

      - name: Post plan results as PR comments
        if: always() && github.event_name == 'pull_request' && steps.detect.outcome == 'success' && (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]' || steps.detect.outputs.deleted_clusters != '[]' || steps.detect.outputs.deleted_machineclasses != '[]')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          CLUSTERS: ${{ steps.detect.outputs.clusters }}
          MACHINECLASSES: ${{ steps.detect.outputs.machineclasses }}
          DELETED_CLUSTERS: ${{ steps.detect.outputs.deleted_clusters }}
          DELETED_MACHINECLASSES: ${{ steps.detect.outputs.deleted_machineclasses }}
        with:
          script: |
            const fs = require('fs');

            // sync.sh prints "=== BEGIN/END <KIND> <name> ===" around each item's own
            // output in the one combined log this job captured — split that back into
            // per-item results here rather than reading a separate file per item.
            const fullOutput = fs.existsSync('/tmp/omni-plan-output.txt')
              ? fs.readFileSync('/tmp/omni-plan-output.txt', 'utf8')
              : '';

            function extractSection(kind, name) {
              const begin = `=== BEGIN ${kind} ${name} ===`;
              const endOk = `=== END ${kind} ${name} OK ===`;
              const endFail = `=== END ${kind} ${name} FAILED ===`;
              const start = fullOutput.indexOf(begin);
              if (start === -1) return { ok: false, output: '(no output — plan step may have failed before reaching this item)' };
              const afterBegin = start + begin.length;
              const okIdx = fullOutput.indexOf(endOk, afterBegin);
              const failIdx = fullOutput.indexOf(endFail, afterBegin);
              if (okIdx !== -1 && (failIdx === -1 || okIdx < failIdx)) {
                return { ok: true, output: fullOutput.slice(afterBegin, okIdx).trim() || '(no output)' };
              }
              if (failIdx !== -1) {
                return { ok: false, output: fullOutput.slice(afterBegin, failIdx).trim() || '(no output)' };
              }
              return { ok: false, output: fullOutput.slice(afterBegin).trim() || '(no output)' };
            }

            async function upsertComment(marker, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

            const clusters = JSON.parse(process.env.CLUSTERS);
            for (const cluster of clusters) {
              const { ok, output } = extractSection('CLUSTER', cluster);
              const icon = ok ? '✅' : '❌';
              const marker = `<!-- omni-cluster-sync-${cluster} -->`;
              const body = [
                marker,
                `## ${icon} Omni cluster template plan — \`${cluster}\``,
                '',
                '```',
                output || '(no output)',
                '```',
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const machineclasses = JSON.parse(process.env.MACHINECLASSES);
            for (const mc of machineclasses) {
              const { ok, output } = extractSection('MACHINECLASS', mc);
              const icon = ok ? '✅' : '❌';
              const marker = `<!-- omni-machineclass-${mc} -->`;
              const body = [
                marker,
                `## ${icon} Omni machine class plan — \`${mc}\``,
                '',
                '```',
                output || '(no output)',
                '```',
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const deletedClusters = JSON.parse(process.env.DELETED_CLUSTERS);
            for (const cluster of deletedClusters) {
              const marker = `<!-- omni-cluster-sync-${cluster} -->`;
              const body = [
                marker,
                `## 🗑️ Omni cluster template plan — \`${cluster}\` (removed)`,
                '',
                `\`clusters/${cluster}/cluster.yaml\` was removed in this PR, so no automated sync will run for it. If the cluster still exists in Omni, it must be torn down manually.`,
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const deletedMachineclasses = JSON.parse(process.env.DELETED_MACHINECLASSES);
            for (const mc of deletedMachineclasses) {
              const marker = `<!-- omni-machineclass-${mc} -->`;
              const body = [
                marker,
                `## 🗑️ Omni machine class plan — \`${mc}\` (removed)`,
                '',
                `\`infra/omni/machineclasses/${mc}.yaml\` was removed in this PR, so no automated sync will run for it. Remove it manually in Omni if it still exists.`,
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "One or more cluster template plans failed. See PR comments for details."
          exit 1

  ansible:
    name: "Ansible"
    runs-on: ubuntu-latest
    needs: [omni]
    if: always() && (needs.omni.result == 'success' || needs.omni.result == 'skipped') && github.event_name == 'workflow_dispatch' && inputs.job != 'terraform' && inputs.job != 'omni-sync'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Import Secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/ci"
          export-type: env

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Request OIDC Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_AUTH_JWT=$TOKEN" >> "$GITHUB_ENV"

      - name: Install hsctl
        run: |
          chmod +x hsctl
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Ansible
        run: pip install ansible kubernetes infisicalsdk==1.0.17

      - name: Install Ansible collections
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run core cluster bootstrap playbook
        if: inputs.job == 'bootstrap-core'
        working-directory: infra/ansible
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: ansible-playbook playbooks/bootstrap-core.yml -e cluster_name=core

      - name: Install omnictl
        if: inputs.job == 'bootstrap-cluster'
        run: |
          sudo curl -fsSL -o /usr/local/bin/omnictl \
            https://REDACTED/api/omnictl/omnictl-linux-amd64
          sudo chmod +x /usr/local/bin/omnictl

      - name: Run cluster bootstrap playbook
        if: inputs.job == 'bootstrap-cluster'
        working-directory: infra/ansible
        env:
          OMNI_ENDPOINT: https://REDACTED
          OMNI_SERVICE_ACCOUNT_KEY: ${{ env.OMNI_SERVICE_ACCOUNT_KEY }}
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          CLUSTER: ${{ inputs.cluster }}
        run: |
          if [ -n "$CLUSTER" ]; then
            ansible-playbook playbooks/bootstrap-cluster.yml -e target="$CLUSTER"
          else
            ansible-playbook playbooks/bootstrap-cluster.yml
          fi

      # Fallback for any playbook under infra/ansible/playbooks/ other than the two above —
      # e.g. one-off or future playbooks run via `hsctl run <name> -e remote`.
      - name: Run playbook
        if: inputs.job != 'bootstrap-core' && inputs.job != 'bootstrap-cluster'
        working-directory: infra/ansible
        env:
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          PLAYBOOK: ${{ inputs.job }}
          CLUSTER: ${{ inputs.cluster }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          extra_e_args=()
          if [ -n "$EXTRA_ARGS" ]; then
            read -r -a _kvs <<< "$EXTRA_ARGS"
            for kv in "${_kvs[@]}"; do
              extra_e_args+=(-e "$kv")
            done
          fi
          if [ -n "$CLUSTER" ]; then
            ansible-playbook "playbooks/$PLAYBOOK.yml" -e target="$CLUSTER" "${extra_e_args[@]}"
          else
            ansible-playbook "playbooks/$PLAYBOOK.yml" "${extra_e_args[@]}"
          fi
