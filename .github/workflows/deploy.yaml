name: "Deploy"
permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

on:
  workflow_call:
    secrets:
      INFISICAL_GH_IDENTITY_ID:
        required: true
      INFISICAL_ORG_ID:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
  workflow_dispatch: {}

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'terraform' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Both the PR-time plan and the merge-time apply dispatch to automatron in core
      # rather than running terraform directly on this runner — this job only ever needs a
      # core kubectl context (CORE_KUBECONFIG), not Omni/Cloudflare/Infisical network
      # access itself (automatron already has that sorted).
      - name: Import core kubeconfig
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/k8s/automatron"
          export-type: env

      - name: Install kubectl
        run: |
          curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Build core kubeconfig context
        run: | # pragma: allowlist secret
          set -euo pipefail
          echo "$CORE_KUBECONFIG" > /tmp/core-kubeconfig
          export KUBECONFIG=/tmp/core-kubeconfig
          kubectl config rename-context "$(kubectl config current-context)" core
          echo "KUBECONFIG=/tmp/core-kubeconfig" >> "$GITHUB_ENV"

      # --git-ref is what makes this a correct plan of *this PR's* changes rather than
      # main's current content — automatron's git-clone otherwise always checks out main.
      - name: Plan via automatron
        if: github.event_name == 'pull_request'
        id: plan
        continue-on-error: true
        env:
          HSCTL_JOB_OWNER: ci
        run: |
          set -euo pipefail
          chmod +x hsctl
          ./hsctl run terraform --dry-run -e remote --git-ref "${{ github.head_ref }}" \
              | tee /tmp/tf-plan-output.txt

      # infra/automatron/scripts/terraform.sh prints the rendered Tailnet ACL between
      # "=== BEGIN/END ACL_JSON ===" markers (only reachable in dry-run mode) - split that
      # back out and strip it from the plan text shown in the PR comment/job summary,
      # since it's redundant there once uploaded as its own artifact below.
      - name: Extract rendered Tailnet ACL
        id: tailnet_acl
        if: steps.plan.outcome == 'success'
        run: |
          set -euo pipefail
          RAW=$(sed -n '/=== BEGIN ACL_JSON ===/,/=== END ACL_JSON ===/p' /tmp/tf-plan-output.txt \
              | sed '1d;$d')
          sed -i '/=== BEGIN ACL_JSON ===/,/=== END ACL_JSON ===/d' /tmp/tf-plan-output.txt
          if [ -n "$RAW" ]; then
            echo "$RAW" | jq '.' > /tmp/tailnet-acl.json
            echo "ACL_RENDERED=true" >> "$GITHUB_ENV"
            echo "ACL_SUMMARY=$(jq -r '"\(.tagOwners | length) tags, \(.grants | length) grants"' /tmp/tailnet-acl.json)" >> "$GITHUB_ENV"
          else
            echo "ACL_RENDERED=false" >> "$GITHUB_ENV"
          fi
      - name: Upload rendered Tailnet ACL artifact
        id: upload_acl
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tailnet-acl
          path: /tmp/tailnet-acl.json
          retention-days: 30
      - name: Install uv
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Generate Tailnet ACL map
        id: tailnet_acl_map
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true'
        continue-on-error: true
        run: |
          uvx tailscale-network-topology-mapper \
            --policy-file /tmp/tailnet-acl.json \
            --output /tmp/tailnet-acl-map.html
          echo "ACL_MAP_RENDERED=true" >> "$GITHUB_ENV"
      - name: Upload Tailnet ACL map artifact
        id: upload_acl_map
        if: steps.plan.outcome == 'success' && env.ACL_RENDERED == 'true' && steps.tailnet_acl_map.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tailnet-acl-map
          path: /tmp/tailnet-acl-map.html
          retention-days: 30
      - name: Write plan to job summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          icon=$([[ "${{ steps.plan.outcome }}" == "success" ]] && echo "✅" || echo "❌")
          {
            echo "## ${icon} Terraform Plan"
            echo ""
            echo '```'
            cat /tmp/tf-plan-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "> commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post plan results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');

            async function upsertComment(marker, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

            const ok = '${{ steps.plan.outcome }}' === 'success';
            const output = fs.existsSync('/tmp/tf-plan-output.txt')
              ? fs.readFileSync('/tmp/tf-plan-output.txt', 'utf8').trim()
              : '(no output)';
            const icon = ok ? '✅' : '❌';
            const marker = '<!-- terraform-plan -->';
            const body = [
              marker,
              `## ${icon} Terraform Plan`,
              '',
              '```',
              output || '(no output)',
              '```',
              '',
            ];
            if (process.env.ACL_RENDERED === 'true') {
              const aclUrl = `${{ steps.upload_acl.outputs.artifact-url }}`;
              const aclMapUrl = `${{ steps.upload_acl_map.outputs.artifact-url }}`;
              const links = [];
              links.push(aclUrl ? `[JSON](${aclUrl})` : '_JSON (upload failed)_');
              if (process.env.ACL_MAP_RENDERED === 'true') {
                links.push(aclMapUrl ? `[Map](${aclMapUrl})` : '_Map (upload failed)_');
              }
              body.push(
                '### <img src="https://github.com/tailscale.png" width="20" height="20" valign="middle" /> Tailnet ACL',
                '',
                `${process.env.ACL_SUMMARY || ''}`,
                '',
                links.join(' · '),
                '',
              );
            }
            body.push(`> commit \`${{ github.sha }}\``);
            await upsertComment(marker, body.join('\n'));
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed. See job summary for details."
          exit 1

      - name: Sync via automatron
        if: github.ref == 'refs/heads/main'
        env:
          HSCTL_JOB_OWNER: ci
        run: |
          chmod +x hsctl
          ./hsctl run terraform -e remote

  omni:
    name: "Omni"
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed clusters
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # No --depth: a shallow fetch would sever the merge-base the triple-dot diff below needs.
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...${{ github.sha }}"
            clusters=$(
              git diff --name-only --diff-filter=d "$range" \
                | { grep -E '^clusters/[^/]+/cluster\.yaml$' || true; } \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            machineclasses=$(
              git diff --name-only --diff-filter=d "$range" \
                | { grep -E '^infra/omni/machineclasses/[^/]+\.yaml$' || true; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_clusters=$(
              git diff --name-only --diff-filter=D "$range" \
                | { grep -E '^clusters/[^/]+/cluster\.yaml$' || true; } \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_machineclasses=$(
              git diff --name-only --diff-filter=D "$range" \
                | { grep -E '^infra/omni/machineclasses/[^/]+\.yaml$' || true; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          else
            clusters=$(
              find clusters -mindepth 2 -maxdepth 2 -name 'cluster.yaml' \
                | cut -d/ -f2 \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            machineclasses=$(
              { if [ -d infra/omni/machineclasses ]; then find infra/omni/machineclasses -maxdepth 1 -name '*.yaml'; fi; } \
                | sed 's|.*/||; s|\.yaml$||' \
                | sort -u \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
            deleted_clusters='[]'
            deleted_machineclasses='[]'
          fi
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"
          echo "CLUSTERS=${clusters}" >> "$GITHUB_ENV"
          echo "Clusters detected: ${clusters}"
          echo "machineclasses=${machineclasses}" >> "$GITHUB_OUTPUT"
          echo "MACHINECLASSES=${machineclasses}" >> "$GITHUB_ENV"
          echo "Machine classes detected: ${machineclasses}"
          echo "deleted_clusters=${deleted_clusters}" >> "$GITHUB_OUTPUT"
          echo "Deleted clusters detected: ${deleted_clusters}"
          echo "deleted_machineclasses=${deleted_machineclasses}" >> "$GITHUB_OUTPUT"
          echo "Deleted machine classes detected: ${deleted_machineclasses}"

      # Both the PR-time plan and the merge-time sync dispatch to automatron in core rather
      # than running omnictl directly on this runner — automatron already has Omni
      # reachability sorted (in-cluster hostAliases, Infisical-backed service account key),
      # so this job only ever needs core cluster access, never Omni network access itself.
      - name: Import core kubeconfig
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d  # v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_GH_IDENTITY_ID }}
          env-slug: "prod"
          project-slug: "homescale"
          secret-path: "/k8s/automatron"
          export-type: env

      - name: Install kubectl
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        run: |
          curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Build core kubeconfig context
        if: steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]'
        run: | # pragma: allowlist secret
          set -euo pipefail
          echo "$CORE_KUBECONFIG" > /tmp/core-kubeconfig
          export KUBECONFIG=/tmp/core-kubeconfig
          kubectl config rename-context "$(kubectl config current-context)" core
          echo "KUBECONFIG=/tmp/core-kubeconfig" >> "$GITHUB_ENV"

      # A key present-but-empty in --arg (e.g. --arg clusters=) means "none of this kind" to
      # omni-sync.sh, distinct from the key being absent entirely ("everything" — what the
      # merge-time Sync step below wants). github.head_ref is the PR's own branch, so the
      # plan reflects this PR's actual changes, not main's current content.
      - name: Plan via automatron
        if: (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]') && github.event_name == 'pull_request'
        id: plan
        continue-on-error: true
        env:
          HSCTL_JOB_OWNER: ci
        run: |
          set -euo pipefail
          chmod +x hsctl
          clusters_csv=$(echo "$CLUSTERS" | jq -r 'join(",")')
          machineclasses_csv=$(echo "$MACHINECLASSES" | jq -r 'join(",")')
          ./hsctl run omni-sync --dry-run -e remote --git-ref "${{ github.head_ref }}" \
              --arg "clusters=$clusters_csv" --arg "machineclasses=$machineclasses_csv" \
              | tee /tmp/omni-plan-output.txt

      - name: Sync via automatron
        if: (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]') && github.ref == 'refs/heads/main'
        env:
          HSCTL_JOB_OWNER: ci
        run: |
          chmod +x hsctl
          ./hsctl run omni-sync-and-bootstrap -e remote

      - name: Post plan results as PR comments
        if: always() && github.event_name == 'pull_request' && steps.detect.outcome == 'success' && (steps.detect.outputs.clusters != '[]' || steps.detect.outputs.machineclasses != '[]' || steps.detect.outputs.deleted_clusters != '[]' || steps.detect.outputs.deleted_machineclasses != '[]')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          CLUSTERS: ${{ steps.detect.outputs.clusters }}
          MACHINECLASSES: ${{ steps.detect.outputs.machineclasses }}
          DELETED_CLUSTERS: ${{ steps.detect.outputs.deleted_clusters }}
          DELETED_MACHINECLASSES: ${{ steps.detect.outputs.deleted_machineclasses }}
        with:
          script: |
            const fs = require('fs');

            // omni-sync.sh prints "=== BEGIN/END <KIND> <name> ===" around each item's own
            // output in the one combined pod log hsctl streamed — split that back into
            // per-item results here rather than reading a separate file per item.
            const fullOutput = fs.existsSync('/tmp/omni-plan-output.txt')
              ? fs.readFileSync('/tmp/omni-plan-output.txt', 'utf8')
              : '';

            function extractSection(kind, name) {
              const begin = `=== BEGIN ${kind} ${name} ===`;
              const endOk = `=== END ${kind} ${name} OK ===`;
              const endFail = `=== END ${kind} ${name} FAILED ===`;
              const start = fullOutput.indexOf(begin);
              if (start === -1) return { ok: false, output: '(no output — plan step may have failed before reaching this item)' };
              const afterBegin = start + begin.length;
              const okIdx = fullOutput.indexOf(endOk, afterBegin);
              const failIdx = fullOutput.indexOf(endFail, afterBegin);
              if (okIdx !== -1 && (failIdx === -1 || okIdx < failIdx)) {
                return { ok: true, output: fullOutput.slice(afterBegin, okIdx).trim() || '(no output)' };
              }
              if (failIdx !== -1) {
                return { ok: false, output: fullOutput.slice(afterBegin, failIdx).trim() || '(no output)' };
              }
              return { ok: false, output: fullOutput.slice(afterBegin).trim() || '(no output)' };
            }

            async function upsertComment(marker, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

            const clusters = JSON.parse(process.env.CLUSTERS);
            for (const cluster of clusters) {
              const { ok, output } = extractSection('CLUSTER', cluster);
              const icon = ok ? '✅' : '❌';
              const marker = `<!-- omni-cluster-sync-${cluster} -->`;
              const body = [
                marker,
                `## ${icon} Omni cluster template plan — \`${cluster}\``,
                '',
                '```',
                output || '(no output)',
                '```',
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const machineclasses = JSON.parse(process.env.MACHINECLASSES);
            for (const mc of machineclasses) {
              const { ok, output } = extractSection('MACHINECLASS', mc);
              const icon = ok ? '✅' : '❌';
              const marker = `<!-- omni-machineclass-${mc} -->`;
              const body = [
                marker,
                `## ${icon} Omni machine class plan — \`${mc}\``,
                '',
                '```',
                output || '(no output)',
                '```',
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const deletedClusters = JSON.parse(process.env.DELETED_CLUSTERS);
            for (const cluster of deletedClusters) {
              const marker = `<!-- omni-cluster-sync-${cluster} -->`;
              const body = [
                marker,
                `## 🗑️ Omni cluster template plan — \`${cluster}\` (removed)`,
                '',
                `\`clusters/${cluster}/cluster.yaml\` was removed in this PR, so no automated sync will run for it. If the cluster still exists in Omni, it must be torn down manually.`,
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

            const deletedMachineclasses = JSON.parse(process.env.DELETED_MACHINECLASSES);
            for (const mc of deletedMachineclasses) {
              const marker = `<!-- omni-machineclass-${mc} -->`;
              const body = [
                marker,
                `## 🗑️ Omni machine class plan — \`${mc}\` (removed)`,
                '',
                `\`infra/omni/machineclasses/${mc}.yaml\` was removed in this PR, so no automated sync will run for it. Remove it manually in Omni if it still exists.`,
                '',
                `> commit \`${{ github.sha }}\``,
              ].join('\n');
              await upsertComment(marker, body);
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "One or more cluster template plans failed. See PR comments for details."
          exit 1
