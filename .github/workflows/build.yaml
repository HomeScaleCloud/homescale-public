name: "Build"
permissions:
  contents: write
  packages: write
  id-token: write


on:
  workflow_call:
    inputs:
      app:
        type: string
        default: ''
        description: 'Specific app to build (empty = all changed/all)'
  workflow_dispatch:
    inputs:
      app:
        type: string
        default: ''
        description: 'Specific app to build (empty = all)'
        required: false

jobs:
  discover:
    name: "Discover build targets"
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.set.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Find Docker targets
        id: set
        shell: bash
        env:
          INPUT_APP: ${{ inputs.app }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Find Dockerfiles under apps/** (supports apps/foo/src/Dockerfile or apps/foo/Dockerfile)
          docker_json='[]'
          while IFS= read -r df; do
            dir="$(dirname "$df")"
            base="$(basename "$dir")"
            if [[ "$base" == "src" ]]; then
              name="$(basename "$(dirname "$dir")")"
              context="$dir"
            else
              name="$(basename "$dir")"
              context="$dir"
            fi
            # `name` (matched against changed-apps below) is the app directory
            # name; `image`, what's pushed to ghcr.io/homescalecloud/<image>,
            # defaults to `name` but can be overridden by .image-name.
            image="$name"
            if [[ -f "$context/.image-name" ]]; then
              image="$(<"$context/.image-name")"
            fi
            docker_json="$(jq --arg n "$name" --arg i "$image" --arg c "$context" '. + [{name:$n, image:$i, context:$c}]' <<<"$docker_json")"
          done < <(git ls-files 'apps/**/Dockerfile' | sort)

          event="${GITHUB_EVENT_NAME}"
          is_pr="false"
          if [[ "$event" == "pull_request" || "$event" == "pull_request_target" || "${GITHUB_REF}" == refs/pull/* ]]; then
            is_pr="true"
          fi

          # A release builds every discovered app. Every other event (PRs and
          # pushes to main alike) builds only the apps changed since its diff base.
          if [[ "$event" == "release" ]]; then
            echo "Release event; building all discovered apps."
          else
            diff_base=""
            if [[ "$is_pr" == "true" ]]; then
              if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
                git fetch --no-tags origin "${GITHUB_BASE_REF}" --depth=1
                diff_base="origin/${GITHUB_BASE_REF}"
              fi
            elif [[ -n "${EVENT_BEFORE:-}" && ! "$EVENT_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              diff_base="$EVENT_BEFORE"
            fi

            if [[ -z "$diff_base" ]]; then
              echo "No diff base available; building all discovered apps."
            else
              mapfile -t changed_files < <(git diff --name-only "$diff_base" HEAD || true)
              mapfile -t changed_apps < <(printf '%s\n' "${changed_files[@]}" | awk -F/ '($1=="apps" && $2!=""){print $2}' | sort -u)

              if (( ${#changed_apps[@]} )); then
                echo "Changed apps detected: ${changed_apps[*]}"
                apps_json="$(printf '%s\n' "${changed_apps[@]}" | jq -R . | jq -s 'map(select(length>0))')"
                docker_json="$(jq --argjson apps "$apps_json" 'map(select(.name as $n | ($apps | index($n))))' <<<"$docker_json")"
              else
                echo "No app changes detected; skipping Docker builds."
                docker_json='[]'
              fi
            fi
          fi

          if [[ -n "${INPUT_APP:-}" ]]; then
            echo "Filtering to app: $INPUT_APP"
            docker_json="$(jq --arg app "$INPUT_APP" 'map(select(.name == $app))' <<<"$docker_json")"
          fi

          echo "docker=$(jq -c . <<<"$docker_json")" >> "$GITHUB_OUTPUT"

  docker:
    name: "Docker - ${{ matrix.name }}"
    needs: [discover]
    if: needs.discover.outputs.docker != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.docker) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to ghcr (Docker)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/homescalecloud/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/homescalecloud/${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          cache: false

  docs:
    name: "Docs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install mkdocs-material
        run: pip install mkdocs-material
      - name: Build docs
        if: github.ref != 'refs/heads/main'
        run: mkdocs build
      - name: Deploy docs
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force --remote-branch docs
