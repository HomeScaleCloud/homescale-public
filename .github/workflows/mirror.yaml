name: Public Mirror

on:
  workflow_call:
    secrets:
      PUBLIC_DEPLOY_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  homescale-runners:
    name: "HomeScale Runners"
    uses: ./.github/workflows/homescale-runners.yaml
    secrets: inherit  # pragma: allowlist secret

  mirror:
    needs: [homescale-runners]
    runs-on: ${{ needs.homescale-runners.outputs.self_hosted == 'true' && 'homescale-runners' || 'ubuntu-latest' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        if: needs.homescale-runners.outputs.self_hosted != 'true'
        run: pip install git-filter-repo

      - name: Rewrite history — scrub internal FQDNs and Entra IDs
        run: |
          # Any FQDN ending in REDACTED → REDACTED, across every blob in every commit.
          # Also scrub Entra tenant/client IDs still committed in infra/omni/patches/oidc.yaml
          # (the kube-apiserver's own OIDC config) — neither is a secret, but there's no reason
          # to publicly identify the tenant either.
          {
            printf 'regex:([a-zA-Z0-9*._-]+\\.)?homescale\\.cloud==>REDACTED\n'
            printf 'REDACTED==>REDACTED\n'
            printf 'REDACTED==>REDACTED\n'
          } > /tmp/replacements.txt
          # --force: needed because we didn't clone from an empty repo
          git filter-repo --replace-text /tmp/replacements.txt --force

      - name: Push to public mirror
        env:
          GIT_SSH_KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GIT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          # filter-repo removes origin as a safety measure; add the public remote fresh
          git remote add public git@github.com:HomeScaleCloud/homescale-public.git
          git push public main --force
