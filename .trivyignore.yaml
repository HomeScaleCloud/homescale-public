vulnerabilities:
  - id: CVE-2026-56854
    paths:
      - "usr/local/bin/tailscale"
    statement: "golang.org/x/crypto/ssh auth-bypass is in the SSH server/client code path bundled in the tailscale binary (apps/slurm/src/Dockerfile); this image only ever calls `tailscale whois` (LocalAPI client over the tailscaled socket), never anything ssh-related from this binary"
  - id: CVE-2026-46602
    paths:
      - "usr/local/bin/tailscale"
    statement: "golang.org/x/image TIFF decoder DoS is unreachable — this image (apps/slurm/src/Dockerfile) only calls `tailscale whois`, never any image-decoding code path"
  - id: CVE-2026-46603
    paths:
      - "usr/local/bin/tailscale"
    statement: "golang.org/x/image vp8l decoder DoS is unreachable — this image (apps/slurm/src/Dockerfile) only calls `tailscale whois`, never any image-decoding code path"
  - id: GHSA-6v7p-g79w-8964
    statement: "msgpack 1.1.2 here is pip's own vendored copy (pip/_vendor/msgpack), not an installed dependency — it ships inside pip 26.2.1 itself (apps/automatron/Dockerfile's python:3.14-slim base), which is already the latest pip release, so there's no newer pip to pick up a fixed vendored copy. No path to scope this to: Trivy detects it from pip's bundled SBOM, not a discrete dist-info entry"
  - id: CVE-2025-47273
    statement: "setuptools 70.3.0 here is pip's own vendored copy (pip/_vendor/pkg_resources), not an installed dependency — same as GHSA-6v7p-g79w-8964 above, it ships inside pip 26.2.1 itself (apps/automatron/Dockerfile's python:3.14-slim base), which is already the latest pip release"

misconfigurations:
  - id: DS-0002
    paths:
      - "apps/slurm/src/Dockerfile"
    statement: "sshd binds port 22 and useradd writes /etc/passwd,/etc/shadow — both need root; this is the login node's sshd process, not a workload container"
  - id: KSV-0045
    paths:
      - "apps/rbac/templates/roles/workloads-admin.yaml"
      - "apps/rbac/templates/roles/node-admin.yaml"
      - "apps/rbac/templates/roles/storage-admin.yaml"
      - "apps/rbac/templates/roles/rbac-admin.yaml"
      - "apps/rbac/templates/roles/networking-admin.yaml"
    statement: "Intentional: admin roles are purpose-built and explicitly bound to named subjects"
  - id: KSV-0053
    paths:
      - "apps/rbac/templates/roles/workloads-admin.yaml"
    statement: "Intentional: operators need exec access for debugging"
  - id: KSV-0056
    paths:
      - "apps/rbac/templates/roles/networking-admin.yaml"
    statement: "Intentional: networking-admin is the designated role for managing network resources"
  - id: KSV-0050
    paths:
      - "apps/rbac/templates/roles/rbac-admin.yaml"
    statement: "Intentional: rbac-admin is the designated role for RBAC management; bind/escalate are inherent to that purpose"
  - id: KSV-0041
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: managing Secrets (TLS certs for their own webhooks/services) is inherent to how these operators work"
  - id: KSV-0046
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators manage a wide range of cluster resources on behalf of the whole cluster; narrowing the wildcard rules would mean forking upstream RBAC"
  - id: KSV-0053
    paths:
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt operator RBAC: virt-handler needs pods/exec to implement VM console/serial access"
  - id: KSV-0056
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
      - "apps/kubevirt/templates/role-cdi-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators create and manage Services/Endpoints for their own components (virt-api, cdi-uploadproxy, etc.)"
  - id: KSV-0114
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators manage their own admission webhook configurations"
  - id: KSV-0108
    paths:
      - "apps/metrics/templates/service-egress.yaml"
      - "apps/headlamp/templates/service-egress.yaml"
    statement: "Intentional: type: ExternalName is required by the Tailscale Kubernetes operator's egress ProxyGroup pattern. The tailscale.com/tailnet-fqdn annotation is resolved against the tailnet's own netmap by the operator's admission webhook, not an attacker-controlled public DNS name, so CVE-2020-8554's MITM risk model doesn't apply"
  - id: KSV-0041
    paths:
      - "apps/knative/templates/clusterrole-knative-serving-core.yaml"
      - "apps/knative/templates/clusterrole-net-kourier.yaml"
    statement: "Vendored upstream Knative Serving/Kourier RBAC: the controller manages TLS Secrets for its own webhook certs and Knative Certificates (webhook-certs, routing-serving-certs); net-kourier reads the TLS Secret referenced by config-kourier's cluster-cert-secret for the Kourier gateway"
  - id: KSV-0046
    paths:
      - "apps/knative/templates/clusterrole-knative-serving-core.yaml"
      - "apps/knative/templates/clusterrole-knative-serving-namespaced-admin.yaml"
      - "apps/knative/templates/clusterrole-knative-serving-namespaced-edit.yaml"
      - "apps/knative/templates/clusterrole-knative-serving-namespaced-view.yaml"
    statement: "Vendored upstream Knative Serving RBAC: knative-serving-core is the controller's own reconciler role spanning many resource kinds; the namespaced-admin/edit/view roles are RBAC-aggregation roles for end users to manage or view Knative resources, mirroring Kubernetes' own built-in admin/edit/view ClusterRoles"
  - id: KSV-0056
    paths:
      - "apps/knative/templates/clusterrole-knative-serving-core.yaml"
      - "apps/knative/templates/clusterrole-knative-serving-podspecable-binding.yaml"
      - "apps/knative/templates/clusterrole-net-kourier.yaml"
    statement: "Vendored upstream Knative Serving/Kourier RBAC: the controller creates and manages the per-revision Services/EndpointSlices backing every Knative Service; net-kourier manages the networking resources backing its Envoy gateway"
  - id: KSV-0109
    paths:
      - "apps/knative/templates/configmap-config-kourier.yaml"
    statement: "Vendored upstream Kourier config: 'cluster-cert-secret' is a Secret *name* reference (empty by default), not an actual secret value"
  - id: KSV-0114
    paths:
      - "apps/knative/templates/clusterrole-knative-serving-core.yaml"
    statement: "Vendored upstream Knative Serving RBAC: the webhook controller reconciles the caBundle/rules on its own MutatingWebhookConfiguration/ValidatingWebhookConfiguration objects at runtime"
  - id: KSV-0014
    paths:
      - "apps/knative/templates/deployment-3scale-kourier-gateway.yaml"
    statement: "Vendored upstream Kourier gateway: the Envoy container writes its own runtime files (hot-restart shared-memory files, admin interface) to the root filesystem; upstream provides no writable volume for these"
