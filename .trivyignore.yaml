misconfigurations:
  - id: KSV-0045
    paths:
      - "apps/rbac/templates/roles/workloads-admin.yaml"
      - "apps/rbac/templates/roles/node-admin.yaml"
      - "apps/rbac/templates/roles/storage-admin.yaml"
      - "apps/rbac/templates/roles/rbac-admin.yaml"
      - "apps/rbac/templates/roles/networking-admin.yaml"
    statement: "Intentional: admin roles are purpose-built and explicitly bound to named subjects"
  - id: KSV-0053
    paths:
      - "apps/rbac/templates/roles/workloads-admin.yaml"
    statement: "Intentional: operators need exec access for debugging"
  - id: KSV-0056
    paths:
      - "apps/rbac/templates/roles/networking-admin.yaml"
    statement: "Intentional: networking-admin is the designated role for managing network resources"
  - id: KSV-0050
    paths:
      - "apps/rbac/templates/roles/rbac-admin.yaml"
    statement: "Intentional: rbac-admin is the designated role for RBAC management; bind/escalate are inherent to that purpose"
  - id: KSV-0041
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: managing Secrets (TLS certs for their own webhooks/services) is inherent to how these operators work"
  - id: KSV-0046
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators manage a wide range of cluster resources on behalf of the whole cluster; narrowing the wildcard rules would mean forking upstream RBAC"
  - id: KSV-0053
    paths:
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt operator RBAC: virt-handler needs pods/exec to implement VM console/serial access"
  - id: KSV-0056
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
      - "apps/kubevirt/templates/role-cdi-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators create and manage Services/Endpoints for their own components (virt-api, cdi-uploadproxy, etc.)"
  - id: KSV-0114
    paths:
      - "apps/kubevirt/templates/clusterrole-cdi-operator-cluster.yaml"
      - "apps/kubevirt/templates/clusterrole-kubevirt-operator.yaml"
    statement: "Vendored upstream KubeVirt/CDI operator RBAC: these operators manage their own admission webhook configurations"
  - id: KSV-0108
    paths:
      - "apps/metrics/templates/service-egress.yaml"
      - "apps/headlamp/templates/service-egress.yaml"
    statement: "Intentional: type: ExternalName is required by the Tailscale Kubernetes operator's egress ProxyGroup pattern. The tailscale.com/tailnet-fqdn annotation is resolved against the tailnet's own netmap by the operator's admission webhook, not an attacker-controlled public DNS name, so CVE-2020-8554's MITM risk model doesn't apply"
