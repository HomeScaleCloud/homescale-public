env:
  name: "{{ .Values.env.name }}"
network:
  ip: "10.1.241.5/24"
image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: "2026.11.0"
replicaCount: 1
pvc:
  size: 25Gi
mqtt:
  replicaCount: 1
  network:
    ip: "10.1.241.6/24"
  image:
    repository: eclipse-mosquitto
    tag: "2.0.22"
  pvc:
    data:
      size: 5Gi
zigbee2mqtt:
  replicaCount: 1
  image:
    repository: ghcr.io/koenkk/zigbee2mqtt
    tag: "2.14.3"
  pvc:
    size: 10Gi
  config:
    tz: "Europe/London"
    mqttServer: "mqtt://mqtt:1883"
    mqttBaseTopic: "z2m"
    serialAdapter: "ember"
    baudrate: "115200"
    rtscts: "false"
    channel: "25"
    cacheState: "true"
    logLevel: "info"
    lastSeen: "ISO_8601_local"
    adapterConcurrent: "38"
    frontendEnabled: "true"
    frontendPort: "8080"
    frontendPackage: "zigbee2mqtt-windfront"
    homeassistantEnabled: "true"
    availabilityEnabled: "true"
matter:
  image:
    repository: ghcr.io/matter-js/matterjs-server
    tag: "1.5.5"
  pvc:
    size: 1Gi
homebridge:
  replicaCount: 1
  image:
    repository: homebridge/homebridge
    tag: "latest"
  pvc:
    size: 10Gi
volsync:
  backupSchedule: "0 2 * * *"
