apiVersion: v1
kind: Service
metadata:
  name: ha
  labels:
    app.kubernetes.io/name: home-assistant
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-home-assistant,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "ha-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "home-assistant.{{ .Values.cluster.name }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: https
      port: 443
      targetPort: 8123
---
apiVersion: v1
kind: Service
metadata:
  name: homebridge
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-home-assistant,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "homebridge-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "homebridge.{{ .Values.cluster.name }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: homebridge
  ports:
    - port: 80
      targetPort: 8581
---
apiVersion: v1
kind: Service
metadata:
  name: z2m
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-home-assistant,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "z2m-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "z2m.{{ .Values.cluster.name }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: zigbee
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
spec:
  selector:
    app: zigbee
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: mqtt-alt
      port: 1884
      targetPort: 1884
    - name: websocket
      port: 9001
      targetPort: 9001
