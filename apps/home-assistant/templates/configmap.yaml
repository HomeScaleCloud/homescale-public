apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest file /mosquitto/log/mosquitto.log

    allow_anonymous false
    password_file /mosquitto/config/passwd

    listener 1883
    listener 1884

    listener 9001
    protocol websockets
