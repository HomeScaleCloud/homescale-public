apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: omni
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-omni,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "omni-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: omni
    app.kubernetes.io/name: omni
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: k8s
  namespace: omni
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-omni,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "omni-k8s-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: omni
    app.kubernetes.io/name: omni
  ports:
    - name: https
      port: 443
      targetPort: 8095
      protocol: TCP
