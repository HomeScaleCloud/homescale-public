path: apps/omni
namespace: omni
releaseName: omni
syncWave: 0
tailscale:
  policy:
    rules:
      - sources: ["tag:github-actions", "group:team-infra-plat@REDACTED", "group:team-sec-plat@REDACTED"]
        protocol: tcp
        ports: ["80", "443"]

values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  siderolinkHostname: REDACTED
  machineApiHostname: REDACTED
  omni:
    image:
      repository: ghcr.io/siderolabs/omni
      tag: v1.10.6

    etcdEncryptionKey:
      existingSecret: omni # pragma: allowlist secret

    additionalConfigSources:
      - existingSecret: omni  # pragma: allowlist secret
        key: config.yaml

    config:
      account:
        id: 7848e298-4d35-4c33-a4c8-6659160b6afb
        name: HomeScale
      auth:
        auth0:
          enabled: false
        saml:
          enabled: true
          labelRules:
            "http://schemas.microsoft.com/ws/2008/06/identity/claims/groups": "groups"
      features:
        enableBreakGlassConfigs: true
      services:
        api:
          advertisedURL: "https://REDACTED"
          certFile: /tls/tls.crt
          keyFile: /tls/tls.key
        kubernetesProxy:
          advertisedURL: "https://REDACTED"
          certFile: /tls/tls.crt
          keyFile: /tls/tls.key
        machineAPI:
          advertisedURL: "https://REDACTED"
          certFile: /tls/tls.crt
          keyFile: /tls/tls.key
        siderolink:
          useGRPCTunnel: true

    service:
      wireguard:
        type: ClusterIP

    ingress:
      main:
        enabled: false
      kubernetesProxy:
        enabled: false
      siderolinkApi:
        enabled: false

    extraVolumes:
      - name: omni-tls
        secret:
          secretName: omni-tls

    extraVolumeMounts:
      - name: omni-tls
        mountPath: /tls
        readOnly: true

    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: omni
        scheme: HTTPS
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3

    persistence:
      enabled: true
      size: 30Gi
      existingClaim: omni

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
