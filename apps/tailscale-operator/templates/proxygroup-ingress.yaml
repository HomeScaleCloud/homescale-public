# Shared HA ingress ProxyGroup for this cluster. Every loadBalancerClass:
# tailscale Service is annotated `tailscale.com/proxy-group: ingress` so it
# gets a Tailscale Service (VIP) load-balanced across this pool instead of
# spinning up its own dedicated single-replica proxy pod per exposed
# Service.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress
spec:
  type: ingress
  replicas: 3
  hostnamePrefix: 'ingress-{{ required "cluster.name is required" .Values.cluster.name }}'
  tags:
    - 'tag:cluster-{{ required "cluster.name is required" .Values.cluster.name }}'
