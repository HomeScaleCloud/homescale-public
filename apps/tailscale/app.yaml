path: apps/tailscale
namespace: tailscale
releaseName: tailscale
syncWave: -20
podSecurity: privileged
syncOptions:
  - ServerSideApply=true
defaultDeploy: true
values:
  env:
    name: '{{ .Values.env.name }}'
  tailscale-operator:
    installCRDs: true
    operatorConfig:
      hostname: 'ts-operator-{{ .Values.env.name }}'
      defaultTags:
        - 'tag:k8s'
    proxyConfig:
      defaultTags: 'tag:k8s,tag:env-{{ .Values.env.name }}'
      defaultProxyClass: default
