apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-apiserver-proxy-nginx
  namespace: tailscale
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 443 ssl;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;

        location / {
          proxy_pass https://kubernetes.default.svc.cluster.local;

          proxy_ssl_trusted_certificate /ca/ca.crt;
          proxy_ssl_verify on;
          # Vultr VKE's apiserver cert omits the standard
          # kubernetes.default.svc.cluster.local SAN; kubernetes.default is
          # the shortest name guaranteed present on any apiserver cert.
          proxy_ssl_name kubernetes.default;
          proxy_ssl_server_name on;

          proxy_http_version 1.1;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Upgrade $http_upgrade;

          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
        }
      }
    }
