apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress
spec:
  type: ingress
  replicas: 3
  hostnamePrefix: 'ingress-{{ required "env.shortName is required" .Values.env.shortName }}'
  tags:
    - 'tag:k8s'
    - 'tag:env-{{ required "env.name is required" .Values.env.name }}'
