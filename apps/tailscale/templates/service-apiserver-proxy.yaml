apiVersion: v1
kind: Service
metadata:
  name: kube-apiserver-proxy
  namespace: tailscale
  annotations:
    tailscale.com/tags: 'tag:k8s,tag:k8s-api,tag:env-{{ required "env.name is required" .Values.env.name }}'
    tailscale.com/hostname: 'k8s-api-{{ required "env.shortName is required" .Values.env.shortName }}'
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: 'k8s.api.{{ required "env.shortName is required" .Values.env.shortName }}REDACTED'
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: kube-apiserver-proxy
  ports:
    - port: 443
      targetPort: https
