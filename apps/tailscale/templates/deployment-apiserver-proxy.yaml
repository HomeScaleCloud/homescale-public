apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-apiserver-proxy
  namespace: tailscale
  annotations:
    reloader.stakater.io/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-apiserver-proxy
  template:
    metadata:
      labels:
        app: kube-apiserver-proxy
      annotations:
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/configmap-apiserver-proxy.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          # Pinned past the nginx2root CVEs disclosed 2026-11-18 (fixed in 1.30.7/1.31.9) —
          # this config has no http2/http3/mail/resolver so those RCEs don't apply regardless,
          # but pinning removes any doubt from the floating 1.31-alpine tag's pull timing.
          image: nginx:1.31.9-alpine
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: kube-apiserver-proxy-nginx
        - name: tls
          secret:
            secretName: kube-apiserver-proxy-tls
        - name: ca
          configMap:
            name: kube-root-ca.crt
