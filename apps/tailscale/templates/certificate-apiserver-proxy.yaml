apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-apiserver-proxy-tls
  namespace: tailscale
spec:
  secretName: kube-apiserver-proxy-tls
  issuerRef:
    name: {{ .Values.certIssuer | default "letsencrypt" }}
    kind: ClusterIssuer
  dnsNames:
    - k8s.api.{{ required "env.name is required" .Values.env.name }}REDACTED
