path: apps/external-dns
namespace: external-dns
releaseName: external-dns
syncWave: -10
# Core infra now, same tier as netbird/tailscale-operator: every cluster
# needs its own external-dns to publish REDACTED records for
# whatever it exposes over Tailscale (argocd, metrics, and eventually
# tailscale-operator's apiserver-proxy all run per-cluster). Previously
# opt-in (mgmt only, for the unrelated REDACTED/traefik-public
# case) -- upsert-only policy + per-cluster txtOwnerId below make it safe to
# run everywhere without risk of one cluster's instance touching another's
# records.
defaultDeploy: true
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  external-dns:
    sources:
      - service
      - ingress
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare
            key: credential
    domainFilters: ["REDACTED"]
    # Required once external-dns runs in more than one cluster against the
    # same Cloudflare zone (needed for REDACTED records) --
    # without a distinct owner ID per cluster, each instance's TXT registry
    # would fight over records the others created.
    txtOwnerId: "{{ .Values.cluster.name }}"
