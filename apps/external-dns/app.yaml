path: apps/external-dns
namespace: external-dns
releaseName: external-dns
syncWave: -10
# Core infra now, same tier as tailscale: every cluster needs its
# own external-dns to publish REDACTED records for whatever
# it exposes over Tailscale. Previously opt-in (mgmt only, for the unrelated
# REDACTED/traefik-public case) -- sync policy + per-cluster
# txtOwnerId below scope deletion to each cluster's own registry, so one
# cluster can't delete records another cluster owns.
defaultDeploy: true
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  external-dns:
    policy: sync
    # external-dns v0.22.0 (chart 1.22.0) moved the annotation prefix from
    # external-dns.alpha.kubernetes.io/ (alpha) to external-dns.kubernetes.io/
    # (GA), with no fallback -- every Service/Ingress annotation in this repo
    # has been migrated to the new prefix to match. Pinned explicitly (rather
    # than relying on the chart default) so a future upstream default change
    # can't silently break annotation recognition again -- combined with
    # policy:sync, that previously caused a full DNS wipe fleet-wide.
    annotationPrefix: "external-dns.kubernetes.io/"
    sources:
      - service
      - ingress
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare
            key: credential
    domainFilters: ["REDACTED"]
    # Required once external-dns runs in more than one cluster against the
    # same Cloudflare zone (needed for REDACTED records) --
    # without a distinct owner ID per cluster, each instance's TXT registry
    # would fight over records the others created.
    txtOwnerId: "{{ .Values.cluster.name }}"
