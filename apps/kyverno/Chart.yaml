apiVersion: v2
name: kyverno
description: Helm chart for deploying the Kyverno policy engine
type: application
version: 0.1.0
dependencies:
  - name: kyverno
    version: 3.10.0
    repository: https://kyverno.github.io/kyverno/
annotations:
  REDACTED/namespace: "kyverno"
  REDACTED/sync-wave: "-25"
  REDACTED/default-deploy: "true"
  REDACTED/sync-options: "ServerSideApply=true"
  REDACTED/ignore-differences: |
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: deletingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: generatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: imagevalidatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: mutatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespaceddeletingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedgeneratingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedimagevalidatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedmutatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedvalidatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: policyexceptions.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: validatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
