apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-infisicalsecret-owner-policy
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["secrets.infisical.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["infisicalsecrets"]
  validationActions: [Deny]
  validations:
    - expression: >-
        !has(object.spec.managedKubeSecretReferences) ||
        object.spec.managedKubeSecretReferences.all(r, r.creationPolicy == 'Owner')
      message: "InfisicalSecret managedKubeSecretReferences must set creationPolicy: Owner so synced Kubernetes Secrets are cleaned up when the CR is deleted."
