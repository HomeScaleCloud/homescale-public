apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-discord-relay
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-discord-relay-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          DISCORD_WEBHOOK_URL: "{{`{{ .DISCORD_WEBHOOK_URL.Value }}`}}"
          TERRAKUBE_NOTIFY_SIGNING_SECRET: "{{`{{ .TERRAKUBE_NOTIFY_SIGNING_SECRET.Value }}`}}"
---
{{- $pvcs := list "postgres" "minio" }}
{{- range $pvcs }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-volsync-{{ . }}
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/volsync"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: {{ . }}-volsync-repo # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        data:
          RESTIC_REPOSITORY: "{{`{{ .RESTIC_REPOSITORY.Value }}`}}/{{ (((($.Values).volsync).restore).sourceEnv) | default $.Values.env.name }}/{{ . }}"
---
{{- end }}
