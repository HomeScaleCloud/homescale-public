apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-api
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-api-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-executor
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-executor-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
        data:
          AwsTerraformStateAccessKey: "{{`{{ .AwsStorageAccessKey.Value }}`}}"
          AwsTerraformStateSecretKey: "{{`{{ .AwsStorageSecretKey.Value }}`}}"
          AwsTerraformOutputAccessKey: "{{`{{ .AwsStorageAccessKey.Value }}`}}"
          AwsTerraformOutputSecretKey: "{{`{{ .AwsStorageSecretKey.Value }}`}}"
---
