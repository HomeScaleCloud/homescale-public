# PatSecret/InternalSecret (Dex signing secrets), DatasourcePassword/TerrakubeRedisPassword/
# AwsStorageAccessKey/AwsStorageSecretKey (bundled Postgres/Valkey/MinIO credentials), and
# ENTRA_CLIENT_ID/ENTRA_CLIENT_SECRET/ENTRA_ISSUER_URL (Terrakube's own, dedicated Entra app
# registration — deliberately NOT the shared /k8s/oidc client every other app uses) all live
# together at /k8s/terrakube. Synced into three differently-named Secrets below because the
# upstream chart's api/executor/registry deployments each envFrom a differently-named Secret
# with its own expected key set (see apps/terrakube/values.yaml comments) — setting each
# component's existingSecret flag to true skips the chart's own Secret, which would otherwise
# bake these values in directly from Helm values (i.e. git) rather than from Infisical.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-api
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-api-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-executor
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-executor-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-terrakube-registry
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/terrakube"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: terrakube-registry-secrets # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
---
{{- $pvcs := list "postgres" "minio" }}
{{- range $pvcs }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-volsync-{{ . }}
  namespace: terrakube
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/volsync"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: {{ . }}-volsync-repo # pragma: allowlist secret
      secretNamespace: terrakube
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        data:
          RESTIC_REPOSITORY: "{{`{{ .RESTIC_REPOSITORY.Value }}`}}/{{ (((($.Values).volsync).restore).sourceEnv) | default $.Values.env.name }}/{{ . }}"
---
{{- end }}
