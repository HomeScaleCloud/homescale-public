apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-relay
  namespace: terrakube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-relay
  template:
    metadata:
      labels:
        app: discord-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discord-relay
          image: "{{ .Values.discordRelay.image.repository }}:{{ .Values.discordRelay.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: terrakube-discord-relay-secrets
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
