{{/*
All four hostnames route through the same terrakube-tls-proxy pod (templates/tls-proxy.yaml),
which terminates TLS and picks the right backend by SNI/Host — see that file's comment for why
a TLS-terminating proxy is needed at all. Each Service below just gives that one pod a
different Tailscale hostname/DNS name on port 443.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: terrakube-ui-tailscale
  namespace: terrakube
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-terrakube,tag:env-{{ required "env.name is required" .Values.env.name }}"
    tailscale.com/hostname: "tf"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: terrakube-tls-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
---
