kind: Service
metadata:
  name: terrakube-registry-tailscale
  namespace: terrakube
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-terrakube,tag:env-{{ required "env.name is required" .Values.env.name }}"
    tailscale.com/hostname: "reg-terra-{{ required "env.shortName is required" .Values.env.shortName }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "reg.terra.{{ required "env.shortName is required" .Values.env.shortName }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: terrakube
    app.kubernetes.io/instance: terrakube
    app.kubernetes.io/component: terrakube-registry
