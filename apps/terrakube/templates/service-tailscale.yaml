---
apiVersion: v1
kind: Service
metadata:
  name: terrakube-dex-tailscale
  namespace: terrakube
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-terrakube,tag:env-{{ required "env.name is required" .Values.env.name }}"
    tailscale.com/hostname: "dex-terra-{{ required "env.shortName is required" .Values.env.shortName }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "dex.terra.{{ required "env.shortName is required" .Values.env.shortName }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: dex
    app.kubernetes.io/instance: terrakube
  ports:
    - name: http
      port: 80
      targetPort: http
