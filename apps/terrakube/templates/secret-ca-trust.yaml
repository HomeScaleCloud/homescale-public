{{- $cm := lookup "v1" "ConfigMap" "terrakube" "kube-root-ca.crt" | default dict }}
{{- $data := $cm.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-ca-trust
  namespace: terrakube
type: Opaque
stringData:
  type: ca-certificates
  cluster-ca.crt: {{ dig "ca.crt" "" $data | quote }}
