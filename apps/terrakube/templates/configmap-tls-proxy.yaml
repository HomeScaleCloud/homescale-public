apiVersion: v1
kind: ConfigMap
metadata:
  name: terrakube-tls-proxy
  namespace: terrakube
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 443 ssl;
        server_name REDACTED;
        ssl_certificate /etc/terrakube-tls/tls.crt;
        ssl_certificate_key /etc/terrakube-tls/tls.key;
        location / {
          proxy_pass http://terrakube-ui-service:8080;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
      server {
        listen 443 ssl;
        server_name REDACTED;
        ssl_certificate /etc/terrakube-tls/tls.crt;
        ssl_certificate_key /etc/terrakube-tls/tls.key;
        location / {
          proxy_pass http://terrakube-api-service:8080;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
      server {
        listen 443 ssl;
        server_name REDACTED;
        ssl_certificate /etc/terrakube-tls/tls.crt;
        ssl_certificate_key /etc/terrakube-tls/tls.key;
        location / {
          proxy_pass http://terrakube-registry-service:8075;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
      server {
        listen 443 ssl;
        server_name REDACTED;
        ssl_certificate /etc/terrakube-tls/tls.crt;
        ssl_certificate_key /etc/terrakube-tls/tls.key;
        location / {
          proxy_pass http://terrakube-dex:5556;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
