{{/*
TLS-terminating nginx in front of UI/API/Registry/Dex — see templates/certificate.yaml for why
this exists at all. One pod, one cert, SNI-routed to each backend's ClusterIP Service. The
Tailscale LoadBalancer Services (service-tailscale.yaml) all select this pod on port 443.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrakube-tls-proxy
  namespace: terrakube
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: terrakube-tls-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terrakube-tls-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-tls-proxy.yaml") . | sha256sum }}
        reloader.stakater.io/auto: "true"
    spec:
      containers:
        - name: nginx
          # Pinned past the nginx2root CVEs disclosed 2026-11-18 (fixed in 1.30.7/1.31.9);
          # this config doesn't enable http2/http3/mail/resolver so those RCEs don't apply
          # regardless, but no reason to sit on an older line.
          image: nginx:1.31.10-alpine
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/terrakube-tls
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: terrakube-tls-proxy
        - name: tls
          secret:
            secretName: terrakube-tls
