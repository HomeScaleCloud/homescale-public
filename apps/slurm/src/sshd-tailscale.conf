# No keys, no passwords — identity comes from the Tailscale sidecar via PAM
# (see pam-sshd / pam-tailscale-whois.sh). Reachability itself is already
# gated by the tailnet ACL, but this rejects anything that isn't a real
# tailnet peer resolving to a REDACTED identity.
PermitRootLogin no
PubkeyAuthentication no
PasswordAuthentication no
KbdInteractiveAuthentication yes
UsePAM yes
AuthenticationMethods keyboard-interactive
