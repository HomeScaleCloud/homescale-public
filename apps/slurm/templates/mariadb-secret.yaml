{{- /* Random on every render — stays stable in-cluster via ignoreDifferences in app.yaml (Argo CD's helm template doesn't support lookup()). */}}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-password # pragma: allowlist secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ randAlphaNum 32 | b64enc }}
