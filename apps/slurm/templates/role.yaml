apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mariadb-password-init # pragma: allowlist secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["mariadb-password"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
