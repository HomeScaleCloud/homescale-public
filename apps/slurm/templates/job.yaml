{{- /*
Checks-then-creates against the live API: genuinely exactly-once, unlike a
Helm-templated randAlphaNum/randAscii secret (which Argo CD re-renders fresh on
every sync since it doesn't support Helm's lookup()). Also takes over
slurm-auth-slurm/slurm-auth-jwt from the vendored chart's own generation
(slurmKey.create/jwtKey.create: false below), which are marked immutable: true
and would hard-fail the sync on a re-render.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: secrets-init
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/alpine/k8s:1.37.0
          # Root (not the usual nonroot default) — apk add needs to write /lib/apk/db
          # to install ssh-keygen for the shared login->compute SSH keypair below.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu

              ensure_secret() {
                name="$1"; key="$2"; length="$3"
                if kubectl get secret "$name" -n "$NAMESPACE" >/dev/null 2>&1; then
                  echo "$name already exists, leaving it alone"
                  return
                fi
                value="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$length")"
                kubectl create secret generic "$name" -n "$NAMESPACE" \
                  --from-literal="${key}=${value}"
              }

              ensure_secret mariadb-password password 32
              ensure_secret slurm-auth-slurm slurm.key 1024

              # auth/jwt's key must be raw random bytes, not ASCII text
              # (https://slurm.schedmd.com/jwt.html: "dd if=/dev/random ... bs=32 count=1")
              # — an ensure_secret-generated (alnum-filtered) key fails every RPC
              # with "jwt_decode failure: Invalid argument".
              if kubectl get secret slurm-auth-jwt -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "slurm-auth-jwt already exists, leaving it alone"
              else
                head -c 32 /dev/urandom > /tmp/jwt.key
                kubectl create secret generic slurm-auth-jwt -n "$NAMESPACE" \
                  --from-file="jwt.key=/tmp/jwt.key"
              fi

              # Shared keypair for login-node -> compute-node SSH hops. Not a
              # per-user credential — pam_slurm_adopt does the actual authorization;
              # this only proves "came from our login pod".
              if kubectl get secret slurm-ssh-hop-key -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "slurm-ssh-hop-key already exists, leaving it alone"
              else
                apk add --no-cache openssh-keygen >/dev/null
                ssh-keygen -t ed25519 -N "" -C "slurm-ssh-hop" -f /tmp/hop-key
                kubectl create secret generic slurm-ssh-hop-key -n "$NAMESPACE" \
                  --from-file="id_ed25519=/tmp/hop-key" \
                  --from-file="id_ed25519.pub=/tmp/hop-key.pub"
              fi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
