path: apps/slurm
namespace: slurm
releaseName: slurm
syncWave: 0
podSecurity: privileged
defaultDeploy: false
tailscale:
  policy:
    rules:
      - sources: ["group:owners@REDACTED"]
        protocol: tcp
        ports: ["22"]
extraSources:
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator-crds
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator-crds
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator
      valuesObject:
        certManager:
          enabled: true
values:
  slurm:
    prologScripts:
      00-provision-user.sh: |
        #!/usr/bin/env bash
        # Mirrors the login node's account for this job's owner onto every
        # compute node the job lands on. Runs as root, before the job's
        # tasks start (Prolog, not PrologSlurmctld) — this is what makes
        # dynamically-created login users (see apps/slurm/src/) usable for
        # actual jobs: the login node creates the account on SSH, but that
        # never reaches the compute nodes on its own. No re-verification
        # against Tailscale here — SLURM_JOB_UID/USER/GID are already the
        # UID the login node assigned at submission time; the controller
        # already trusts that job, so this just replicates it locally.
        set -euo pipefail
        if ! id "$SLURM_JOB_USER" >/dev/null 2>&1; then
          groupadd --gid "$SLURM_JOB_GID" "$SLURM_JOB_USER" 2>/dev/null || true
          useradd --uid "$SLURM_JOB_UID" --gid "$SLURM_JOB_GID" --create-home --shell /bin/bash "$SLURM_JOB_USER"
        fi
        # Trust the shared login->compute hop key for pam_slurm_adopt SSH
        # (see nodesets.compute.podSpec.volumes below) — authorization there
        # is the job check itself, not this key.
        home="$(getent passwd "$SLURM_JOB_USER" | cut -d: -f6)"
        mkdir -p "$home/.ssh"
        cp /etc/slurm-ssh/id_ed25519.pub "$home/.ssh/authorized_keys"
        chown -R "$SLURM_JOB_UID:$SLURM_JOB_GID" "$home/.ssh"
        chmod 700 "$home/.ssh"
        chmod 600 "$home/.ssh/authorized_keys"
    slurmKey:
      create: false
      secretRef:
        name: slurm-auth-slurm
        key: slurm.key
    jwtKey:
      create: false
      secretRef:
        name: slurm-auth-jwt
        key: jwt.key
    accounting:
      enabled: true
    controller:
      extraConfMap:
        # Required for pam_slurm_adopt (the compute-node SSH gate) to see
        # a job at all — without it, jobs get no "extern" step and every
        # SSH attempt is denied with "no active jobs" even while one is
        # genuinely running. Confirmed live in minikube: SSH to a node
        # with a real running job failed with exactly that message until
        # this was set, then worked immediately.
        PrologFlags:
          - Contain
      persistence:
        storageClassName: longhorn
    nodesets:
      compute:
        replicas: 3
        partition:
          enabled: false
        slurmd:
          volumeMounts:
            - name: ssh-hop-pubkey
              mountPath: /etc/slurm-ssh
              readOnly: true
        podSpec:
          volumes:
            - name: ssh-hop-pubkey
              secret:
                secretName: slurm-ssh-hop-key  # pragma: allowlist secret
                items:
                  - key: id_ed25519.pub
                    path: id_ed25519.pub
    partitions:
      all:
        enabled: true
    restapi:
      # slurmrestd's own slurm.conf (shared via the same configmap as the
      # controller) sets AuthAltParameters=jwt_key=/etc/slurm/jwt.key, but
      # the operator's RestApi reconciliation doesn't project the jwt-auth
      # secret into that pod the way it does for Controller (confirmed by
      # comparing live pod specs: slurm-controller-0's slurm-etc volume has
      # a slurm-auth-jwt source, slurm-restapi's doesn't) — so the file
      # never exists there and every slurmctld RPC slurmrestd makes fails
      # auth ("jwt_decode failure: Invalid argument" on the controller
      # side), which also breaks the operator's own reconciliation since it
      # talks to slurmctld through slurmrestd's REST API. Mounting the same
      # secret directly onto that one path (RestApi has no jwtKeyRef-style
      # field to do this via the CR itself) works around it.
      slurmrestd:
        volumeMounts:
          - name: jwt-key
            mountPath: /etc/slurm/jwt.key
            subPath: jwt.key
            readOnly: true
      podSpec:
        volumes:
          - name: jwt-key
            secret:
              secretName: slurm-auth-jwt  # pragma: allowlist secret
              items:
                - key: jwt.key
                  path: jwt.key
    loginsets:
      login:
        replicas: 1
        service:
          spec:
            type: ClusterIP
        login:
          image:
            repository: ghcr.io/homescalecloud/slurm-login
            tag: "latest"  # pragma: allowlist secret
          volumeMounts:
            - name: tailscale-socket
              mountPath: /var/run/tailscale
            - name: ssh-hop-key
              mountPath: /etc/ssh/cluster-hop-key
              subPath: cluster-hop-key
              readOnly: true
        podSpec:
          serviceAccountName: slurm-login
          automountServiceAccountToken: true
          initContainers:
            - name: tailscale
              image: tailscale/tailscale:v1.102.4
              restartPolicy: Always
              env:
                - name: TS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: slurm-tailscale-oauth  # pragma: allowlist secret
                      key: client_id
                - name: TS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: slurm-tailscale-oauth  # pragma: allowlist secret
                      key: client_secret
                - name: TS_USERSPACE
                  value: "false"
                - name: TS_KUBE_SECRET
                  value: slurm-login-tailscale-state  # pragma: allowlist secret
                - name: TS_SOCKET
                  value: /var/run/tailscale/tailscaled.sock
                - name: TS_HOSTNAME
                  value: "slurm-login-{{ .Values.cluster.name }}"
                - name: TS_EXTRA_ARGS
                  value: "--advertise-tags=tag:k8s,tag:app-slurm,tag:cluster-{{ .Values.cluster.name }}"
                - name: TS_ACCEPT_DNS
                  value: "false"
                - name: TS_AUTH_ONCE
                  value: "true"
              securityContext:
                capabilities:
                  add: ["NET_ADMIN"]
              volumeMounts:
                - name: tailscale-socket
                  mountPath: /var/run/tailscale
          volumes:
            - name: tailscale-socket
              emptyDir: {}
            - name: ssh-hop-key
              secret:
                secretName: slurm-ssh-hop-key  # pragma: allowlist secret
                items:
                  - key: id_ed25519
                    path: cluster-hop-key
                    mode: 0444
