path: apps/slurm
namespace: slurm
releaseName: slurm
syncWave: 0
podSecurity: privileged
defaultDeploy: false
tailscale:
  policy:
    rules:
      - sources: ["group:owners@REDACTED"]
        protocol: tcp
        ports: ["22"]
extraSources:
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator-crds
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator-crds
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator
      valuesObject:
        certManager:
          enabled: true
values:
  slurm:
    slurmKey:
      create: false
      secretRef:
        name: slurm-auth-slurm
        key: slurm.key
    jwtKey:
      create: false
      secretRef:
        name: slurm-auth-jwt
        key: jwt.key
    accounting:
      enabled: true
    controller:
      persistence:
        storageClassName: longhorn
    nodesets:
      compute:
        replicas: 3
        partition:
          enabled: false
    partitions:
      all:
        enabled: true
    loginsets:
      login:
        replicas: 1
        service:
          spec:
            type: ClusterIP
        login:
          image:
            repository: ghcr.io/homescalecloud/slurm-login
            tag: "latest"  # pragma: allowlist secret
          volumeMounts:
            - name: tailscale-socket
              mountPath: /var/run/tailscale
        podSpec:
          serviceAccountName: slurm-login
          automountServiceAccountToken: true
          initContainers:
            - name: tailscale
              image: tailscale/tailscale:v1.102.4
              restartPolicy: Always
              env:
                - name: TS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: slurm-tailscale-oauth  # pragma: allowlist secret
                      key: client_id
                - name: TS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: slurm-tailscale-oauth  # pragma: allowlist secret
                      key: client_secret
                - name: TS_USERSPACE
                  value: "false"
                - name: TS_KUBE_SECRET
                  value: slurm-login-tailscale-state  # pragma: allowlist secret
                - name: TS_SOCKET
                  value: /var/run/tailscale/tailscaled.sock
                - name: TS_HOSTNAME
                  value: "slurm-login-{{ .Values.cluster.name }}"
                - name: TS_EXTRA_ARGS
                  value: "--advertise-tags=tag:k8s,tag:app-slurm,tag:cluster-{{ .Values.cluster.name }}"
                - name: TS_ACCEPT_DNS
                  value: "false"
                - name: TS_AUTH_ONCE
                  value: "true"
              securityContext:
                capabilities:
                  add: ["NET_ADMIN"]
              volumeMounts:
                - name: tailscale-socket
                  mountPath: /var/run/tailscale
          volumes:
            - name: tailscale-socket
              emptyDir: {}
