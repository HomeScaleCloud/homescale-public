path: apps/slurm
namespace: slurm
releaseName: slurm
syncWave: 0
defaultDeploy: false
# slurm-auth-slurm/slurm-auth-jwt use Helm's lookup() to generate once, which
# Argo CD's helm template doesn't support (always nil) — without this they'd
# get a fresh random value every reconcile.
ignoreDifferences:
  - group: ""
    kind: Secret
    name: slurm-auth-slurm
    jsonPointers:
      - /data
  - group: ""
    kind: Secret
    name: slurm-auth-jwt
    jsonPointers:
      - /data
extraSources:
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator-crds
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator-crds
  - repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator
    targetRevision: "1.2.2"
    helm:
      releaseName: slurm-operator
      valuesObject:
        certManager:
          enabled: true
values:
  slurm:
    accounting:
      enabled: true
    controller:
      persistence:
        storageClassName: longhorn
    nodesets:
      compute:
        replicas: 3
        partition:
          enabled: false
    partitions:
      all:
        enabled: true
