apiVersion: v2
name: metrics
description: Helm chart for Grafana/Prometheus monitoring stack
type: application
version: 0.1.0
dependencies:
  - name: kube-prometheus-stack
    version: 93.1.2
    repository: https://prometheus-community.github.io/helm-charts
  - name: metrics-server
    version: 3.14.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
  - name: alloy
    version: 1.15.0
    repository: https://grafana.github.io/helm-charts
annotations:
  REDACTED/namespace: "metrics"
  REDACTED/default-deploy: "true"
  REDACTED/pod-security: "privileged"
  REDACTED/sync-options: "ServerSideApply=true"
  REDACTED/ignore-differences: |
    - group: ''
      kind: Service
      jsonPointers:
        - /spec/externalName
