title: Virtual Machines
uid: k8s_views_vms
description: 'Per-VM view of KubeVirt VirtualMachineInstances -- CPU, memory, disk and network usage plus live migration transfer stats for individual VMs. For cluster-wide KubeVirt component health see the KubeVirt dashboard in the Platform folder.'
tags:
  - Kubernetes
  - Prometheus
  - KubeVirt
editable: true
graphTooltip: 1
refresh: 30s
schemaVersion: 42
version: 1
time:
  from: now-1h
  to: now
timepicker: {}
fiscalYearStartMonth: 0
links: []
annotations:
  list:
    - builtIn: 1
      datasource:
        type: datasource
        uid: grafana
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      target:
        limit: 100
        matchAny: false
        tags: []
        type: dashboard
      type: dashboard
templating:
  list:
    - current:
        selected: false
        text: ''
        value: ''
      includeAll: false
      name: datasource
      options: []
      query: prometheus
      refresh: 1
      regex: ''
      type: datasource
    - current:
        text: ''
        value: ''
      datasource:
        type: prometheus
        uid: ${datasource}
      definition: label_values(kube_node_info,cluster)
      includeAll: true
      name: cluster
      options: []
      query:
        qryType: 1
        query: label_values(kube_node_info,cluster)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      regex: ''
      sort: 1
      type: query
    - current:
        selected: false
        text: ''
        value: ''
      datasource:
        type: prometheus
        uid: ${datasource}
      definition: label_values(kubevirt_vmi_info{cluster=~"$cluster"}, namespace)
      includeAll: false
      name: namespace
      options: []
      query:
        query: label_values(kubevirt_vmi_info{cluster=~"$cluster"}, namespace)
        refId: Prometheus-namespace-Variable-Query
      refresh: 1
      regex: ''
      sort: 1
      type: query
    - allValue: .*
      current:
        selected: false
        text: ''
        value: ''
      datasource:
        type: prometheus
        uid: ${datasource}
      definition: label_values(kubevirt_vmi_info{namespace="$namespace", cluster=~"$cluster"}, name)
      includeAll: true
      multi: true
      name: vm
      options: []
      query:
        query: label_values(kubevirt_vmi_info{namespace="$namespace", cluster=~"$cluster"}, name)
        refId: Prometheus-vm-Variable-Query
      refresh: 2
      regex: ''
      sort: 1
      type: query
    - current:
        text: 30s
        value: 30s
      includeAll: false
      name: resolution
      options:
        - selected: false
          text: 1s
          value: 1s
        - selected: false
          text: 15s
          value: 15s
        - selected: true
          text: 30s
          value: 30s
        - selected: false
          text: 1m
          value: 1m
        - selected: false
          text: 3m
          value: 3m
        - selected: false
          text: 5m
          value: 5m
      query: 1s, 15s, 30s, 1m, 3m, 5m
      type: custom
panels:
  - type: row
    title: Alerts
    id: 10
    collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 0
    panels:
      - type: state-timeline
        title: Alert Timeline
        id: 11
        datasource:
          type: prometheus
          uid: ${datasource}
        gridPos:
          h: 8
          w: 24
          x: 0
          'y': 1
        options:
          alignValue: left
          legend:
            displayMode: list
            placement: bottom
            showLegend: true
          mergeValues: true
          rowHeight: 0.9
          showValue: auto
          tooltip:
            mode: single
            sort: none
        fieldConfig:
          defaults:
            color:
              mode: thresholds
            custom:
              fillOpacity: 70
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineWidth: 0
              spanNulls: false
            mappings:
              - type: value
                options:
                  '1':
                    color: yellow
                    index: 0
                    text: Warning / Pending
                  '2':
                    color: red
                    index: 1
                    text: Critical (Firing)
            thresholds:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
                - color: red
                  value: 2
          overrides: []
        targets:
          - datasource:
              type: prometheus
              uid: ${datasource}
            expr: max without (alertstate) ((ALERTS{cluster=~"$cluster", namespace=~"$namespace", name=~"$vm", severity="critical", alertstate="firing"} * 2) or (ALERTS{cluster=~"$cluster", namespace=~"$namespace", name=~"$vm", alertstate="pending"} * 1) or (ALERTS{cluster=~"$cluster", namespace=~"$namespace", name=~"$vm", severity="warning"} * 1))
            legendFormat: '{{alertname}} [{{severity}}]'
            range: true
            instant: false
            refId: A
      - type: table
        title: Active Alerts
        id: 12
        datasource:
          type: prometheus
          uid: ${datasource}
        gridPos:
          h: 8
          w: 24
          x: 0
          'y': 9
        options:
          cellHeight: sm
          footer:
            countRows: false
            fields: ''
            reducer:
              - sum
            show: false
          showHeader: true
          sortBy:
            - desc: false
              displayName: alertname
        fieldConfig:
          defaults:
            custom:
              align: auto
              cellOptions:
                type: auto
              inspect: false
          overrides:
            - matcher:
                id: byName
                options: cluster
              properties:
                - id: custom.width
                  value: 140
            - matcher:
                id: byName
                options: alertname
              properties:
                - id: custom.width
                  value: 300
            - matcher:
                id: byName
                options: alertstate
              properties:
                - id: custom.width
                  value: 90
                - id: custom.cellOptions
                  value:
                    type: color-background
                    mode: basic
                - id: mappings
                  value:
                    - type: value
                      options:
                        firing:
                          color: red
                          index: 0
                          text: firing
                        pending:
                          color: yellow
                          index: 1
                          text: pending
            - matcher:
                id: byName
                options: severity
              properties:
                - id: custom.width
                  value: 100
                - id: custom.cellOptions
                  value:
                    type: color-background
                    mode: basic
                - id: mappings
                  value:
                    - type: value
                      options:
                        warning:
                          color: yellow
                          index: 0
                          text: warning
                        critical:
                          color: red
                          index: 1
                          text: critical
                        info:
                          color: blue
                          index: 2
                          text: info
            - matcher:
                id: byName
                options: name
              properties:
                - id: links
                  value:
                    - title: VM details
                      url: /d/k8s_views_vms/virtual-machines?${datasource:queryparam}&${cluster:queryparam}&var-namespace=${__data.fields.namespace}&var-vm=${__value.text}&${resolution:queryparam}&${__url_time_range}
                      targetBlank: true
        targets:
          - datasource:
              type: prometheus
              uid: ${datasource}
            expr: ALERTS{cluster=~"$cluster", alertstate=~"firing|pending", namespace=~"$namespace", name=~"$vm"}
            instant: true
            format: table
            legendFormat: ''
            refId: A
        transformations:
          - id: organize
            options:
              excludeByName:
                Time: true
                Value: true
                __name__: true
                endpoint: true
                instance: true
                job: true
                prometheus: true
                prometheus_replica: true
                service: true
                container: true
              indexByName:
                alertname: 0
                alertstate: 1
                severity: 2
                namespace: 3
                name: 4
                cluster: 5
                node: 6
              renameByName: {}
  - type: row
    title: Logs
    id: 13
    collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 1
    panels:
      - type: logs
        title: Kubernetes Events
        id: 14
        datasource:
          type: loki
          uid: loki
        gridPos:
          h: 14
          w: 24
          x: 0
          'y': 2
        options:
          dedupStrategy: none
          enableLogDetails: true
          prettifyLogMessage: false
          showCommonLabels: false
          showLabels: false
          showTime: true
          sortOrder: Descending
          wrapLogMessage: true
        targets:
          - datasource:
              type: loki
              uid: loki
            editorMode: code
            expr: '{cluster=~"$cluster", job="integrations/kubernetes/eventhandler", namespace=~"$namespace"} | logfmt | kind=~`VirtualMachine|VirtualMachineInstance` | name=~`$vm`'
            queryType: range
            refId: A
  - type: row
    title: Overview
    id: 15
    collapsed: false
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 2
    panels: []
  - type: gauge
    title: Memory Usage
    description: Guest memory currently assigned via the balloon driver, as a fraction of memory allocated to the domain.
    id: 16
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 4
      x: 0
      'y': 3
    options:
      minVizHeight: 75
      minVizWidth: 75
      orientation: auto
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      showThresholdLabels: false
      showThresholdMarkers: true
      sizing: auto
    fieldConfig:
      defaults:
        decimals: 2
        mappings: []
        max: 1
        min: 0
        thresholds:
          mode: percentage
          steps:
            - color: green
              value: null
            - color: orange
              value: 50
            - color: red
              value: 70
        unit: percentunit
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: false
        expr: sum(kubevirt_vmi_memory_actual_balloon_bytes{namespace="$namespace", name=~"$vm", cluster=~"$cluster"}) / sum(kubevirt_vmi_memory_domain_bytes{namespace="$namespace", name=~"$vm", cluster=~"$cluster"})
        instant: true
        interval: $resolution
        legendFormat: ''
        refId: A
  - type: stat
    title: CPU Usage
    description: Sum of vCPU usage across the matched VMs, in cores.
    id: 17
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 4
      x: 4
      'y': 3
    options:
      colorMode: value
      graphMode: area
      justifyMode: auto
      orientation: auto
      percentChangeColorMode: standard
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      showPercentChange: false
      text: {}
      textMode: auto
      wideLayout: true
    fieldConfig:
      defaults:
        decimals: 2
        mappings: []
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
            - color: blue
              value: null
        unit: none
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: false
        expr: sum(rate(kubevirt_vmi_cpu_usage_seconds_total{namespace="$namespace", name=~"$vm", cluster=~"$cluster"}[$__rate_interval]))
        interval: $resolution
        legendFormat: ''
        refId: A
  - type: stat
    title: VM Count
    description: Number of VirtualMachineInstances matching the current namespace/vm filter.
    id: 18
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 4
      x: 8
      'y': 3
    options:
      colorMode: value
      graphMode: none
      justifyMode: auto
      orientation: auto
      percentChangeColorMode: standard
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      showPercentChange: false
      text: {}
      textMode: value
      wideLayout: true
    fieldConfig:
      defaults:
        mappings: []
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
            - color: blue
              value: null
        unit: none
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: false
        expr: count(kubevirt_vmi_info{namespace="$namespace", name=~"$vm", cluster=~"$cluster"})
