            - id: custom.width
              value: 120
        - matcher:
            id: byName
            options: name
          properties:
            - id: custom.width
              value: 220
            - id: links
              value:
                - title: VM details
                  url: /d/k8s_views_vms/virtual-machines?${datasource:queryparam}&${cluster:queryparam}&${namespace:queryparam}&var-vm=${__value.text}&${resolution:queryparam}&${__url_time_range}
                  targetBlank: true
        - matcher:
            id: byName
