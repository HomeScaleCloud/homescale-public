        interval: ''
        legendFormat: ''
        refId: A
  - type: table
    title: List of VMs
    description: Browse the VirtualMachineInstances matched by the current namespace/vm filter. Click a VM or node to drill into its dashboard.
    id: 19
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 16
      w: 12
      x: 12
      'y': 3
    options:
      cellHeight: sm
      footer:
        countRows: false
