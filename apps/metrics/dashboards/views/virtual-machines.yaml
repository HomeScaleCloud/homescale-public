                    scheduled:
                      color: yellow
                      index: 3
                      text: scheduled
                    failed:
                      color: red
                      index: 4
                      text: failed
                    succeeded:
                      color: blue
                      index: 5
                      text: succeeded
        - matcher:
            id: byName
            options: evictable
