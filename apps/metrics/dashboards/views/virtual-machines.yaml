              value: 260
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: true
        expr: kubevirt_vmi_info{namespace="$namespace", name=~"$vm", cluster=~"$cluster"}
        format: table
        instant: true
        interval: ''
        legendFormat: ''
        refId: A
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            Value: true
            __name__: true
            container: true
            endpoint: true
            instance: true
            job: true
            namespace: true
            outdated: true
            pod: true
            prometheus: true
            prometheus_replica: true
            service: true
          indexByName:
            name: 0
            node: 1
            phase: 2
            evictable: 3
            cluster: 4
            vmi_pod: 5
            guest_os_machine: 6
          renameByName:
            vmi_pod: Launcher Pod
            guest_os_machine: Machine Type
            evictable: Evictable
  - type: stat
    title: VM Phase
    description: Panel only works when a single VM is selected.
    id: 20
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 4
      x: 0
      'y': 11
    options:
      colorMode: value
