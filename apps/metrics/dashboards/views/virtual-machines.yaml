    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: false
        expr: kubevirt_vmi_info{namespace="$namespace", name=~"$vm", cluster=~"$cluster"}
        instant: true
        interval: ''
