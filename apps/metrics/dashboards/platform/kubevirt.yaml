        legendFormat: '{{ phase }}'
        refId: A
  - type: bargauge
    title: VMs per Node
    id: 14
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 6
      x: 6
      'y': 7
    options:
      displayMode: gradient
      minVizHeight: 10
      minVizWidth: 0
      orientation: horizontal
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      showUnfilled: true
      valueMode: color
    fieldConfig:
