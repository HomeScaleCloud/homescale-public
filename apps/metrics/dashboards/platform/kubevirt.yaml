  - type: stat
    title: Non-Evictable VMs
    description: VMs KubeVirt currently considers unsafe to evict/live-migrate off their node (e.g. due to non-migratable storage or device attachments). Should be 0.
    id: 22
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 3
      x: 18
      'y': 3
    options:
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      percentChangeColorMode: standard
      showPercentChange: false
      textMode: auto
      wideLayout: true
    fieldConfig:
