        legendFormat: ''
        refId: A
  - type: stat
    title: virt-operator
    id: 9
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 3
      x: 6
      'y': 3
    options:
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      percentChangeColorMode: standard
      showPercentChange: false
      textMode: auto
