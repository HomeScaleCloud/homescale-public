        instant: true
        legendFormat: '{{ node }}'
        refId: A
  - type: table
    title: Component Pods
    description: virt-api / virt-controller / virt-operator / virt-handler / cdi-* pods.
    id: 15
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 12
      x: 12
      'y': 7
    options:
      cellHeight: sm
      footer:
        countRows: false
        fields: ''
        reducer:
          - sum
        show: false
      showHeader: true
      sortBy: []
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          inspect: false
        mappings: []
        thresholds:
          mode: absolute
          steps:
            - color: green
              value: null
            - color: red
              value: 80
      overrides:
        - matcher:
            id: byName
            options: pod
          properties:
            - id: custom.width
              value: 260
            - id: links
              value:
                - title: Pod details
                  url: /d/k8s_views_pods/kubernetes-views-pods?${datasource:queryparam}&${cluster:queryparam}&var-namespace=${__data.fields.namespace}&var-pod=${__value.text}&var-resolution=30s&${__url_time_range}
                  targetBlank: true
        - matcher:
            id: byName
            options: node
          properties:
            - id: custom.width
              value: 160
            - id: links
              value:
                - title: Node details
                  url: /d/k8s_views_nodes/kubernetes-views-nodes?${datasource:queryparam}&${cluster:queryparam}&var-node=${__value.text}&var-resolution=30s&${__url_time_range}
                  targetBlank: true
        - matcher:
            id: byName
            options: namespace
          properties:
            - id: custom.width
              value: 100
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: true
        expr: kube_pod_info{namespace=~"kubevirt|cdi", cluster=~"$cluster"}
        format: table
        instant: true
        interval: ''
        legendFormat: ''
        refId: A
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            Value: true
            __name__: true
            container: true
            created_by_kind: true
            created_by_name: true
            endpoint: true
            env: true
            host_ip: true
            host_network: true
            instance: true
            job: true
            pod_ip: true
            priority_class: true
            project: true
            prometheus_replica: true
            service: true
            uid: true
          indexByName:
            pod: 0
            namespace: 1
            node: 2
            cluster: 3
          renameByName: {}
  - type: row
    title: Migrations
    id: 16
    collapsed: false
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 15
    panels: []
  - type: timeseries
    title: Live Migrations by Phase
    description: Cluster-wide count of VirtualMachineInstanceMigrations currently in each phase.
    id: 17
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 12
      x: 0
      'y': 16
    options:
      legend:
        calcs: []
        displayMode: list
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: false
        mode: multi
        sort: desc
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisCenteredZero: false
          axisColorMode: text
          axisLabel: ''
          axisPlacement: auto
          barAlignment: 0
          barWidthFactor: 0.6
          drawStyle: line
          fillOpacity: 25
          gradientMode: opacity
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineInterpolation: smooth
          lineWidth: 2
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: never
          showValues: false
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: 'off'
        mappings: []
        min: 0
        thresholds:
          mode: absolute
          steps:
            - color: green
              value: 0
            - color: red
              value: 80
        unit: short
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: true
        expr: sum(kubevirt_vmi_migrations_in_running_phase{cluster=~"$cluster"})
        interval: ''
        legendFormat: Running
        range: true
        refId: A
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: true
        expr: sum(kubevirt_vmi_migrations_in_pending_phase{cluster=~"$cluster"})
        interval: ''
        legendFormat: Pending
        range: true
        refId: B
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        exemplar: true
        expr: sum(kubevirt_vmi_migrations_in_scheduling_phase{cluster=~"$cluster"})
        interval: ''
        legendFormat: Scheduling
        range: true
        refId: C
  - type: table
    title: Component Pod Restarts
    id: 18
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 12
      x: 12
      'y': 16
    options:
      cellHeight: sm
      footer:
        countRows: false
        fields: ''
        reducer:
          - sum
        show: false
      showHeader: true
      sortBy:
        - desc: true
          displayName: Restarts
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: true
          inspect: false
        mappings: []
        thresholds:
          mode: absolute
          steps:
            - color: green
              value: 0
            - color: '#EAB839'
              value: 1
            - color: red
              value: 5
      overrides:
        - matcher:
            id: byName
            options: Restarts
          properties:
            - id: custom.cellOptions
              value:
                type: color-background
                mode: basic
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
