        refId: A
  - type: stat
    title: Outdated VMIs
    description: VMIs still running an older virt-launcher image after a KubeVirt upgrade. Restart (or live-migrate) to pick up the current version.
    id: 23
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 3
