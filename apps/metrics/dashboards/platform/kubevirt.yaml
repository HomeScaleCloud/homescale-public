title: KubeVirt
uid: kubevirt
description: 'Cluster-level KubeVirt platform health -- virt-api/virt-controller/virt-operator/virt-handler component status, VM inventory and live migration activity. For per-VM CPU/memory/disk/network metrics see the Virtual Machines dashboard in the Views folder.'
tags:
  - Kubernetes
  - Prometheus
  - KubeVirt
editable: true
graphTooltip: 1
refresh: 30s
schemaVersion: 42
version: 1
time:
  from: now-1h
  to: now
timepicker: {}
fiscalYearStartMonth: 0
links: []
annotations:
  list:
    - builtIn: 1
      datasource:
        type: datasource
        uid: grafana
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      target:
        limit: 100
        matchAny: false
        tags: []
        type: dashboard
      type: dashboard
templating:
  list:
    - current: {}
      hide: 0
      includeAll: false
      multi: false
      name: datasource
      options: []
      query: prometheus
      refresh: 1
      regex: ''
      type: datasource
    - current: {}
      datasource:
        type: prometheus
        uid: ${datasource}
      definition: label_values(kube_node_info,cluster)
      hide: 0
      includeAll: true
      multi: false
      name: cluster
      options: []
      query:
        query: label_values(kube_node_info,cluster)
        refId: StandardVariableQuery
      refresh: 2
      regex: ''
      sort: 1
      type: query
panels:
  - type: row
    title: Alerts
    id: 1
    collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 0
    panels:
      - type: state-timeline
        title: Alert Timeline
        id: 2
        datasource:
          type: prometheus
          uid: ${datasource}
        gridPos:
          h: 8
          w: 24
          x: 0
          'y': 1
        options:
          alignValue: left
          legend:
            displayMode: list
            placement: bottom
            showLegend: true
          mergeValues: true
          rowHeight: 0.9
          showValue: auto
          tooltip:
            mode: single
            sort: none
        fieldConfig:
          defaults:
            color:
              mode: thresholds
            custom:
              fillOpacity: 70
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineWidth: 0
              spanNulls: false
            mappings:
              - type: value
                options:
                  '1':
                    color: yellow
                    index: 0
                    text: Warning / Pending
                  '2':
                    color: red
                    index: 1
                    text: Critical (Firing)
            thresholds:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
                - color: red
                  value: 2
          overrides: []
        targets:
          - datasource:
              type: prometheus
              uid: ${datasource}
            expr: max without (alertstate) ((ALERTS{cluster=~"$cluster", namespace=~"kubevirt|cdi", severity="critical", alertstate="firing"} * 2) or (ALERTS{cluster=~"$cluster", namespace=~"kubevirt|cdi", alertstate="pending"} * 1) or (ALERTS{cluster=~"$cluster", namespace=~"kubevirt|cdi", severity="warning"} * 1))
            legendFormat: '{{alertname}} [{{severity}}]'
            range: true
            instant: false
            refId: A
      - type: table
        title: Active Alerts
        id: 3
        datasource:
          type: prometheus
          uid: ${datasource}
        gridPos:
          h: 8
          w: 24
          x: 0
          'y': 9
        options:
          cellHeight: sm
          footer:
            countRows: false
            fields: ''
            reducer:
              - sum
            show: false
          showHeader: true
          sortBy:
            - desc: false
              displayName: alertname
        fieldConfig:
          defaults:
            custom:
              align: auto
              cellOptions:
                type: auto
              inspect: false
          overrides:
            - matcher:
                id: byName
                options: cluster
              properties:
                - id: custom.width
                  value: 140
            - matcher:
                id: byName
                options: alertname
              properties:
                - id: custom.width
                  value: 300
            - matcher:
                id: byName
                options: alertstate
              properties:
                - id: custom.width
                  value: 90
                - id: custom.cellOptions
                  value:
                    type: color-background
                    mode: basic
                - id: mappings
                  value:
                    - type: value
                      options:
                        firing:
                          color: red
                          index: 0
                          text: firing
                        pending:
                          color: yellow
                          index: 1
                          text: pending
            - matcher:
                id: byName
                options: severity
              properties:
                - id: custom.width
                  value: 100
                - id: custom.cellOptions
                  value:
                    type: color-background
                    mode: basic
                - id: mappings
                  value:
                    - type: value
                      options:
                        warning:
                          color: yellow
                          index: 0
                          text: warning
                        critical:
                          color: red
                          index: 1
                          text: critical
                        info:
                          color: blue
                          index: 2
                          text: info
        targets:
          - datasource:
              type: prometheus
              uid: ${datasource}
            expr: ALERTS{cluster=~"$cluster", alertstate=~"firing|pending", namespace=~"kubevirt|cdi"}
            instant: true
            format: table
            legendFormat: ''
            refId: A
        transformations:
          - id: organize
            options:
              excludeByName:
                Time: true
                Value: true
                __name__: true
                endpoint: true
                instance: true
                job: true
                prometheus: true
                prometheus_replica: true
                service: true
              indexByName:
                alertname: 0
                alertstate: 1
                severity: 2
                namespace: 3
                pod: 4
                cluster: 5
              renameByName: {}
  - type: row
    title: Logs
    id: 4
    collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 1
    panels:
      - type: logs
        title: KubeVirt Component Logs
        id: 5
        datasource:
          type: loki
          uid: loki
        gridPos:
          h: 12
          w: 24
          x: 0
          'y': 2
        options:
          dedupStrategy: none
          enableLogDetails: true
          prettifyLogMessage: false
          showCommonLabels: false
          showLabels: false
          showTime: true
          sortOrder: Descending
          wrapLogMessage: true
        targets:
          - datasource:
              type: loki
              uid: loki
            editorMode: code
            expr: '{cluster=~"$cluster", namespace=~"kubevirt|cdi"}'
            queryType: range
            refId: A
  - type: row
    title: Overview
    id: 6
    collapsed: false
    gridPos:
      h: 1
      w: 24
      x: 0
      'y': 2
    panels: []
  - type: stat
    title: virt-api
    id: 7
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 3
      x: 0
      'y': 3
    options:
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      percentChangeColorMode: standard
      showPercentChange: false
      textMode: auto
      wideLayout: true
    fieldConfig:
      defaults:
        unit: short
        mappings:
          - type: value
            options:
              '0':
                text: DOWN
                color: red
        thresholds:
          mode: absolute
          steps:
            - color: red
              value: null
            - color: green
              value: 1
        color:
          mode: thresholds
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        expr: sum(up{cluster=~"$cluster", namespace="kubevirt", pod=~"virt-api-.*"})
        instant: true
        legendFormat: ''
        refId: A
  - type: stat
    title: virt-controller
    id: 8
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
