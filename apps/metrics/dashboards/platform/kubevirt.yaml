        refId: A
  - type: stat
    title: virt-handler Node Coverage
    description: virt-handler DaemonSet targets reporting up, as a fraction of cluster nodes. Should be 100%.
    id: 10
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 4
      w: 3
      x: 9
      'y': 3
    options:
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      percentChangeColorMode: standard
      showPercentChange: false
      textMode: auto
      wideLayout: true
    fieldConfig:
      defaults:
        unit: percentunit
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - color: red
              value: null
            - color: green
              value: 1
        color:
          mode: thresholds
      overrides: []
    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        expr: sum(up{cluster=~"$cluster", namespace="kubevirt", pod=~"virt-handler-.*"}) / count(kube_node_info{cluster=~"$cluster"})
        instant: true
        legendFormat: ''
        refId: A
  - type: stat
