    pluginVersion: 12.2.1
    targets:
      - datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        expr: sum(up{cluster=~"$cluster", namespace="kubevirt", pod=~"virt-controller-.*"})
