          uid: ${datasource}
        editorMode: code
        expr: sum(kubevirt_vmi_number_of_outdated{cluster=~"$cluster"})
        instant: true
        legendFormat: ''
        refId: A
  - type: piechart
    title: VMs by Phase
    id: 13
    datasource:
      type: prometheus
      uid: ${datasource}
    gridPos:
      h: 8
      w: 6
      x: 0
      'y': 7
    options:
      legend:
        displayMode: list
        placement: bottom
        showLegend: true
        values:
          - value
      pieType: donut
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      tooltip:
        hideZeros: false
        mode: single
        sort: none
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        mappings: []
        unit: short
      overrides:
        - matcher:
            id: byName
            options: running
          properties:
            - id: color
              value:
                fixedColor: green
                mode: fixed
        - matcher:
            id: byName
            options: failed
          properties:
            - id: color
              value:
                fixedColor: red
                mode: fixed
    pluginVersion: 12.2.1
    targets:
