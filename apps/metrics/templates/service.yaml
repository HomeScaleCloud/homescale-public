# Single-port, non-headless target for Headlamp's prometheus plugin:
# prometheus-operated (headless) and the multi-port operator Service both
# fail k8s's services/proxy subresource.
#
# operator.prometheus.io/name is pinned because app.kubernetes.io/name: prometheus
# alone also matches apps/metrics-aggr's separate Prometheus StatefulSet in
# this namespace, which would load-balance across both nondeterministically.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-proxy
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "prometheus-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "prometheus-proxy.metrics.{{ .Values.cluster.name }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 9090
      protocol: TCP
      targetPort: http-web
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: metrics-kube-prometheus-st-prometheus
---
{{- if eq .Values.cluster.name "boa1-prod" }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "grafana-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 443
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "alertmanager-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 80
      protocol: TCP
      targetPort: http-web
  selector:
    app.kubernetes.io/name: alertmanager
{{- end }}
