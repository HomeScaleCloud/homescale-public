# prometheus-operated (the operator's own headless Service) and
# metrics-kube-prometheus-st-prometheus (multi-port: http-web + reloader-web)
# both fail k8s's services/proxy subresource -- headless Services aren't
# proxied by the platform at all, and unqualified proxy requests to a
# multi-port Service can't be disambiguated (kubernetes/kubernetes#20070).
# This gives Headlamp's prometheus plugin a single-port, non-headless
# target that actually works.
#
# The selector needs operator.prometheus.io/name pinned too: app.kubernetes.io/name:
# prometheus alone also matches apps/metrics-aggr's separate "aggregator" Prometheus
# StatefulSet in this same namespace, which would make this Service load-balance
# across both instances nondeterministically (that one only scrapes what's
# remote-written to it, no ServiceMonitor discovery of its own -- see its own
# same-purpose disambiguation in apps/metrics-aggr/templates/service.yaml).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-proxy
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "prometheus-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 9090
      protocol: TCP
      targetPort: http-web
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: metrics-kube-prometheus-st-prometheus
---
{{- if eq .Values.cluster.name "boa1-prod" }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "grafana-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 443
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: metrics
  annotations:
    tailscale.com/tags: "tag:app-metrics,tag:cluster-{{ .Values.cluster.name }}"
    tailscale.com/hostname: "alertmanager-metrics-{{ .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.alpha.kubernetes.io/hostname: "REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-web
      port: 80
      protocol: TCP
      targetPort: http-web
  selector:
    app.kubernetes.io/name: alertmanager
{{- end }}
