{{- if eq .Values.env.name "production" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: metrics-tls
  namespace: metrics
spec:
  secretName: metrics-tls
  issuerRef:
    name: {{ .Values.certIssuer | default "letsencrypt" }}
    kind: ClusterIssuer
{{- $homescale := default (dict) .Values.homescale }}
{{- $shortName := required "env.shortName is required" .Values.env.shortName }}
{{- $staticNames := list (printf "metrics-grafana.metrics.%REDACTED" $shortName) "REDACTED" }}
{{- $dnsNames := concat (default (list) $homescale.exposePublicFqdns) $staticNames | uniq }}
  dnsNames:
{{- range $dnsNames }}
    - {{ . }}
{{- end }}
{{- end }}
