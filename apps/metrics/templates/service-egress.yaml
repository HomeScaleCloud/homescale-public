{{- $tailnet := .Values.tailscale.tailnet }}
{{- $env := required "env.name is required" .Values.env.name }}
{{- $shortEnv := required "env.shortName is required" .Values.env.shortName }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-{{ $env }}-egress
  namespace: metrics
  annotations:
    tailscale.com/tailnet-fqdn: "prometheus-metrics-prod-aggr.{{ $tailnet }}"
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:env-{{ $env }}"
    tailscale.com/hostname: "metrics-{{ $shortEnv }}-egress"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-{{ $env }}-egress-loki
  namespace: metrics
  annotations:
    tailscale.com/tailnet-fqdn: "loki-metrics-prod.{{ $tailnet }}"
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:env-{{ $env }}"
    tailscale.com/hostname: "metrics-{{ $shortEnv }}-egress-loki"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - port: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-{{ $env }}-egress-alertmanager
  namespace: metrics
  annotations:
    tailscale.com/tailnet-fqdn: "alertmanager-metrics-prod.{{ $tailnet }}"
    tailscale.com/tags: "tag:k8s,tag:app-metrics,tag:env-{{ $env }}"
    tailscale.com/hostname: "metrics-{{ $shortEnv }}-egress-alertmanager"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - port: 80
