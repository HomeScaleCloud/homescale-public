{{- if eq .Values.cluster.name "boa1-prod" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tailscale-operator-rules
  namespace: metrics
spec:
  groups:
    - name: tailscale-operator.rules
      rules:
        - alert: TailscaleOperatorDown
          annotations:
            summary: "Tailscale operator on cluster {{ "{{" }}$labels.cluster{{ "}}" }} has no available replicas."
            description: "The Tailscale operator Deployment on cluster {{ "{{" }}$labels.cluster{{ "}}" }} has had zero available replicas for 5 minutes. ProxyGroup/ProxyClass objects on this cluster will stop reconciling — Tailscale mesh exposure and DNS registration for this cluster may drift from the desired state."
            runbook_url: "https://REDACTED/runbooks/tailscale-operator-down/"
            dashboard_url: "https://REDACTED/d/tailscale-operator"
          expr: kube_deployment_status_replicas_available{namespace="tailscale", deployment="operator"} == 0
          for: 5m
          labels:
            severity: critical

        - alert: TailscaleProxyGroupNotReady
          annotations:
            summary: "ProxyGroup {{ "{{" }}$labels.name{{ "}}" }} is not Ready."
            description: "ProxyGroup {{ "{{" }}$labels.name{{ "}}" }} on cluster {{ "{{" }}$labels.cluster{{ "}}" }} has not reported a ProxyGroupReady condition for 10 minutes (reason: {{ "{{" }}$labels.reason{{ "}}" }}). Services annotated to use this ProxyGroup may not be reachable over the tailnet."
            runbook_url: "https://REDACTED/runbooks/tailscale-proxygroup-not-ready/"
            dashboard_url: "https://REDACTED/d/tailscale-operator"
          expr: kube_customresource_tailscale_proxygroup_status_condition{condition="ProxyGroupReady"} == 0
          for: 10m
          labels:
            severity: critical

        - alert: TailscaleProxyClassNotReady
          annotations:
            summary: "ProxyClass {{ "{{" }}$labels.name{{ "}}" }} is not Ready."
            description: "ProxyClass {{ "{{" }}$labels.name{{ "}}" }} on cluster {{ "{{" }}$labels.cluster{{ "}}" }} has not reported a ProxyClassReady condition for 15 minutes (reason: {{ "{{" }}$labels.reason{{ "}}" }}). Proxies referencing this ProxyClass may not pick up its configuration (e.g. metrics)."
            runbook_url: "https://REDACTED/runbooks/tailscale-proxyclass-not-ready/"
            dashboard_url: "https://REDACTED/d/tailscale-operator"
          expr: kube_customresource_tailscale_proxyclass_status_condition{condition="ProxyClassReady"} == 0
          for: 15m
          labels:
            severity: warning
{{- end }}
