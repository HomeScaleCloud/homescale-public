apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-apiserver-proxy-tls
  namespace: netbird
spec:
  secretName: kube-apiserver-proxy-tls
  issuerRef:
    name: {{ .Values.certIssuer | default "letsencrypt" }}
    kind: ClusterIssuer
  dnsNames:
    - k8s.api.{{ required "cluster.name is required" .Values.cluster.name }}REDACTED
