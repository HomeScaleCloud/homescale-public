# TLS-terminating reverse proxy in front of the real kube-apiserver:
# presents a trusted LetsEncrypt cert (certificate-apiserver-proxy.yaml) to
# mesh clients, forwards to kubernetes.default.svc.cluster.local — the same
# in-cluster address every pod already uses, which Kubernetes itself already
# load-balances across all control-plane replicas, so there's no single-node
# fragility. Whatever auth the client presents (e.g. an OIDC bearer token)
# passes straight through in the Authorization header; the real apiserver
# still does the actual authn/authz.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-apiserver-proxy-nginx
  namespace: netbird
data:
  nginx.conf: |
    events {}
    http {
      # exec/attach/port-forward upgrade the connection (SPDY/WebSocket);
      # everything else is plain HTTP/1.1 REST or a long-lived watch.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 443 ssl;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;

        location / {
          proxy_pass https://kubernetes.default.svc.cluster.local;

          # Verify the real apiserver's cert using the cluster's own root
          # CA (auto-injected into every namespace as kube-root-ca.crt) —
          # real end-to-end TLS verification, not proxy_ssl_verify off.
          proxy_ssl_trusted_certificate /ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_name kubernetes.default.svc.cluster.local;
          proxy_ssl_server_name on;

          proxy_http_version 1.1;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Upgrade $http_upgrade;

          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
        }
      }
    }
