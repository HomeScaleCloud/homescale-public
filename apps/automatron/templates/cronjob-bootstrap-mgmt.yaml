apiVersion: batch/v1
kind: CronJob
metadata:
  name: automatron-bootstrap-mgmt
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.automatron.schedule | quote }}
  # No automatic trigger at all (mgmt changes rarely) — this CronJob exists purely
  # so `hsctl run bootstrap-mgmt -e remote` has a jobTemplate to clone.
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- include "automatron.podTemplate" (dict "root" $ "playbook" "bootstrap-mgmt") | nindent 8 }}
