apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automatron-read-services
  namespace: omni
rules:
  - apiGroups: [""]
    resources:
      - services
    resourceNames:
      - api
      - k8s
    verbs: ["get"]
---
# Grants automatron's own ServiceAccount the ability to hold a Lease-based lock — atomic
# `kubectl create` acquire, `kubectl delete` release (see apps/automatron/entrypoint.sh,
# gated per-JobTemplate by spec.locking: serializing scheduled and ad hoc runs of the same
# template so they queue instead of racing). Generic (any lease name in this namespace),
# not tied to any one JobTemplate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automatron-lock
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["create", "get", "list", "delete"]
