apiVersion: batch/v1
kind: CronJob
metadata:
  name: automatron-bootstrap-cluster
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.automatron.schedule | quote }}
  # Never auto-fires — omni-sync chains a Job cloned from this jobTemplate on every
  # successful run (see CHAIN_NEXT_CRONJOB in _pod.tpl / entrypoint.sh), so clusters
  # always exist in Omni before bootstrap-cluster runs against them. This CronJob
  # object still exists (suspended, not deleted) purely so `hsctl run bootstrap-cluster
  # -e remote` has a jobTemplate to clone for ad-hoc/manual runs.
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- include "automatron.podTemplate" (dict "root" $ "playbook" "bootstrap-cluster") | nindent 8 }}
