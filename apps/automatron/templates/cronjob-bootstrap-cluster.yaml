apiVersion: batch/v1
kind: CronJob
metadata:
  name: automatron-bootstrap-cluster
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.automatron.schedule | quote }}
  # Never auto-fires — omni-sync chains a Job cloned from this jobTemplate instead.
  # Kept suspended (not deleted) so `hsctl run bootstrap-cluster -e remote` has a
  # jobTemplate to clone for ad-hoc runs.
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- include "automatron.podTemplate" (dict "root" $ "playbook" "bootstrap-cluster") | nindent 8 }}
