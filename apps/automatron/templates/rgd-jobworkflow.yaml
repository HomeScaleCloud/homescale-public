# Defines the AutomatronJobWorkflow CRD (REDACTED/v1alpha1, kind
# JobWorkflow): an ordered list of JobTemplate refs to run in sequence. This is the
# *template* — see rgd-jobworkflowrun.yaml for the object that tracks one execution of it.
#
# When scheduled, kro creates a CronJob whose Job is a lightweight "kickoff": it creates a
# JobWorkflowRun (one per firing — kro's own resource graph is static per JobWorkflow
# instance, so it can't create a new object per cron firing itself) plus a JobRun for step
# 0, and exits. Steps 1..N are chained by apps/automatron/entrypoint.sh on success (kro's
# forEach/collections can't express "step N waits for step N-1" — see CLAUDE.md), the same
# way `hsctl run <workflow> -e remote` kicks off an ad hoc run.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: automatron-jobworkflow
  namespace: {{ .Release.Namespace }}
spec:
  schema:
    apiVersion: v1alpha1
    kind: JobWorkflow
    group: REDACTED
    scope: Cluster
    types:
      Step:
        templateRef: string
        cluster: string | default=""
        dryRun: boolean | default=false
    spec:
      schedule: string | default=""
      steps: "[]Step"
    status:
      cronJobName: '${cronJob.?metadata.name}'
      # Every JobWorkflowRun labeled as belonging to this workflow — a pointer index, not
      # full detail (see JobWorkflowRun for per-run/per-step status). Ordering/limiting to
      # "most recent N" is left to the reader, e.g.
      # `kubectl get jobworkflowrun -l REDACTED/workflow=<name> --sort-by=.metadata.creationTimestamp`.
      recentRunNames: '${runs.map(r, r.metadata.name)}'
  resources:
    - id: runs
      externalRef:
        apiVersion: REDACTED/v1alpha1
        kind: JobWorkflowRun
        metadata:
          selector:
            matchLabels:
              REDACTED/workflow: '${schema.metadata.name}'
    - id: cronJob
      includeWhen:
        - '${schema.spec.schedule != "" && schema.spec.steps.size() > 0}'
      template:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: 'automatron-${schema.metadata.name}'
          namespace: {{ .Release.Namespace }}
        spec:
          schedule: '${schema.spec.schedule}'
          concurrencyPolicy: Forbid
          jobTemplate:
            spec:
              backoffLimit: 0
              template:
                metadata:
                  labels:
                    app: automatron
                spec:
                  serviceAccountName: automatron
                  restartPolicy: Never
                  containers:
                    - name: kickoff
                      image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                      command: ["sh", "-c"]
                      # Builds manifests with `jq -n` rather than heredocs — a heredoc's
                      # closing delimiter must sit at column 0 (or be tab-indented with
                      # <<-), which a shell script embedded in a YAML block scalar inside
                      # a Helm template can't reliably guarantee.
                      args:
                        - |
                          set -e
                          run_name="${WORKFLOW_NAME}-run-$(date +%s)"
                          step0=$(kubectl get jobworkflow "$WORKFLOW_NAME" -o json | jq -c '.spec.steps[0]')
                          jq -n --arg name "$run_name" --arg wf "$WORKFLOW_NAME" '
                            {apiVersion: "REDACTED/v1alpha1", kind: "JobWorkflowRun",
                             metadata: {name: $name, labels: {"REDACTED/workflow": $wf}},
                             spec: {workflowRef: $wf}}' | kubectl apply -f -
                          echo "$step0" | jq --arg name "${run_name}-step0" --arg wf "$WORKFLOW_NAME" --arg run "$run_name" '
                            {apiVersion: "REDACTED/v1alpha1", kind: "JobRun",
                             metadata: {name: $name, labels: {"REDACTED/workflow": $wf, "REDACTED/workflow-run": $run}},
                             spec: {templateRef: .templateRef, cluster: (.cluster // ""), dryRun: (.dryRun // false),
                                    workflowRef: $wf, workflowRunRef: $run, workflowStepIndex: 0}}' | kubectl apply -f -
                      env:
                        - name: WORKFLOW_NAME
                          value: '${schema.metadata.name}'
