# Defines the AutomatronJobTemplate CRD (REDACTED/v1alpha1, kind
# JobTemplate): a playbook or script Automatron can run, optionally on a schedule.
# Exactly one of spec.playbook / spec.scriptPath should be set — entrypoint.sh decides
# which to run based on which one is non-empty (see apps/automatron/entrypoint.sh).
#
# When spec.schedule is set, kro creates a CronJob that runs it directly. When it's
# omitted, this is a template-only instance — the only way to run it is via a JobRun (see
# rgd-jobrun.yaml), either committed under infra/automatron/job-runs/ or created ad hoc
# by `hsctl run <name> -e remote`. To run several JobTemplates in sequence, see
# rgd-jobworkflow.yaml's JobWorkflow instead — that's the only place chaining lives.
#
# spec.defaultArgs is a free-form map of extra-vars/script arguments (e.g. {cluster:
# boa1-prod}) — see rgd-jobrun.yaml for how a JobRun's own spec.args merges over this via
# kro's map.merge() CEL function, and CLAUDE.md's Automatron section for the full
# precedence rule (a JobWorkflow step's own args always win, else an ad hoc `hsctl run
# --arg`/`--cluster` flag, else this default).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: automatron-jobtemplate
  namespace: {{ .Release.Namespace }}
spec:
  schema:
    apiVersion: v1alpha1
    kind: JobTemplate
    group: REDACTED
    scope: Cluster
    additionalPrinterColumns:
      - name: Playbook
        type: string
        jsonPath: .spec.playbook
      - name: Script
        type: string
        jsonPath: .spec.scriptPath
      - name: Schedule
        type: string
        jsonPath: .spec.schedule
      - name: CronJob
        type: string
        jsonPath: .status.cronJobName
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
    spec:
      playbook: string | default=""
      scriptPath: string | default=""
      scriptInterpreter: string | default="bash"
      schedule: string | default=""
      defaultArgs: "map[string]string"
    status:
      cronJobName: '${cronJob.?metadata.name}'
  resources:
    - id: cronJob
      includeWhen:
        - '${schema.spec.schedule != ""}'
      template:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: 'automatron-${schema.metadata.name}'
          namespace: {{ .Release.Namespace }}
        spec:
          schedule: '${schema.spec.schedule}'
          concurrencyPolicy: Forbid
          jobTemplate:
            metadata:
              labels:
                app: automatron
                REDACTED/template: '${schema.metadata.name}'
                REDACTED/job-owner: schedule
            spec:
              backoffLimit: 0
              ttlSecondsAfterFinished: {{ .Values.automatron.jobTtlSeconds }}
              template:
                metadata:
                  labels:
                    app: automatron
                    REDACTED/template: '${schema.metadata.name}'
                    REDACTED/job-owner: schedule
                spec:
                  serviceAccountName: automatron
                  restartPolicy: Never
                  volumes:
                    - name: repo
                      emptyDir: {}
                    - name: hosts
                      emptyDir: {}
                    - name: git-ssh-key
                      secret:
                        secretName: automatron-secrets
                        items:
                          - key: GIT_DEPLOY_KEY
                            path: sshPrivateKey
                            mode: 0600
                    - name: git-ssh-key-fixed
                      emptyDir: {}
                  initContainers:
                    - name: omni-hosts
                      image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                      command: ["sh", "-c"]
                      args:
                        - |
                          set -e
                          cp /etc/hosts /shared/hosts
                          echo "$(kubectl get svc api -n omni -o jsonpath='{.spec.clusterIP}') REDACTED" >> /shared/hosts
                          echo "$(kubectl get svc k8s -n omni -o jsonpath='{.spec.clusterIP}') REDACTED" >> /shared/hosts
                      volumeMounts:
                        - name: hosts
                          mountPath: /shared
                    - name: git-key-prep
                      image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                      securityContext:
                        runAsUser: 0
                      command: ["/git-key-prep.sh"]
                      volumeMounts:
                        - name: git-ssh-key
                          mountPath: /etc/git-secret
                          readOnly: true
                        - name: git-ssh-key-fixed
                          mountPath: /fixed
                    - name: git-clone
                      image: registry.k8s.io/git-sync/git-sync:v4.7.1
                      args:
                        - --repo=git@github.com:HomeScaleCloud/homescale.git
                        - --ref=main
                        - --root=/repo
                        - --link=current
                        - --one-time
                        - --ssh
                        - --ssh-known-hosts=false
                      env:
                        - name: GITSYNC_SSH_KEY_FILE
                          value: /etc/git-secret/sshPrivateKey
                      volumeMounts:
                        - name: repo
                          mountPath: /repo
                        - name: git-ssh-key-fixed
                          mountPath: /etc/git-secret
                          readOnly: true
                  containers:
                    - name: automatron
                      image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                      env:
                        - name: PLAYBOOK
                          value: '${schema.spec.playbook}'
                        - name: SCRIPT_PATH
                          value: '${schema.spec.scriptPath}'
                        - name: SCRIPT_INTERPRETER
                          value: '${schema.spec.scriptInterpreter}'
                        - name: ARGS_JSON
                          value: '${json.marshal(schema.spec.?defaultArgs.orValue({}))}'
                        - name: DRY_RUN
                          value: "false"
                        - name: REPO_DIR
                          value: /repo/current
                      envFrom:
                        - secretRef:
                            name: automatron-secrets
                        - secretRef:
                            name: automatron-infisical-operator-creds
                      volumeMounts:
                        - name: repo
                          mountPath: /repo
                          readOnly: true
                        - name: hosts
                          mountPath: /etc/hosts
                          subPath: hosts
