# Defines the AutomatronJobRun CRD (REDACTED/v1alpha1, kind JobRun):
# a one-off instance of a JobTemplate. This is the *only* place a one-off Job gets
# created from a JobTemplate — a human commits one under infra/automatron/job-runs/,
# `hsctl run <template> -e remote` creates one ad hoc, or it's one step of a
# JobWorkflowRun (see rgd-jobworkflowrun.yaml/rgd-jobworkflow.yaml).
#
# workflowRunRef/stepIndex/jobOwner are not user-facing — set only by whatever creates
# this JobRun as part of a workflow run (JobWorkflow's kickoff container for step 0 of a
# scheduled run, hsctl for step 0 of an ad hoc run, or entrypoint.sh for every step after
# the first), so this JobRun's Job carries enough context to continue the chain on
# success, is found by its JobWorkflowRun's status aggregation via the workflow-run
# label, and keeps a consistent owner across every hop of one chain. jobOwner is either
# the identity hsctl ran as (sanitized for use in a name/label — see hsctl.d/run.sh),
# "schedule" for a cron-triggered run, or "ci" for deploy.yaml's CI-triggered
# sync — never re-derived once a chain has started, just threaded through.
#
# gitRef (default "main") overrides the git-clone initContainer's checked-out ref — the
# one legitimate reason to ever set it is deploy.yaml's PR-time plan, which needs to see
# the PR's own branch content, not main's; every other caller (hsctl, the JobWorkflow
# kickoff container, entrypoint.sh's chain continuation) leaves it at the default so
# scheduled/production runs always reflect what's actually merged.
#
# spec.args is a free-form map of extra-vars/script arguments — merged over the
# referenced JobTemplate's own spec.defaultArgs via kro's map.merge() CEL function (this
# JobRun's own keys win on overlap), so a hand-committed JobRun only needs to set the
# args it actually wants to override.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: automatron-jobrun
  namespace: {{ .Release.Namespace }}
spec:
  schema:
    apiVersion: v1alpha1
    kind: JobRun
    group: REDACTED
    scope: Cluster
    additionalPrinterColumns:
      - name: Template
        type: string
        jsonPath: .spec.templateRef
      - name: WorkflowRun
        type: string
        jsonPath: .spec.workflowRunRef
      - name: Owner
        type: string
        jsonPath: .spec.jobOwner
      - name: Pod
        type: string
        jsonPath: .status.podName
      - name: Phase
        type: string
        jsonPath: .status.phase
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
    spec:
      templateRef: string
      args: "map[string]string"
      dryRun: boolean | default=false
      workflowRunRef: string | default=""
      stepIndex: integer | default=-1
      jobOwner: string | default=""
      gitRef: string | default="main"
    status:
      # jobName is internal (hsctl polls the native Job for succeeded/failed counts, which
      # only exist at Job level, not Pod level) — deliberately not a printer column. podName
      # is what a human actually wants (`kubectl logs <pod>`), so that's what's shown instead.
      jobName: '${job.?metadata.name.orValue("")}'
      podName: '${pods.size() > 0 ? pods[0].metadata.name : ""}'
      phase: '${job.?status.succeeded.orValue(0) == 1 ? "Succeeded" : (job.?status.failed.orValue(0) > 0 ? "Failed" : (job.?status.active.orValue(0) > 0 ? "Running" : "Pending"))}'
  resources:
    # Dynamic name lookup (CEL over schema.spec) — see CLAUDE.md's Automatron section
    # for the fallback if this doesn't resolve: JobRun carrying its own playbook/script
    # fields instead of inheriting them from the referenced JobTemplate.
    - id: template
      externalRef:
        apiVersion: REDACTED/v1alpha1
        kind: JobTemplate
        metadata:
          name: '${schema.spec.templateRef}'
    # Selector-based externalRef collection onto this Job's own Pod (backoffLimit: 0 means
    # there's ever at most one) — batch.kubernetes.io/job-name is set automatically by the
    # Job controller, not one of our own labels. Resolves to an empty list before the Job
    # controller creates the Pod, hence the size() check in status.podName above.
    - id: pods
      externalRef:
        apiVersion: v1
        kind: Pod
        metadata:
          namespace: {{ .Release.Namespace }}
          selector:
            matchLabels:
              batch.kubernetes.io/job-name: '${schema.metadata.name}'
    - id: job
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: '${schema.metadata.name}'
          namespace: {{ .Release.Namespace }}
          labels:
            app: automatron
            REDACTED/template: '${schema.spec.templateRef}'
            REDACTED/workflow-run: '${schema.spec.workflowRunRef}'
            REDACTED/job-owner: '${schema.spec.jobOwner}'
        spec:
          backoffLimit: 0
          ttlSecondsAfterFinished: {{ .Values.automatron.jobTtlSeconds }}
          template:
            metadata:
              labels:
                app: automatron
                REDACTED/template: '${schema.spec.templateRef}'
                REDACTED/workflow-run: '${schema.spec.workflowRunRef}'
                REDACTED/job-owner: '${schema.spec.jobOwner}'
            spec:
              serviceAccountName: automatron
              restartPolicy: Never
              volumes:
                - name: repo
                  emptyDir: {}
                - name: hosts
                  emptyDir: {}
                - name: git-ssh-key
                  secret:
                    secretName: automatron-secrets
                    items:
                      - key: GIT_DEPLOY_KEY
                        path: sshPrivateKey
                        mode: 0600
                - name: git-ssh-key-fixed
                  emptyDir: {}
              initContainers:
                - name: omni-hosts
                  image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -e
                      cp /etc/hosts /shared/hosts
                      echo "$(kubectl get svc api -n omni -o jsonpath='{.spec.clusterIP}') REDACTED" >> /shared/hosts
                      echo "$(kubectl get svc k8s -n omni -o jsonpath='{.spec.clusterIP}') REDACTED" >> /shared/hosts
                  volumeMounts:
                    - name: hosts
                      mountPath: /shared
                - name: git-key-prep
                  image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                  securityContext:
                    runAsUser: 0
                  command: ["/git-key-prep.sh"]
                  volumeMounts:
                    - name: git-ssh-key
                      mountPath: /etc/git-secret
                      readOnly: true
                    - name: git-ssh-key-fixed
                      mountPath: /fixed
                - name: git-clone
                  image: registry.k8s.io/git-sync/git-sync:v4.7.1
                  args:
                    - --repo=git@github.com:HomeScaleCloud/homescale.git
                    - '--ref=${schema.spec.gitRef}'
                    - --root=/repo
                    - --link=current
                    - --one-time
                    - --ssh
                    - --ssh-known-hosts=false
                  env:
                    - name: GITSYNC_SSH_KEY_FILE
                      value: /etc/git-secret/sshPrivateKey
                  volumeMounts:
                    - name: repo
                      mountPath: /repo
                    - name: git-ssh-key-fixed
                      mountPath: /etc/git-secret
                      readOnly: true
              containers:
                - name: automatron
                  image: "{{ .Values.automatron.image.repository }}:{{ .Values.automatron.image.tag }}"
                  env:
                    - name: PLAYBOOK
                      value: '${template.spec.playbook}'
                    - name: SCRIPT_PATH
                      value: '${template.spec.scriptPath}'
                    - name: SCRIPT_INTERPRETER
                      value: '${template.spec.scriptInterpreter}'
                    - name: ARGS_JSON
                      value: '${json.marshal(template.spec.?defaultArgs.orValue({}).merge(schema.spec.?args.orValue({})))}'
                    - name: DRY_RUN
                      value: '${string(schema.spec.dryRun)}'
                    - name: REPO_DIR
                      value: /repo/current
                    - name: WORKFLOW_RUN_NAME
                      value: '${schema.spec.workflowRunRef}'
                    - name: STEP_INDEX
                      value: '${string(schema.spec.stepIndex)}'
                    - name: JOB_OWNER
                      value: '${schema.spec.jobOwner}'
                    - name: GIT_REF
                      value: '${schema.spec.gitRef}'
                  envFrom:
                    - secretRef:
                        name: automatron-secrets
                    - secretRef:
                        name: automatron-infisical-operator-creds
                  volumeMounts:
                    - name: repo
                      mountPath: /repo
                      readOnly: true
                    - name: hosts
                      mountPath: /etc/hosts
                      subPath: hosts
