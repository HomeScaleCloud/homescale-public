path: apps/headlamp
namespace: headlamp
releaseName: headlamp
syncWave: 0
defaultDeploy: false
podSecurity: privileged
exposePublic:
  - cluster: mgmt
    fqdn: REDACTED
    port: 443
    tls: true
    cacheBypass: true
    access: {}
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  headlamp:
    replicaCount: 1
    deploymentAnnotations:
      secrets.infisical.com/auto-reload: "true"
    initContainers:
      - name: tailscale
        image: tailscale/tailscale:v1.102.2
        restartPolicy: Always
        env:
          - name: TS_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: headlamp-tailscale-oauth  # pragma: allowlist secret
                key: client_id
          - name: TS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: headlamp-tailscale-oauth  # pragma: allowlist secret
                key: client_secret
          - name: TS_USERSPACE
            value: "false"
          - name: TS_KUBE_SECRET
            value: ""
          - name: TS_STATE_DIR
            value: /var/lib/tailscale
          - name: TS_HOSTNAME
            value: "headlamp-{{ .Values.cluster.name }}-apiserver-egress"
          - name: TS_EXTRA_ARGS
            value: "--advertise-tags=tag:k8s,tag:app-headlamp,tag:cluster-{{ .Values.cluster.name }}"
          - name: TS_ACCEPT_DNS
            value: "false"
          - name: TS_AUTH_ONCE
            value: "true"
          - name: TS_ENABLE_HEALTH_CHECK
            value: "true"
        startupProbe:
          httpGet:
            path: /healthz
            port: 9002
          periodSeconds: 3
          failureThreshold: 40
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        volumeMounts:
          - name: tailscale-state
            mountPath: /var/lib/tailscale
    service:
      port: 443
    config:
      inClusterContextName: "{{ .Values.cluster.name }}"
      tlsCertPath: /headlamp-tls/tls.crt
      tlsKeyPath: /headlamp-tls/tls.key
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: oidc
          hasScopes: true
      watchPlugins: true
      extraArgs:
        - "-default-light-theme=homescale"
        - "-default-dark-theme=homescale-dark"
    probes:
      scheme: HTTPS
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: 0.3.1
    # homescale-theme-plugin and homescale-favicon are mounted via subPath,
    # which Kubernetes never hot-reloads — kubelet only re-syncs
    # whole-directory ConfigMap mounts. These checksums (computed from the
    # actual file contents via the apps/ chart's .Files access into this
    # app dir) change automatically whenever the plugin bundle or favicon
    # assets change, forcing a pod restart without a manual version bump.
    podAnnotations:
      homescale-theme-plugin-checksum: "{{ printf \"%s%s\" ($.Files.Get \"headlamp/plugins/homescale-theme/dist/main.js\") ($.Files.Get \"headlamp/plugins/homescale-theme/package.json\") | sha256sum }}"
      homescale-favicon-checksum: "{{ printf \"%s%s%s%s\" ($.Files.Get \"headlamp/assets/favicon/favicon.ico\") ($.Files.Get \"headlamp/assets/favicon/favicon.ico.br\") ($.Files.Get \"headlamp/assets/favicon/favicon-16x16.png\") ($.Files.Get \"headlamp/assets/favicon/favicon-32x32.png\") | sha256sum }}"
    volumes:
      - name: headlamp-tls
        secret:
          secretName: headlamp-tls
      - name: homescale-theme-plugin
        configMap:
          name: headlamp-homescale-theme-plugin
      - name: homescale-favicon
        configMap:
          name: headlamp-favicon
      - name: headlamp-multicluster
        secret:
          secretName: headlamp-multicluster-kubeconfig # pragma: allowlist secret
      - name: tailscale-state
        emptyDir: {}
    volumeMounts:
      - name: headlamp-tls
        mountPath: /headlamp-tls
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/main.js
        subPath: main.js
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/package.json
        subPath: package.json
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon.ico
        subPath: favicon.ico
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon.ico.br
        subPath: favicon.ico.br
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon-16x16.png
        subPath: favicon-16x16.png
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon-32x32.png
        subPath: favicon-32x32.png
        readOnly: true
      - name: headlamp-multicluster
        mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
        readOnly: true
ignoreDifferences:
  - group: ""
    kind: Service
    jsonPointers:
      - /spec/externalName
