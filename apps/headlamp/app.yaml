path: apps/headlamp
namespace: headlamp
releaseName: headlamp
syncWave: 0
defaultDeploy: false
podSecurity: privileged
exposePublic:
  - cluster: mgmt
    fqdn: REDACTED
    port: 443
    tls: true
    cacheBypass: true
    access: {}
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  headlamp:
    replicaCount: 1
    deploymentAnnotations:
      secrets.infisical.com/auto-reload: "true"
    service:
      port: 443
    config:
      inClusterContextName: "{{ .Values.cluster.name }}"
      tlsCertPath: /headlamp-tls/tls.crt
      tlsKeyPath: /headlamp-tls/tls.key
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: oidc
          hasScopes: true
      watchPlugins: true
      extraArgs:
        - "-default-light-theme=homescale"
        - "-default-dark-theme=homescale-dark"
    probes:
      scheme: HTTPS
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: 0.2.2
    # homescale-theme-plugin and homescale-favicon are mounted via subPath,
    # which Kubernetes never hot-reloads — kubelet only re-syncs
    # whole-directory ConfigMap mounts. These checksums (computed from the
    # actual file contents via the apps/ chart's .Files access into this
    # app dir) change automatically whenever the plugin bundle or favicon
    # assets change, forcing a pod restart without a manual version bump.
    podAnnotations:
      homescale-theme-plugin-checksum: "{{ printf \"%s%s\" ($.Files.Get \"headlamp/plugins/homescale-theme/dist/main.js\") ($.Files.Get \"headlamp/plugins/homescale-theme/package.json\") | sha256sum }}"
      homescale-favicon-checksum: "{{ printf \"%s%s%s\" ($.Files.Get \"headlamp/assets/favicon/favicon.ico\") ($.Files.Get \"headlamp/assets/favicon/favicon-16x16.png\") ($.Files.Get \"headlamp/assets/favicon/favicon-32x32.png\") | sha256sum }}"
    initContainers:
      - name: nb-client
        image: "ghcr.io/netbirdio/netbird:0.72.4"
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - "netbird status 2>/dev/null | grep -qi connected"
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        env:
          - name: NB_SETUP_KEY
            valueFrom:
              secretKeyRef:
                name: setup-key-headlamp  # pragma: allowlist secret
                key: setup-key  # pragma: allowlist secret
          - name: NB_MANAGEMENT_URL
            value: https://api.netbird.io
          - name: NB_LOG_LEVEL
            value: info
          - name: NB_LOG_FILE
            value: console
          - name: NB_DISABLE_PROFILES
            value: "true"
          - name: NB_DISABLE_UPDATE_SETTINGS
            value: "true"
          - name: NB_DAEMON_ADDR
            value: unix:///var/run/netbird/netbird.sock
          - name: NB_ENTRYPOINT_SERVICE_TIMEOUT
            value: "0"
        securityContext:
          privileged: true
          runAsUser: 0
          runAsNonRoot: false
          capabilities:
            add:
              - NET_ADMIN
              - SYS_RESOURCE
              - SYS_ADMIN
        volumeMounts:
          - name: netbird-run
            mountPath: /var/run/netbird
          - name: netbird-lib
            mountPath: /var/lib/netbird
    volumes:
      - name: headlamp-tls
        secret:
          secretName: headlamp-tls
      - name: homescale-theme-plugin
        configMap:
          name: headlamp-homescale-theme-plugin
      - name: homescale-favicon
        configMap:
          name: headlamp-favicon
      - name: netbird-run
        emptyDir: {}
      - name: netbird-lib
        emptyDir: {}
      - name: headlamp-multicluster
        secret:
          secretName: headlamp-multicluster-kubeconfig # pragma: allowlist secret
    volumeMounts:
      - name: headlamp-tls
        mountPath: /headlamp-tls
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/main.js
        subPath: main.js
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/package.json
        subPath: package.json
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon.ico
        subPath: favicon.ico
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon-16x16.png
        subPath: favicon-16x16.png
        readOnly: true
      - name: homescale-favicon
        mountPath: /headlamp/frontend/favicon-32x32.png
        subPath: favicon-32x32.png
        readOnly: true
      - name: headlamp-multicluster
        mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
        readOnly: true
