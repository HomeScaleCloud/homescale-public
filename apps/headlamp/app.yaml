path: apps/headlamp
namespace: headlamp
releaseName: headlamp
syncWave: 0
defaultDeploy: false
podSecurity: privileged
netbird:
  policy:
    rules:
      - sources: ["team-infra-plat", "team-sec-plat"]
        protocol: tcp
        ports: ["443"]
  cname:
    - fqdn: REDACTED
      cluster: mgmt
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  headlamp:
    replicaCount: 1
    service:
      port: 443
    config:
      inClusterContextName: "{{ .Values.cluster.name }}"
      tlsCertPath: /headlamp-tls/tls.crt
      tlsKeyPath: /headlamp-tls/tls.key
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: oidc
          hasScopes: true
    probes:
      scheme: HTTPS
    # homescale-theme-plugin is mounted via subPath, which Kubernetes never
    # hot-reloads — kubelet only re-syncs whole-directory ConfigMap mounts.
    # Bump this whenever dist/main.js or package.json changes, or the pod
    # will keep serving the stale plugin bundle until something else forces
    # a restart.
    podAnnotations:
      homescale-theme-plugin-revision: "5"
    # Joins the NetBird mesh so the backend can reach other clusters' real
    # kube-apiservers directly (see templates/setupkey.yaml) — same pattern
    # as apps/metrics' Prometheus/Alloy nb-client sidecars.
    initContainers:
      - name: nb-client
        image: "ghcr.io/netbirdio/netbird:0.72.4"
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - "netbird status 2>/dev/null | grep -qi connected"
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        env:
          - name: NB_SETUP_KEY
            valueFrom:
              secretKeyRef:
                name: setup-key-headlamp  # pragma: allowlist secret
                key: setup-key  # pragma: allowlist secret
          - name: NB_MANAGEMENT_URL
            value: https://api.netbird.io
          - name: NB_LOG_LEVEL
            value: info
          - name: NB_LOG_FILE
            value: console
          - name: NB_DISABLE_PROFILES
            value: "true"
          - name: NB_DISABLE_UPDATE_SETTINGS
            value: "true"
          - name: NB_DAEMON_ADDR
            value: unix:///var/run/netbird/netbird.sock
          - name: NB_ENTRYPOINT_SERVICE_TIMEOUT
            value: "0"
        securityContext:
          privileged: true
          runAsUser: 0
          runAsNonRoot: false
          capabilities:
            add:
              - NET_ADMIN
              - SYS_RESOURCE
              - SYS_ADMIN
        volumeMounts:
          - name: netbird-run
            mountPath: /var/run/netbird
          - name: netbird-lib
            mountPath: /var/lib/netbird
    volumes:
      - name: headlamp-tls
        secret:
          secretName: headlamp-tls
      - name: homescale-theme-plugin
        configMap:
          name: headlamp-homescale-theme-plugin
      - name: netbird-run
        emptyDir: {}
      - name: netbird-lib
        emptyDir: {}
      - name: headlamp-multicluster
        secret:
          secretName: headlamp-multicluster-kubeconfig # pragma: allowlist secret
    volumeMounts:
      - name: headlamp-tls
        mountPath: /headlamp-tls
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/main.js
        subPath: main.js
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/package.json
        subPath: package.json
        readOnly: true
      - name: headlamp-multicluster
        # Headlamp's backend always checks this exact hardcoded path for an
        # additional/"dynamic" kubeconfig on top of its in-cluster context —
        # confirmed via `error loading dynamic kubeconfig: ... open
        # /home/headlamp/.config/Headlamp/kubeconfigs/config: no such file`
        # in its logs before this mount existed. No -kubeconfig flag or
        # KUBECONFIG env var is wired up by this chart (0.44.0) at all, so
        # this is the only way in.
        mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
        readOnly: true
