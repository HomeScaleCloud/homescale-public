path: apps/headlamp
namespace: headlamp
releaseName: headlamp
syncWave: 0
defaultDeploy: false
netbird:
  policy:
    rules:
      - sources: ["team-infra-plat", "team-sec-plat"]
        protocol: tcp
        ports: ["443"]
  cname:
    - fqdn: REDACTED
      cluster: mgmt
values:
  cluster:
    name: "{{ .Values.cluster.name }}"
  headlamp:
    replicaCount: 1
    service:
      port: 443
    config:
      inClusterContextName: "{{ .Values.cluster.name }}"
      tlsCertPath: /headlamp-tls/tls.crt
      tlsKeyPath: /headlamp-tls/tls.key
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: oidc
          hasScopes: true
    probes:
      scheme: HTTPS
    # homescale-theme-plugin is mounted via subPath, which Kubernetes never
    # hot-reloads — kubelet only re-syncs whole-directory ConfigMap mounts.
    # Bump this whenever dist/main.js or package.json changes, or the pod
    # will keep serving the stale plugin bundle until something else forces
    # a restart.
    podAnnotations:
      homescale-theme-plugin-revision: "4"
    volumes:
      - name: headlamp-tls
        secret:
          secretName: headlamp-tls
      - name: homescale-theme-plugin
        configMap:
          name: headlamp-homescale-theme-plugin
    volumeMounts:
      - name: headlamp-tls
        mountPath: /headlamp-tls
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/main.js
        subPath: main.js
        readOnly: true
      - name: homescale-theme-plugin
        mountPath: /headlamp/plugins/homescale-theme/package.json
        subPath: package.json
        readOnly: true
