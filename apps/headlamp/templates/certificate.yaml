apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-tls
  namespace: headlamp
spec:
  secretName: headlamp-tls
  issuerRef:
    name: {{ .Values.certIssuer | default "letsencrypt" }}
    kind: ClusterIssuer
{{- $homescale := default (dict) .Values.homescale }}
{{- $shortName := required "env.shortName is required" .Values.env.shortName }}
{{- $dnsNames := concat (list (printf "console.%REDACTED" $shortName)) (default (list) $homescale.exposePublicFqdns) | uniq }}
  dnsNames:
{{- range $dnsNames }}
    - {{ . }}
{{- end }}
