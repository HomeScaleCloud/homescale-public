apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-tls
  namespace: headlamp
spec:
  secretName: headlamp-tls
  issuerRef:
    name: {{ .Values.certIssuer | default "letsencrypt" }}
    kind: ClusterIssuer
{{- $homescale := default (dict) .Values.homescale }}
{{- $envName := required "env.name is required" .Values.env.name }}
{{- $dnsNames := concat (list (printf "headlamp.headlamp.%REDACTED" $envName) (printf "headlamp.%REDACTED" $envName)) (default (list) $homescale.exposePublicFqdns) | uniq }}
  dnsNames:
{{- range $dnsNames }}
    - {{ . }}
{{- end }}
