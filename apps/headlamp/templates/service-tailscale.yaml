apiVersion: v1
kind: Service
metadata:
  name: headlamp-tailscale
  namespace: headlamp
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-headlamp,tag:cluster-{{ required "cluster.name is required" .Values.cluster.name }}"
    tailscale.com/hostname: "headlamp-{{ required "cluster.name is required" .Values.cluster.name }}"
    tailscale.com/proxy-group: ingress
    # A friendly short name (console.<prod|dev>, not headlamp.<cluster>) within
    # the standard <name>.<cluster-or-shortname>REDACTED pattern
    # every other Tailscale-exposed Service in this repo uses — tailnet-only
    # (no Cloudflare Tunnel/public exposure), no admission-policy exception
    # needed since it still ends in REDACTED.
    external-dns.kubernetes.io/hostname: "console.{{ required "cluster.shortName is required" .Values.cluster.shortName }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
