apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: headlamp
  namespace: headlamp
spec:
  name: headlamp-{{ required "cluster.name is required" .Values.cluster.name }}
  ephemeral: true
  duration: 24h
  autoGroups:
    - name: cluster-{{ required "cluster.name is required" .Values.cluster.name }}
    - name: app-headlamp
