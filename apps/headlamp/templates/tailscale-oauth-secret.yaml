apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-tailscale-oauth
  namespace: headlamp
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/tailscale"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: headlamp-tailscale-oauth # pragma: allowlist secret
      secretNamespace: headlamp
      creationPolicy: Owner
      secretType: Opaque
      template:
        includeAllSecrets: true
        metadata: {}
