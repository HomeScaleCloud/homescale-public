# Multi-cluster kubeconfig for Headlamp: one OIDC context per cluster in the
# HEADLAMP_CLUSTERS list (infra/terraform/headlamp.tf, derived from which
# clusters/*/cluster.yaml reference infra/omni/patches/oidc.yaml — no
# per-cluster Helm value to maintain here), targeting each cluster's real
# kube-apiserver over the NetBird mesh rather than ClusterProxy — ClusterProxy
# impersonates by NetBird peer identity, which would collapse every Headlamp
# browser user into one identity. Kept as its own InfisicalSecret (rather than
# folded into templates/secret.yaml's `oidc` secret) so a bug in this dynamic
# templating can't also break the OIDC login args mgmt's context depends on.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-oidc-multicluster-kubeconfig
  namespace: headlamp
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/oidc"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: headlamp-multicluster-kubeconfig # pragma: allowlist secret
      secretNamespace: headlamp
      creationPolicy: Owner
      secretType: Opaque
      template:
        metadata: {} # blocks copying ArgoCD's tracking-id annotation, which otherwise gets this secret pruned every sync
        data:
          config: |
            apiVersion: v1
            kind: Config
            clusters:
            {{`{{- $clusters := splitList "," .HEADLAMP_CLUSTERS.Value }}`}}
            {{`{{- range $clusters }}`}}
            {{`{{- if . }}`}}
            - name: {{`{{ . }}`}}
              cluster:
                server: https://kubernetes.default.{{`{{ . }}`}}REDACTED
                insecure-skip-tls-verify: true
            {{`{{- end }}`}}
            {{`{{- end }}`}}
            contexts:
            {{`{{- range $clusters }}`}}
            {{`{{- if . }}`}}
            - name: {{`{{ . }}`}}
              context:
                cluster: {{`{{ . }}`}}
                user: oidc
            {{`{{- end }}`}}
            {{`{{- end }}`}}
            current-context: {{`{{ if $clusters }}{{ first $clusters }}{{ else }}main{{ end }}`}}
            users:
            - name: oidc
              user:
                auth-provider:
                  name: oidc
                  config:
                    client-id: {{`{{ .OIDC_CLIENT_ID.Value }}`}}
                    client-secret: {{`{{ .OIDC_CLIENT_SECRET.Value }}`}}
                    idp-issuer-url: {{`{{ .OIDC_ISSUER_URL.Value }}`}}
