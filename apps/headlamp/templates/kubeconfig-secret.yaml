apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8s-oidc-multicluster-kubeconfig
  namespace: headlamp
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/oidc"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: headlamp-multicluster-kubeconfig # pragma: allowlist secret
      secretNamespace: headlamp
      creationPolicy: Owner
      secretType: Opaque
      template:
        metadata: {} # blocks copying ArgoCD's tracking-id annotation, which otherwise gets this secret pruned every sync
        data:
          config: |
            apiVersion: v1
            kind: Config
            clusters:
            {{`{{- $clusters := splitList "," .HEADLAMP_CLUSTERS.Value }}`}}
            {{`{{- range $clusters }}`}}
            {{`{{- if . }}`}}
            - name: {{`{{ . }}`}}
              cluster:
                server: https://k8s-api-{{`{{ . }}`}}.headlamp.svc.cluster.local
                tls-server-name: k8s.api.{{`{{ . }}`}}REDACTED
            {{`{{- end }}`}}
            {{`{{- end }}`}}
            contexts:
            {{`{{- range $clusters }}`}}
            {{`{{- if . }}`}}
            - name: {{`{{ . }}`}}
              context:
                cluster: {{`{{ . }}`}}
                user: oidc
            {{`{{- end }}`}}
            {{`{{- end }}`}}
            current-context: {{`{{ if $clusters }}{{ first $clusters }}{{ else }}main{{ end }}`}}
            users:
            - name: oidc
              user:
                auth-provider:
                  name: oidc
                  config:
                    client-id: {{`{{ .OIDC_CLIENT_ID.Value }}`}}
                    client-secret: {{`{{ .OIDC_CLIENT_SECRET.Value }}`}}
                    idp-issuer-url: {{`{{ .OIDC_ISSUER_URL.Value }}`}}
                    scope: {{`{{ .OIDC_SCOPES.Value }}`}}
