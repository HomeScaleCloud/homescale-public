apiVersion: v1
kind: Service
metadata:
  name: "mc"
  labels:
    REDACTED/name: "{{ .Release.Name }}"
  annotations:
    tailscale.com/tags: "tag:k8s,tag:app-homecraft,tag:env-{{ required "env.name is required" .Values.env.name }}"
    tailscale.com/hostname: "mc-{{ required "env.name is required" .Values.env.name }}"
    tailscale.com/proxy-group: ingress
    external-dns.kubernetes.io/hostname: "homecraft.{{ required "env.name is required" .Values.env.name }}REDACTED"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - name: minecraft
    port: 25565
    targetPort: minecraft
    protocol: TCP
  selector:
    app: "{{ .Release.Name }}-minecraft"
