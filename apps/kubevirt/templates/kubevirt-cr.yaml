apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  # Enables the operator's Prometheus integration (ServiceMonitor + scrape RBAC).
  # monitorAccount must already exist in monitorNamespace or the operator
  # silently skips creating the monitoring resources.
  monitorNamespace: metrics
  monitorAccount: metrics-kube-prometheus-st-prometheus
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
    smbios:
      sku: "HomeScale"
      version: "v0.1.0"
      manufacturer: "HomeScale"
      product: "homescale-vm"
      family: "ccio"
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
