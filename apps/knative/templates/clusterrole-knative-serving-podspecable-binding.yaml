kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: knative-serving-podspecable-binding
  labels:
    app.kubernetes.io/version: 1.23.0
    app.kubernetes.io/name: knative-serving
    duck.knative.dev/podspecable: 'true'
rules:
- apiGroups:
  - serving.knative.dev
  resources:
  - configurations
  - services
  verbs:
  - list
  - watch
  - patch
