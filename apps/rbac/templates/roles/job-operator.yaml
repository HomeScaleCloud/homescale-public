apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-operator
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
    verbs: ["get"]
  - apiGroups: ["REDACTED"]
    resources:
      - jobruns
      - jobworkflowruns
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["REDACTED"]
    resources:
      - jobtemplates
    verbs: ["get", "list"]
  - apiGroups: ["REDACTED"]
    resources:
      - jobworkflows
    # create is for `hsctl run --chain`'s ad hoc JobWorkflow — jobtemplates stays git-only
    # (get/list), since there's no ad hoc equivalent for those.
    verbs: ["create", "get", "list"]
