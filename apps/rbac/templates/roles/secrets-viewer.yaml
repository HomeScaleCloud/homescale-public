apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-viewer
rules:
  # Deliberately excludes core v1 Secrets (get/list/watch would expose decoded
  # values). InfisicalSecret specs only carry path/scope, not decrypted content.
  - apiGroups: ["secrets.infisical.com"]
    resources:
      - clustergenerators
      - infisicalauths
      - infisicalconnections
      - infisicaldynamicsecrets
      - infisicalpushsecrets
      - infisicalsecrets
      - infisicalstaticsecrets
    verbs: ["get", "list", "watch"]
