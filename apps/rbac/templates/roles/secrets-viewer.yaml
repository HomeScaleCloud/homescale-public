apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-viewer
rules:
  # Deliberately does not grant access to core v1 Secrets: RBAC has no
  # field-level redaction, so get/list/watch on Secrets would expose decoded
  # values. InfisicalSecret specs only carry the Infisical path/scope and the
  # target Secret name, never the decrypted value, so this is visibility into
  # what's synced and from where without exposing secret contents.
  - apiGroups: ["secrets.infisical.com"]
    resources:
      - clustergenerators
      - infisicalauths
      - infisicalconnections
      - infisicaldynamicsecrets
      - infisicalpushsecrets
      - infisicalsecrets
      - infisicalstaticsecrets
    verbs: ["get", "list", "watch"]
