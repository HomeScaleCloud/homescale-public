apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-admin
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/status
    verbs: ["*"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["*"]
  - apiGroups: ["node.k8s.io"]
    resources:
      - runtimeclasses
    verbs: ["*"]
  - apiGroups: ["certificates.k8s.io"]
    resources:
      - certificatesigningrequests
    verbs: ["*"]
  - apiGroups: ["nfd.k8s-sigs.io"]
    resources:
      - nodefeatures
      - nodefeaturerules
      - nodefeaturegroups
    verbs: ["*"]
