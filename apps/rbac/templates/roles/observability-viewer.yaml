apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-viewer
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.grafana.com"]
    resources:
      - podlogs
    verbs: ["get", "list", "watch"]
  # Headlamp's built-in prometheus plugin proxies to Prometheus's HTTP API
  # through the k8s API server rather than a direct network route. Scoped to
  # apps/metrics' prometheus-proxy Service (not prometheus-operated or
  # metrics-kube-prometheus-st-prometheus): headless Services aren't proxied
  # by the platform at all, and an unqualified services/proxy request to a
  # multi-port Service can't be disambiguated -- both fail with "no
  # endpoints available" regardless of RBAC (see apps/argocd's
  # argocd-server, which hits the multi-port version of this).
  - apiGroups: [""]
    resources:
      - services/proxy
    resourceNames:
      - prometheus-proxy
    verbs: ["get"]
