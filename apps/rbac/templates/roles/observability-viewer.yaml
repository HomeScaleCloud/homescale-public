apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-viewer
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.grafana.com"]
    resources:
      - podlogs
    verbs: ["get", "list", "watch"]
  # Headlamp's prometheus plugin proxies through the k8s API server to
  # apps/metrics' prometheus-proxy Service. Both resourceNames are needed:
  # resourceNames has no wildcards, and the plugin requests
  # "prometheus-proxy:9090" (service+port) when given a namespace/service:port address.
  - apiGroups: [""]
    resources:
      - services/proxy
    resourceNames:
      - prometheus-proxy
      - prometheus-proxy:9090
    verbs: ["get"]
