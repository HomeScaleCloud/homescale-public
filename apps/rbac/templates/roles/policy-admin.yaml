apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: policy-admin
rules:
  - apiGroups: ["kyverno.io"]
    resources:
      - cleanuppolicies
      - clustercleanuppolicies
      - clusterpolicies
      - globalcontextentries
      - policies
      - policyexceptions
      - updaterequests
    verbs: ["*"]
  - apiGroups: ["policies.kyverno.io"]
    resources:
      - deletingpolicies
      - generatingpolicies
      - imagevalidatingpolicies
      - mutatingpolicies
      - namespaceddeletingpolicies
      - namespacedgeneratingpolicies
      - namespacedimagevalidatingpolicies
      - namespacedmutatingpolicies
      - namespacedvalidatingpolicies
      - policyexceptions
      - validatingpolicies
    verbs: ["*"]
  # Reports are generated by Kyverno's own controllers, not hand-authored --
  # even admins only need to read them, not create/delete individual reports.
  - apiGroups: ["reports.kyverno.io", "wgpolicyk8s.io"]
    resources:
      - clusterephemeralreports
      - ephemeralreports
      - clusterpolicyreports
      - policyreports
    verbs: ["get", "list", "watch"]
