apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: networking-admin
rules:
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
      - ingressclasses
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["*"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
      - serverstransporttcps
    verbs: ["*"]
  - apiGroups: ["netbird.io"]
    resources:
      - networkresources
      - networkrouters
    verbs: ["*"]
