apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: networking-admin
rules:
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
      - ingressclasses
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["*"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
      - serverstransporttcps
    verbs: ["*"]
  - apiGroups: ["netbird.io"]
    resources:
      - clusterproxies
      - groups
      - nbgroups
      - nbpolicies
      - nbresources
      - nbroutingpeers
      - nbsetupkeys
      - networkegresses
      - networkresources
      - networkrouters
      - setupkeys
      - sidecarprofiles
    verbs: ["*"]
  - apiGroups: ["crd.projectcalico.org"]
    resources:
      - bgpconfigurations
      - bgpfilters
      - bgppeers
      - blockaffinities
      - caliconodestatuses
      - clusterinformations
      - felixconfigurations
      - globalnetworkpolicies
      - globalnetworksets
      - hostendpoints
      - ipamblocks
      - ipamconfigs
      - ipamhandles
      - ippools
      - ipreservations
      - kubecontrollersconfigurations
      - networkpolicies
      - networksets
      - stagedglobalnetworkpolicies
      - stagedkubernetesnetworkpolicies
      - stagednetworkpolicies
      - tiers
    verbs: ["*"]
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["*"]
