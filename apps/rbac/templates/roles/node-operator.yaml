apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-operator
rules:
  # Cordon/uncordon and taint. No delete — that detaches the Node from the cluster.
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]
  # status.conditions lives behind the /status subresource — needed to set
  # or clear conditions manually (e.g. out-of-band health signals).
  - apiGroups: [""]
    resources:
      - nodes/status
    verbs: ["patch", "update"]
