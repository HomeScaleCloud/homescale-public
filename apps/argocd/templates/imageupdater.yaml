apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homescale-apps
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^[0-9a-f]{40}$"
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: homepage
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/homepage:latest
          manifestTargets:
            helm:
              tag: image.tag
    - namePattern: maxmorris-io
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/maxmorris-io:latest
          manifestTargets:
            helm:
              tag: image.tag
    # slurm is multi-source (local chart + two extraSources); the tag path is
    # scoped to source[0]'s values tree since that's the only source we build
    # an image for. Multi-source targeting isn't documented for argocd
    # write-back — verify it lands on source[0] after this first deploys.
    - namePattern: slurm
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/slurm-login:latest
          manifestTargets:
            helm:
              tag: slurm.loginsets.login.login.image.tag
