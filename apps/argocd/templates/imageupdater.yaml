apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homescale-apps
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^[0-9a-f]{40}$"
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: homepage
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/homepage:latest
          manifestTargets:
            helm:
              tag: image.tag
    - namePattern: maxmorris-io
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/maxmorris-io:latest
          manifestTargets:
            helm:
              tag: image.tag
    - namePattern: github-runner
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/github-runner:latest
          manifestTargets:
            helm:
              # gha-runner-scale-set's template.spec.containers[].image is one combined
              # field (no separate repository/tag values like our own charts have), so
              # this writes back the full image reference rather than just the tag.
              spec: gha-runner-scale-set.template.spec.containers[0].image
