apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homescale-apps
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^[0-9a-f]{40}$"
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: homepage
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/homepage:latest
          manifestTargets:
            helm:
              tag: image.tag
    - namePattern: maxmorris-io
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/maxmorris-io:latest
          manifestTargets:
            helm:
              tag: image.tag
    # "slurm" is a multi-source Application (apps/slurm's local chart plus
    # two extraSources pulling slurm-operator/slurm-operator-crds directly
    # from Slinky's OCI registry) — the tag path below is scoped into the
    # first source's own values tree (slurm.loginsets.login.login.image.tag
    # in apps/slurm/app.yaml), since that's the only source we build an
    # image for. Multi-source targeting isn't documented for the argocd
    # write-back method; verify this actually lands on source[0] and not
    # one of the extraSources after this first deploys.
    - namePattern: slurm
      images:
        - alias: img
          imageName: ghcr.io/homescalecloud/slurm-login:latest
          manifestTargets:
            helm:
              tag: slurm.loginsets.login.login.image.tag
