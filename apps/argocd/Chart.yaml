apiVersion: v2
name: argocd
description: Helm chart for ArgoCD
version: 0.1.0
dependencies:
  - name: argo-cd
    version: "10.15.0"
    repository: https://argoproj.github.io/argo-helm
  - name: argocd-image-updater
    version: "1.4.2"
    repository: https://argoproj.github.io/argo-helm
annotations:
  REDACTED/namespace: "argocd"
  REDACTED/sync-wave: "-30"
  REDACTED/default-deploy: "true"
  REDACTED/sync-options: "ServerSideApply=true"
  REDACTED/ignore-differences: |
    - group: ''
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data
