kind: Cluster
name: boa1-lab
kubernetes:
  version: v1.37.0
talos:
  version: v1.14.0
features:
  useEmbeddedDiscoveryService: true
  backupConfiguration:
    interval: 1h
patches:
  - file: patches/base-1.14.yaml
  - file: patches/kubelet-certs-1.14.yaml
---
kind: ControlPlane
machines:
  - 11a9fe00-3f45-11ed-8000-3cecefaab010
patches:
  - name: install-disk
    inline:
      machine:
        install:
          diskSelector:
            type: 'nvme'
  - name: nics
    inline:
      machine:
        network:
          interfaces:
            - interface: bond0
              dhcp: true
              bond:
                mode: 802.3ad
                lacpRate: fast
                xmitHashPolicy: layer3+4
                miimon: 100
                interfaces:
                  - eno1
                  - eno2
              vlans:
                - vlanId: 241
                - vlanId: 271
