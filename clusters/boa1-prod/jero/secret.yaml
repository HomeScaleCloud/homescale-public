apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: jero-tailscale
  namespace: jero
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "homescale"
        envSlug: "prod"
        secretsPath: "/k8s/jero"
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: jero-tailscale
      secretNamespace: jero
      creationPolicy: Owner
      secretType: Opaque
