kind: Cluster
name: max-dev
kubernetes:
  version: v1.36.3
talos:
  version: v1.13.8
features:
  useEmbeddedDiscoveryService: true
  backupConfiguration:
    interval: 1h
patches:
  - file: patches/base.yaml
  - file: patches/allow-scheduling-on-control-plane.yaml
  - file: patches/kubelet-certs.yaml
  - file: patches/oidc.yaml
systemExtensions:
  - siderolabs/util-linux-tools
---
kind: ControlPlane
machineClass:
  name: max-dev
  size: 3
