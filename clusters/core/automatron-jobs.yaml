apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automatron-jobs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:HomeScaleCloud/homescale.git
    targetRevision: main
    path: infra/automatron
    directory:
      recurse: true
      # ansible/ is git-cloned at runtime by automatron's own pods (see
      # apps/automatron/entrypoint.sh), not applied as Kubernetes manifests — but its
      # playbooks/roles are still plain .yml files, which ArgoCD's directory source would
      # otherwise glob and try to parse as K8s objects, breaking this Application's sync.
      exclude: 'ansible/**'
  destination:
    server: https://kubernetes.default.svc
    namespace: automatron
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
