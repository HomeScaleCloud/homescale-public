---
- name: Bootstrap core cluster
  hosts: localhost
  gather_facts: false

  vars:
    cluster_name: core
    kubeconfig_secret_key: "{{ cluster_name | upper | replace('-', '_') }}_KUBECONFIG"
    kubeconfig_path: "/tmp/kubeconfig-{{ cluster_name }}"
    omni_cluster_name: "{{ cluster_name }}"

  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig_path }}"

  pre_tasks:
    # Automatron reuses the k8s Infisical Operator's identity rather than a
    # dedicated one (machine identities are billed per-identity). `hsctl run`
    # (local) has no such credential, so it pre-fetches secrets itself and
    # passes them in as hsctl_local_secrets, skipping these tasks entirely.
    - name: Login to Infisical
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: universal_auth
        universal_auth_client_id: "{{ lookup('env', 'INFISICAL_OPERATOR_CLIENT_ID') }}"
        universal_auth_client_secret: "{{ lookup('env', 'INFISICAL_OPERATOR_CLIENT_SECRET') }}"
      register: _infisical
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Read cluster kubeconfig from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ _infisical.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_env_slug }}"
        path: /k8s/automatron
        as_dict: true
      register: _core_kubeconfig_secrets
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Use cluster kubeconfig fetched locally via the infisical CLI
      ansible.builtin.set_fact:
        _core_kubeconfig_secrets:
          secrets: "{{ hsctl_local_secrets.core_kubeconfig }}"
      no_log: true
      when: hsctl_local | default(false)

    - name: Write kubeconfig
      ansible.builtin.copy:
        content: "{{ _core_kubeconfig_secrets.secrets[kubeconfig_secret_key] }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      no_log: true

    - name: Wait for k8s API
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
      register: _api_probe
      retries: 6
      delay: 10
      until: _api_probe is not failed

  roles:
    - cluster-secrets
    - argocd

  post_tasks:
    - name: Remove temporary kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_path }}"
        state: absent
