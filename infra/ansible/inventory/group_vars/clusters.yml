---
ansible_connection: local
talos_cluster_name: "{{ inventory_hostname }}"
# hsctl run talm pushes each cluster's break-glass admin kubeconfig to this Infisical path
# after bootstrap (see _run_talm in hsctl.d/run.sh) — the only two clusters that will ever
# exist, so a small inline map beats inventing a shortName lookup mechanism ansible has no
# other reason to need.
talos_shortname: "{{ {'production': 'prod', 'development': 'dev'}[inventory_hostname] }}"
