---
- name: Bootstrap clusters
  hosts: "{{ target | default('clusters') }}"
  gather_facts: false

  vars:
    kubeconfig_path: "/tmp/kubeconfig-{{ talos_cluster_name }}"
    infisical_url: https://app.infisical.com
    infisical_project_id: "{{ lookup('env', 'INFISICAL_PROJECT_ID') }}"
    infisical_env_slug: prod

  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig_path }}"

  pre_tasks:
    # The break-glass admin kubeconfig Terraform's talos module writes to Infisical (see
    # infra/terraform/modules/talos/kubeconfig.tf) — CI authenticates via GitHub Actions
    # OIDC the same way cluster-secrets' own role does; `hsctl run` (local) pre-fetches via
    # the already-logged-in `infisical` CLI instead (see _run_bootstrap_local), skipping
    # straight to writing the file below.
    - name: Login to Infisical
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: oidc_auth
        identity_id: "{{ lookup('env', 'INFISICAL_IDENTITY_ID') }}"
        jwt: "{{ lookup('env', 'INFISICAL_AUTH_JWT') }}"
      register: _infisical
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Read cluster kubeconfig from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ _infisical.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_env_slug }}"
        path: "/k8s/talos/{{ talos_shortname }}"
        as_dict: true
      register: _talos_kubeconfig_secret
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Write cluster kubeconfig (CI)
      ansible.builtin.copy:
        content: "{{ _talos_kubeconfig_secret.secrets.KUBECONFIG }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Write cluster kubeconfig (local)
      ansible.builtin.copy:
        content: "{{ hsctl_local_secrets.talos_kubeconfig[talos_cluster_name].KUBECONFIG }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      no_log: true
      when: hsctl_local | default(false)

    - name: Wait for k8s API to be reachable
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
      register: _api_probe
      retries: 2
      delay: 5
      until: _api_probe is not failed

  roles:
    - cluster-secrets
    - cilium
    - argocd

  post_tasks:
    - name: Remove temporary kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_path }}"
        state: absent
