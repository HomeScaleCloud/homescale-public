---
- name: Bootstrap clusters
  hosts: "{{ target | default('clusters') }}"
  gather_facts: false

  vars:
    hsctl_repo_root: "{{ lookup('env', 'HSCTL_REPO_ROOT') | default(playbook_dir + '/../../..', true) }}"
    kubeconfig_path: "{{ _bootstrap_workspace.path }}/kubeconfig"
    infisical_url: https://app.infisical.com
    infisical_project_id: "{{ lookup('env', 'INFISICAL_PROJECT_ID') }}"
    infisical_env_slug: prod
    _topf_config: "{{ lookup('file', hsctl_repo_root + '/clusters/' + talos_cluster_name + '/topf.yaml') | from_yaml }}"

  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"

  pre_tasks:
    - name: Skip clusters whose initial bootstrap is complete
      ansible.builtin.meta: end_host
      when: (_topf_config.data | default({})).bootstrapComplete | default(false) | bool

    - name: Allocate a private bootstrap workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: hsctl-bootstrap-
      register: _bootstrap_workspace

  tasks:
    - name: Configure Talos and install cluster services
      block:
        - name: Bootstrap Talos from the LAN
          ansible.builtin.include_tasks: ../tasks/bootstrap-talos.yml
          when: hsctl_local | default(false) | bool

        - name: Load short-lived cluster credentials
          ansible.builtin.include_tasks: ../tasks/cluster-credentials.yml
          vars:
            cluster_credentials_dir: "{{ _bootstrap_workspace.path }}"

        - name: Wait for the Kubernetes API to respond
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: kube-system
          register: _api_probe
          retries: 12
          delay: 5
          until: _api_probe is not failed

        - name: Seed cluster credentials
          ansible.builtin.include_role:
            name: cluster-secrets

        - name: Install Cilium
          ansible.builtin.include_role:
            name: cilium

        - name: Install ArgoCD
          ansible.builtin.include_role:
            name: argocd

      always:
        - name: Remove private bootstrap files
          ansible.builtin.file:
            path: "{{ _bootstrap_workspace.path }}"
            state: absent
