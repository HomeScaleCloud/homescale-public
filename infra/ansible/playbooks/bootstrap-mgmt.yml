---
- name: Bootstrap mgmt-class cluster
  hosts: localhost
  gather_facts: false

  vars:
    cluster_name: mgmt
    kubeconfig_secret_key: "{{ cluster_name | upper | replace('-', '_') }}_KUBECONFIG"
    kubeconfig_path: "/tmp/kubeconfig-{{ cluster_name }}"
    omni_cluster_name: "{{ cluster_name }}"

  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig_path }}"

  pre_tasks:
    # CI authenticates via GitHub Actions OIDC (INFISICAL_IDENTITY_ID/INFISICAL_AUTH_JWT).
    # `hsctl run` (local) has no such JWT to present, so it pre-fetches the same secrets
    # itself via the already-logged-in `infisical` CLI and passes them in as
    # hsctl_local_secrets, skipping these two tasks entirely.
    - name: Login to Infisical
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: oidc_auth
        identity_id: "{{ lookup('env', 'INFISICAL_IDENTITY_ID') }}"
        jwt: "{{ lookup('env', 'INFISICAL_AUTH_JWT') }}"
      register: _infisical
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Read cluster kubeconfig from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ _infisical.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_env_slug }}"
        path: /github-actions
        as_dict: true
      register: _github_actions_secrets
      no_log: true
      when: not (hsctl_local | default(false))

    - name: Use cluster kubeconfig fetched locally via the infisical CLI
      ansible.builtin.set_fact:
        _github_actions_secrets:
          secrets: "{{ hsctl_local_secrets.github_actions }}"
      no_log: true
      when: hsctl_local | default(false)

    - name: Skip if kubeconfig not yet available
      when: >
        _github_actions_secrets.secrets[kubeconfig_secret_key] is not defined
        or not _github_actions_secrets.secrets[kubeconfig_secret_key]
      ansible.builtin.meta: end_play

    - name: Write kubeconfig
      ansible.builtin.copy:
        content: "{{ _github_actions_secrets.secrets[kubeconfig_secret_key] }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      no_log: true

    - name: Wait for k8s API
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
      register: _api_probe
      retries: 6
      delay: 10
      until: _api_probe is not failed

  roles:
    - cluster-secrets
    - argocd

  post_tasks:
    - name: Remove temporary kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_path }}"
        state: absent
