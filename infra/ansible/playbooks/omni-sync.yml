---
# Syncs every cluster template and machine class into Omni. Idempotent:
# always processes everything, no diff detection.
- name: Sync Omni cluster templates and machine classes
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # Named distinctly from the `dry_run` extra var: extra vars take precedence
    # over vars, so reusing the name here would keep the raw string "false"
    # (truthy in Jinja) instead of the cast bool.
    is_dry_run: "{{ dry_run | default(false) | bool }}"
    repo_root: "{{ playbook_dir }}/../../.."
    omni_endpoint: "{{ lookup('env', 'OMNI_ENDPOINT') | default('https://REDACTED', true) }}"

  environment:
    OMNI_ENDPOINT: "{{ omni_endpoint }}"
    OMNI_SERVICE_ACCOUNT_KEY: "{{ lookup('env', 'OMNI_SERVICE_ACCOUNT_KEY') }}"

  tasks:
    # Shells out to find rather than ansible.builtin.find: that module's
    # recurse has no depth limit and would pick up a cluster.yaml nested
    # deeper than clusters/<name>/.
    - name: Discover cluster templates
      ansible.builtin.command:
        cmd: "find {{ repo_root }}/clusters -mindepth 2 -maxdepth 2 -name cluster.yaml"
      register: _cluster_find
      changed_when: false

    - name: Discover machine classes
      ansible.builtin.find:
        paths: "{{ repo_root }}/infra/omni/machineclasses"
        patterns: "*.yaml"
      register: _machineclass_files
      ignore_errors: true

    - name: Sync each cluster template
      ansible.builtin.shell: |
        set -euo pipefail
        tmpdir=$(mktemp -d)
        trap 'rm -rf "$tmpdir"' EXIT
        cluster_name={{ (item | dirname | basename) | quote }}
        CLUSTER_NAME="$cluster_name" envsubst '${CLUSTER_NAME}' < {{ item | quote }} > "$tmpdir/cluster.yaml"
        mkdir -p "$tmpdir/patches"
        for pf in {{ repo_root | quote }}/infra/omni/patches/*.yaml; do
          [ -f "$pf" ] || continue
          CLUSTER_NAME="$cluster_name" envsubst '${CLUSTER_NAME}' < "$pf" > "$tmpdir/patches/$(basename "$pf")"
        done
        omnictl cluster template sync -f "$tmpdir/cluster.yaml"{{ ' --dry-run' if is_dry_run else '' }}
      args:
        executable: /bin/bash
      loop: "{{ _cluster_find.stdout_lines }}"
      loop_control:
        label: "{{ item | dirname | basename }}"
      changed_when: true

    - name: Apply each machine class
      ansible.builtin.command:
        cmd: "omnictl apply -f {{ item.path }}{{ ' --dry-run' if is_dry_run else '' }}"
      loop: "{{ _machineclass_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _machineclass_files.files is defined
      changed_when: true
