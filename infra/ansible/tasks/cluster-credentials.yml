---
- name: Request a fresh GitHub OIDC token for this cluster
  ansible.builtin.uri:
    url: "{{ lookup('env', 'ACTIONS_ID_TOKEN_REQUEST_URL') }}"
    headers:
      Authorization: "Bearer {{ lookup('env', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN') }}"
    return_content: true
  register: _cluster_oidc
  no_log: true
  when:
    - not (hsctl_local | default(false) | bool)
    - lookup('env', 'ACTIONS_ID_TOKEN_REQUEST_URL') | length > 0

- name: Login to Infisical
  infisical.vault.login:
    url: "{{ infisical_url }}"
    auth_method: oidc_auth
    identity_id: "{{ lookup('env', 'INFISICAL_IDENTITY_ID') }}"
    jwt: "{{ _cluster_oidc.json.value if _cluster_oidc is not skipped else lookup('env', 'INFISICAL_AUTH_JWT') }}"
  register: _infisical
  no_log: true
  when: not (hsctl_local | default(false))

- name: Read the existing cluster CA bundle
  infisical.vault.read_secrets:
    login_data: "{{ _infisical.login_data }}"
    project_id: "{{ infisical_project_id }}"
    env_slug: "{{ infisical_env_slug }}"
    path: "/k8s/talos/{{ talos_shortname }}"
    as_dict: true
  register: _talos_secrets
  no_log: true
  when: not (hsctl_local | default(false))

- name: Write the private CI bundle
  ansible.builtin.copy:
    content: "{{ _talos_secrets.secrets.SECRETS_YAML }}"
    dest: "{{ cluster_credentials_dir }}/secrets.yaml"
    mode: "0600"
  no_log: true
  when: not (hsctl_local | default(false))

- name: Generate a fresh short-lived admin kubeconfig
  ansible.builtin.shell: >
    umask 077;
    {{ (hsctl_repo_root + '/hsctl') | quote }} run topf --cluster {{ talos_cluster_name | quote }}
    kubeconfig > {{ kubeconfig_path | quote }}
  environment:
    HSCTL_REPO_ROOT: "{{ hsctl_repo_root }}"
    HSCTL_TOPF_SECRETS_FILE: "{{ '' if (hsctl_local | default(false)) else cluster_credentials_dir + '/secrets.yaml' }}"
  no_log: true
