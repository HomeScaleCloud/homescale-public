---
- name: Load Cilium app values
  ansible.builtin.set_fact:
    _cilium_app: >-
      {{
        lookup('file', playbook_dir ~ '/../../../apps/cilium/app.yaml') | from_yaml
      }}

- name: Check if Cilium is already installed
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: cilium
    namespace: kube-system
  register: _cilium_ds

- name: Install Cilium
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install cilium cilium --repo https://helm.cilium.io/
      --version {{ cilium_chart_version | quote }} --namespace kube-system
      --kubeconfig {{ kubeconfig_path | quote }} --wait --timeout 300s
      --reset-values --values -
    stdin: "{{ _cilium_app['values']['cilium'] | to_yaml }}"
  when: _cilium_ds.resources | length == 0
