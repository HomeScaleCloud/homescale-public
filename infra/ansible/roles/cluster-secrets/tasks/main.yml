---
# Both playbooks reuse the cluster login in CI; hsctl supplies local credentials.

- name: Read ArgoCD deploy key from Infisical
  infisical.vault.read_secrets:
    login_data: "{{ _infisical.login_data }}"
    project_id: "{{ infisical_project_id }}"
    env_slug: "{{ infisical_env_slug }}"
    path: /k8s/argocd/deploy-key
    as_dict: true
  register: _argocd_secrets
  no_log: true
  when: not (hsctl_local | default(false))

- name: Read Infisical operator credentials from Infisical
  infisical.vault.read_secrets:
    login_data: "{{ _infisical.login_data }}"
    project_id: "{{ infisical_project_id }}"
    env_slug: "{{ infisical_env_slug }}"
    path: /k8s/infisical
    as_dict: true
  register: _infisical_op_secrets
  no_log: true
  when: not (hsctl_local | default(false))

- name: Use credentials fetched locally via the Infisical CLI
  ansible.builtin.set_fact:
    _argocd_secrets:
      secrets: "{{ hsctl_local_secrets.argocd_deploy_key }}"
    _infisical_op_secrets:
      secrets: "{{ hsctl_local_secrets.infisical_operator }}"
  no_log: true
  when: hsctl_local | default(false)

- name: Ensure service namespaces exist
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    state: present
  loop: [argocd, infisical]
  check_mode: "{{ cluster_secrets_preview }}"

- name: Ensure ArgoCD deploy key matches Infisical
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: homescale-k8s-deploy-key
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        url: "git@github.com:HomeScaleCloud/homescale.git"
        sshPrivateKey: "{{ _argocd_secrets.secrets.sshPrivateKey }}"  # pragma: allowlist secret
  check_mode: "{{ cluster_secrets_preview }}"
  diff: false
  no_log: true

- name: Ensure Infisical operator credentials match Infisical
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-operator-auth
        namespace: infisical
      stringData:
        clientId: "{{ _infisical_op_secrets.secrets.INFISICAL_OPERATOR_CLIENT_ID }}"  # pragma: allowlist secret
        clientSecret: "{{ _infisical_op_secrets.secrets.INFISICAL_OPERATOR_CLIENT_SECRET }}"  # pragma: allowlist secret
  check_mode: "{{ cluster_secrets_preview }}"
  diff: false
  no_log: true
