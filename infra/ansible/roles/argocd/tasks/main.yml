---
- name: Check if ArgoCD is already installed
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: argocd
  register: _argocd_server

- name: Install ArgoCD
  when: _argocd_server.resources | length == 0
  ansible.builtin.command: >-
    helm upgrade --install argocd argo-cd --repo https://argoproj.github.io/argo-helm
    --version {{ argocd_chart_version | quote }} --namespace argocd
    --kubeconfig {{ kubeconfig_path | quote }} --wait --timeout 300s --reset-values

- name: Deploy apps
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir | dirname | dirname | dirname }}/clusters/{{ talos_cluster_name }}/apps.yaml"
