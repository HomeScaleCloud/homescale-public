cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
  apiServer:
    extraArgs:
      oidc-issuer-url: "https://login.microsoftonline.com/REDACTED/v2.0"  # pragma: allowlist secret
      oidc-client-id: "REDACTED"  # pragma: allowlist secret
      oidc-username-claim: email
      oidc-groups-claim: groups
machine:
  files:
    - path: /var/etc/cri/conf.d/20-spegel.part
      op: create
      permissions: 0o000
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
  nodeLabels:
    REDACTED/name: ${CLUSTER_NAME}
